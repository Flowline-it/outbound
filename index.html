/* ---- conti ---- */
function ctOpenConto(id){
  const c=id?ct.conti.find(x=>x.id===id):{nome:'',tipo:'socio',apertura:0};
  const used=id&&ct.mov.some(m=>m.da_conto===id||m.a_conto===id);
  modal(`<div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <div class="modal-h"><h3>${id?'Modifica conto':'Nuovo conto'}</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
    <form onsubmit="ctSaveConto(event,${id||'null'})"><div class="modal-b">
      <div class="form-row"><label for="ct-c-nome">Nome</label><input id="ct-c-nome" required value="${escAttr(c.nome)}"></div>
      <div class="ct-two"><div class="form-row"><label for="ct-c-tipo">Tipo</label><select id="ct-c-tipo"><option value="azienda" ${c.tipo==='azienda'?'selected':''}>Conto aziendale</option><option value="socio" ${c.tipo!=='azienda'?'selected':''}>Conto socio</option></select></div>
        <div class="form-row"><label for="ct-c-ap">Saldo iniziale (€)</label><input id="ct-c-ap" type="number" step="0.01" value="${escAttr(c.apertura)}"></div></div>
      <span class="hint">Il saldo attuale è il saldo iniziale più tutto ciò che entra, meno tutto ciò che esce.</span>
    </div>
    <div class="modal-f" style="justify-content:space-between"><div>${id&&!used?`<button type="button" class="btn sm ghost danger" onclick="ctDeleteConto(${id})">Elimina</button>`:''}</div>
      <div style="display:flex;gap:9px"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" type="submit">Salva</button></div></div></form></div>`);
}
async function ctSaveConto(ev,id){
  ev.preventDefault();
  const rec={nome:ctVal('ct-c-nome').trim(),tipo:ctVal('ct-c-tipo'),apertura:Math.round((parseFloat(ctVal('ct-c-ap'))||0)*100)/100};
  if(!rec.nome)return;
  if(!id)rec.ordine=ct.conti.length+1;
  const q=id?nlSupa.from('conti').update(rec).eq('id',id):nlSupa.from('conti').insert(rec);
  const {data,error}=await q.select('id,nome,tipo,apertura,ordine').single();
  if(error){toast(error.message,'err');return}
  const row={...data,apertura:+data.apertura}, i=ct.conti.findIndex(x=>x.id===row.id);
  if(i>=0)ct.conti[i]=row; else ct.conti.push(row);
  closeModal(); render(); toast('Conto salvato','ok');
}
async function ctDeleteConto(id){
  if(!confirm('Eliminare questo conto?'))return;
  const {error}=await nlSupa.from('conti').delete().eq('id',id);
  if(error){toast(error.message,'err');return}
  ct.conti=ct.conti.filter(x=>x.id!==id); closeModal(); render(); toast('Conto eliminato','ok');
}
function ctOpenAlign(id){
  const c=ct.conti.find(x=>x.id===id); if(!c)return; const bal=ctBalance(id), dv=ctDaVerificare(id), cur=Math.round((bal+dv)*100)/100;
  modal(`<div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
    <div class="modal-h"><h3>Allinea «${esc(c.nome)}» al saldo reale</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
    <form onsubmit="ctAlign(event,${id},${cur})"><div class="modal-b">
      <p class="helptip">Saldo calcolato oggi: <b class="tnum" style="color:var(--text)">${ctEur(bal)}</b>${dv?`, più <b class="tnum" style="color:var(--text)">${dv>0?'+':''}${ctEur(dv)}</b> dei movimenti «Da verificare», che il saldo reale include già: ${ctEur(cur)}`:''}. Scrivi il saldo che vedi in banca o su PayPal: la suite corregge il saldo iniziale in modo che i due numeri coincidano.</p>
      ${dv?'<p class="helptip">I movimenti «Da verificare» arrivano da PayPal, quindi sono già dentro il saldo reale: confermarli dopo l\'allineamento non cambia più il saldo.</p>':''}
      <div class="form-row"><label for="ct-al">Saldo reale (€)</label><input id="ct-al" type="number" step="0.01" required></div>
    </div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" type="submit">Allinea</button></div></form></div>`);
  setTimeout(()=>{const e=document.getElementById('ct-al');if(e)e.focus()},40);
}
async function ctAlign(ev,id,cur){
  ev.preventDefault(); const c=ct.conti.find(x=>x.id===id); const real=parseFloat(ctVal('ct-al'));
  if(!c||isNaN(real))return;
  const ap=Math.round((c.apertura+(real-cur))*100)/100;
  const {error}=await nlSupa.from('conti').update({apertura:ap}).eq('id',id);
  if(error){toast(error.message,'err');return}
  c.apertura=ap; closeModal(); render(); toast('Saldo iniziale aggiornato a '+ctEur(ap),'ok');
}
async function ctConfirm(id){
  const {data,error}=await nlSupa.from('movimenti').update({stato:'completato'}).eq('id',id).select(CT_COLS).single();
  if(error){toast(error.message,'err');return}
  const i=ct.mov.findIndex(x=>x.id===id); if(i>=0)ct.mov[i]={...data,importo:+data.importo};
  render(); toast('Movimento confermato','ok');
}
async function ctConfirmAll(){
  const ids=ct.mov.filter(m=>m.stato==='da_verificare').map(m=>m.id);
  if(!ids.length)return;
  if(!confirm(`Confermare tutti i ${ids.length} movimenti da verificare? Entreranno nel saldo del conto aziendale.`))return;
  const {error}=await nlSupa.from('movimenti').update({stato:'completato'}).in('id',ids);
  if(error){toast(error.message,'err');return}
  ct.mov.forEach(m=>{if(ids.includes(m.id))m.stato='completato'});
  render(); toast(ids.length+(ids.length===1?' movimento confermato':' movimenti confermati'),'ok');
}
function ctToggleOpen(v){state.config.ctInclude=!!v;save(LS.config,state.config);render()}

/* ---- primo avvio: porta i dati da Notion ---- */
async function ctSeedNotion(){
  if(ct.conti.length||ct.mov.length){toast('Ci sono già dei dati: non importo nulla','warn');return}
  if(!confirm(`Importare i ${CT_SEED.length} movimenti e i ${CT_SEED_CONTI.length} conti della sezione Contabilità di Notion?`))return;
  const b=document.getElementById('ct-seed-btn'); if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> Importo…'}
  const {data:cs,error:e1}=await nlSupa.from('conti').insert(CT_SEED_CONTI.map((c,i)=>({nome:c[1],tipo:c[2],ordine:i+1}))).select('id,nome');
  if(e1){toast(e1.message,'err');if(b){b.disabled=false;b.textContent='Importa i dati di Notion'}return}
  const idOf={}; CT_SEED_CONTI.forEach(c=>{const row=cs.find(x=>x.nome===c[1]);if(row)idOf[c[0]]=row.id});
  const rows=CT_SEED.map(r=>({data:r[0]||null,descrizione:r[1],importo:r[2],da_conto:r[3]?idOf[r[3]]:null,a_conto:r[4]?idOf[r[4]]:null,tipo:r[6]==='Stipendio'?'move':r[5],categoria:r[6]==='Stipendio'?'Quota soci':(r[6]||null),stato:CT_SEED_STATO[r[7]]||'completato'}));
  const {error:e2}=await nlSupa.from('movimenti').insert(rows);
  if(e2){toast(e2.message,'err');return}
  await ctLoad(); toast('Dati importati da Notion','ok');
}

/* ---- esporta ---- */
function ctExportCsv(){
  const cell=v=>{const s=String(v??'');return /[",;\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=['data','descrizione','importo','tipo','categoria','da','a','stato','riferimento','note'];
  const rows=ctShown().map(m=>[m.data||'',m.descrizione,String(m.importo).replace('.',','),ctChipLabel(CT_TIPI,ctKind(m)),m.categoria||'',ctName(m.da_conto),ctName(m.a_conto),ctChipLabel(CT_STATI,m.stato),m.riferimento||'',m.note||''].map(cell).join(';'));
  const url=URL.createObjectURL(new Blob(['﻿'+[head.join(';'),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:'movimenti-'+isoD(today())+'.csv'});
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function ctChipLabel(list,id){const s=list.find(x=>x.id===id);return s?s.label:id}

/* ---- vista ---- */
function ctHeroCopy(){
  if(!nl.session) return {t:'Contabilità.',l:'Accedi per vedere conti, saldi e movimenti.'};
  if(nl.editor===false) return {t:'Accesso non abilitato.',l:'Questo account non è nella redazione.'};
  if(!ct.loaded) return {t:'Contabilità.',l:'Carico i conti…'};
  if(ct.missing) return {t:'Contabilità da attivare.',l:'Mancano le tabelle nel database: si creano una volta sola con la migrazione.'};
  if(!ct.conti.length) return {t:'Contabilità.',l:'Nessun conto ancora: puoi importare i dati di Notion o crearli a mano.'};

}

    <button class="btn" id="btnRefresh" onclick="ctRefresh()" title="Ricarica conti e movimenti">${CT_I.refresh}<span class="lbl">Aggiorna</span></button>`;

function ctGate(){
  if(!nl.ready) return `<div class="empty"><span class="spinner"></span></div>`;

  if(nl.editor===null) return `<div class="empty"><span class="spinner"></span><p style="margin-top:14px">Verifico l'accesso…</p></div>`;
  if(nl.editor===false) return `<div class="empty">${CT_I.wallet}<h4>Questo account non è in redazione</h4>
    <p>${esc(nl.session.user?.email||'')} ha fatto l'accesso, ma non è tra gli indirizzi abilitati. Chiedi a chi gestisce il database di aggiungerlo alla tabella <code>newsletter_editors</code>.</p>
    <button class="btn" onclick="nlLogout()">Esci</button></div>`;
  if(!ct.loaded) return `<div class="empty"><span class="spinner"></span><p style="margin-top:14px">Carico i conti…</p></div>`;
  if(ct.missing) return `<div class="empty">${CT_I.wallet}<h4>Mancano le tabelle della contabilità</h4>
    <p>Apri Supabase (progetto Lead Flowline) → SQL Editor ed esegui il file <code>supabase/migrations/20261103190000_contabilita.sql</code>. Poi torna qui e premi Aggiorna: dopo la migrazione potrai importare i dati di Notion con un clic.</p>
    <button class="btn" onclick="ctRefresh()">Aggiorna</button></div>`;

  return '';

function ctPanoramica(){
  const main=ctMain(), k=ct.month, [y,mm]=k.split('-'), ms=ctSums(ctByMonth(k));
  const pend=ctPending(), pendAmt=Math.round(pend.reduce((s,m)=>s+ctEffMain(m),0)*100)/100;

    <table><thead><tr><th>N.</th><th>Conto</th><th>Tipo</th><th>Saldo</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="board-foot"><span>Entrate, uscite e quote ai soci del mese nei riquadri qui sotto</span><span class="spacer"></span><span>${state.config.ctInclude?'compresi i non completati':'solo movimenti completati'}</span></div></section>`;
  const stats=`<div class="rq-stats">
    <div class="stat-t t-orange"><div class="k">Saldo ${esc(main.nome)}</div><div class="row"><div class="v ct-v">${ctEur(ctBalance(main.id))}</div></div></div>
    <div class="stat-t t-lilac"><div class="k">Entrate di ${CT_MESI[+mm-1].toLowerCase()}</div><div class="row"><div class="v ct-v">${ctEur(ms.i)}</div></div></div>
    <div class="stat-t t-ink"><div class="k">Uscite di ${CT_MESI[+mm-1].toLowerCase()}</div><div class="row"><div class="v ct-v">${ctEur(ms.o)}</div></div><div class="ct-sub">solo costi, senza le quote ai soci</div></div>

  const months=[];for(let i=5;i>=0;i--)months.push(ctShiftM(k,-i));
  const data=months.map(x=>({k:x,...ctSums(ctByMonth(x))})), mx=Math.max(1,...data.flatMap(d=>[d.i,d.o]));
  const chart=`<div class="tile"><div class="tile-h"><h3>Ultimi sei mesi</h3><span class="spacer"></span>
    <button class="btn sm" onclick="ctMonth(-1)" aria-label="Mese precedente">‹</button><span class="sub" style="min-width:130px;text-align:center">${CT_MESI[+mm-1]} ${y}</span><button class="btn sm" onclick="ctMonth(1)" aria-label="Mese successivo">›</button></div>

/* =======================================================
   CALENDARIO — squadra, eventi condivisi e notifiche
   Database: team_members, eventi, evento_partecipanti, notifiche nel progetto Supabase "Lead Flowline".
   Ogni persona della squadra entra con il proprio account (Supabase Auth) e ha gli stessi permessi degli altri.
   Gli eventi «azienda» sono sincronizzati con Google Calendar (info@flowline.it) da due flussi n8n; gli impegni «personali» no.
   Le notifiche le crea il database (trigger) e arrivano qui in tempo reale. Per i futuri task basta riusare la tabella notifiche (rif_tipo, rif_id).
   ======================================================= */
const AG_TABS=[{tab:'settimana',label:'Settimana'},{tab:'mese',label:'Mese'},{tab:'notifiche',label:'Notifiche'}];
const AG_TIPI=[{id:'call',label:'Call',chip:'wait'},{id:'appuntamento',label:'Appuntamento',chip:'plan'},{id:'impegno',label:'Impegno',chip:'seq'},{id:'altro',label:'Altro',chip:'da'}];
const AG_GG=['lun','mar','mer','gio','ven','sab','dom'];
const AG_GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const AG_COLS='id,titolo,descrizione,luogo,link_call,cliente,inizio,fine,tutto_il_giorno,tipo,calendario,stato,creato_da,origine,google_id,google_link,ospiti,sync_da_inviare,updated_at';
const AG_I={
  plus:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14 M5 12h14"/></svg>',
  refresh:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6 M1 20v-6h6 M3.51 9a9 9 0 0 1 14.85-3.36L23 10 M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
  cal:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18"/></svg>'
};
const ag={team:[],me:null,ev:[],part:{},notif:[],loaded:false,loading:false,missing:false,noMember:false,tab:'settimana',week:null,month:'',who:'',personali:true,
  from:null,ch:null,pollT:null,loadT:null,mtipo:'call'};

/* ---- piccole utilità ---- */
function agMonday(d){const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
function agInit(){if(!ag.week)ag.week=agMonday(new Date());if(!ag.month)ag.month=isoD(new Date()).slice(0,7);if(!ag.from)ag.from=addDays(today(),-60)}
const agT=d=>new Date(d).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
function agDay(d){return new Date(d).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
function agDtl(d){d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const agPerson=id=>ag.team.find(t=>t.id===id);
const agParts=id=>ag.part[id]||[];
const agUnread=()=>ag.notif.filter(n=>!n.letta_il).length;
const agTipo=t=>AG_TIPI.find(x=>x.id===t)||AG_TIPI[3];
const agAvIn=(url,nome)=>url&&/^https:\/\//.test(url)?`<img src="${escAttr(url)}" alt="" loading="lazy" decoding="async">`:esc((nome||'?').trim().charAt(0).toUpperCase());
function agAv(id,sm){const p=agPerson(id);if(!p)return '';return `<span class="ag-av${sm?' sm':''}" style="background:${escAttr(p.colore)}" title="${escAttr(p.nome)}">${agAvIn(p.avatar_url,p.nome)}</span>`}
function agAvs(e){return agParts(e.id).map(u=>agAv(u,true)).join('')}
function agWhen(e){
  const a=new Date(e.inizio),b=new Date(e.fine),same=isoD(a)===isoD(b);
  if(e.tutto_il_giorno)return same?'Tutto il giorno':agDay(a)+' – '+agDay(b);
  return same?agT(a)+' – '+agT(b):agDay(a)+' '+agT(a)+' → '+agDay(b)+' '+agT(b);
}
function agOverlaps(e,day){const s=new Date(day);s.setHours(0,0,0,0);const n=addDays(s,1);const a=new Date(e.inizio),b=new Date(e.fine);return a<n&&(b>s||(+a===+b&&a>=s))}
function agShown(){
  return ag.ev.filter(e=>(ag.personali||e.calendario!=='personale')&&(!ag.who||agParts(e.id).includes(ag.who)));
}
const agDayEv=day=>agShown().filter(e=>agOverlaps(e,day)).sort((a,b)=>(b.tutto_il_giorno-a.tutto_il_giorno)||String(a.inizio).localeCompare(String(b.inizio)));

/* ---- dati ---- */
async function agLoad(opts={}){
  if(!nlSupa||!nl.session)return;
  agInit(); ag.loading=true; if(state.view==='agenda'&&!opts.silent)render();
  try{
    let tm=await nlSupa.from('team_members').select('id,nome,email,colore,attivo,avatar_url,avvisi_attivita').order('nome');
    // migrazione 20261110180000 non ancora eseguita: si va avanti senza foto e senza scelta delle email
    if(tm.error&&/avatar_url|avvisi_attivita/.test(tm.error.message||''))tm=await nlSupa.from('team_members').select('id,nome,email,colore,attivo').order('nome');
    const {data:team,error:e0}=tm;
    if(e0)throw e0;
    ag.team=team.filter(t=>t.attivo); ag.me=team.find(t=>t.id===nl.session.user.id)||null; ag.noMember=!ag.me;
    if(ag.me){
      const ev=[];let from=0;
      for(;;){
        const {data,error}=await nlSupa.from('eventi').select(AG_COLS).gte('fine',ag.from.toISOString()).order('inizio').range(from,from+999);
        if(error)throw error;ev.push(...data);if(data.length<1000)break;from+=1000;
      }
      const part={};from=0;
      for(;;){
        const {data,error}=await nlSupa.from('evento_partecipanti').select('evento_id,user_id').range(from,from+999);
        if(error)throw error;data.forEach(p=>{(part[p.evento_id]=part[p.evento_id]||[]).push(p.user_id)});if(data.length<1000)break;from+=1000;
      }
      const {data:nt,error:e3}=await nlSupa.from('notifiche').select('id,created_at,tipo,titolo,testo,evento_id,rif_tipo,rif_id,letta_il').order('created_at',{ascending:false}).limit(100);
      if(e3)throw e3;
      ag.ev=ev;ag.part=part;ag.notif=nt;ag.missing=false;
      agSubscribe();
    }
    ag.loaded=true;
  }catch(e){
    if(e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''))){ag.missing=true;ag.loaded=true}
    else toast('Calendario: '+(e.message||e),'err');
  }
  ag.loading=false;agTitle();
  if(state.view==='agenda')render();else{renderNav()}
}
function agDeferLoad(){clearTimeout(ag.loadT);ag.loadT=setTimeout(()=>agLoad({silent:true}),700)}
function agSubscribe(){
  if(ag.ch||!ag.me)return;
  try{
    ag.ch=nlSupa.channel('suite-'+ag.me.id)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifiche',filter:'user_id=eq.'+ag.me.id},p=>agOnNotif(p.new))
      .on('postgres_changes',{event:'*',schema:'public',table:'eventi'},agDeferLoad)
      .on('postgres_changes',{event:'*',schema:'public',table:'evento_partecipanti'},agDeferLoad)
      .subscribe();
  }catch(e){}
  clearInterval(ag.pollT);ag.pollT=setInterval(()=>{if(!document.hidden)agLoad({silent:true})},90000);  // rete di sicurezza se il tempo reale non è attivo
}
function agStop(){
  try{if(ag.ch)nlSupa.removeChannel(ag.ch)}catch(e){}
  ag.ch=null;clearInterval(ag.pollT);clearTimeout(ag.loadT);
  Object.assign(ag,{team:[],me:null,ev:[],part:{},notif:[],loaded:false,noMember:false,missing:false});agTitle();
}
function agOnNotif(n){
  if(!n||ag.notif.some(x=>x.id===n.id))return;
  ag.notif.unshift(n);toast(n.titolo+': '+n.testo,'ok');agTitle();agPopRefresh();
  if(state.view==='agenda')render();else renderNav();
}
function agTitle(){const n=agUnread();const t=document.title.replace(/^\(\d+\)\s/,'');document.title=(n?'('+n+') ':'')+t}

/* ---- profilo e uscita ---- */
function agRenderUser(){
  const b=document.getElementById('userBox');if(!b)return;
  if(!nl.session){b.innerHTML='';return}
  const n=agUnread(),me=ag.me,email=nl.session.user?.email||'';
  b.innerHTML=`<button class="icon-btn ag-bell" id="agBell" onclick="agBellToggle(event)" aria-haspopup="true" aria-expanded="false" title="Notifiche" aria-label="Notifiche${n?': '+n+' da leggere':''}">${AG_I.bell}${n?`<span class="ag-bellb">${n>9?'9+':n}</span>`:''}</button>

/* foto profilo: ritaglio quadrato 256 px in JPEG, salvato in Storage (bucket avatars, cartella = id della persona) */
function agAvatarResize(file){
  return new Promise((ok,ko)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url);const n=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=256;
      c.getContext('2d').drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,256,256);
      c.toBlob(b=>b?ok(b):ko(new Error('Immagine non elaborabile')),'image/jpeg',.86)};
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('Il file non è un\'immagine valida'))};
    img.src=url;
  });
}

async function agAvatarUpload(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f||!ag.me)return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('Scegli un\'immagine JPG, PNG o WebP','warn');return}
  try{
    const blob=await agAvatarResize(f),path=ag.me.id+'/avatar.jpg';
    const up=await nlSupa.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});
    if(up.error)throw up.error;
    const pub=nlSupa.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    await agAvatarSet(pub+'?v='+Date.now());
    toast('Foto aggiornata','ok');agProfile();renderNav();render();
  }catch(e){toast('Foto non caricata: '+(e.message||e)+(/bucket|not found|policy/i.test(e.message||'')?' (serve la migrazione 20261110180000)':''),'err')}
}

async function agSave(ev,id){
  ev.preventDefault();
  const v=i=>(document.getElementById(i)?.value||'').trim(),all=document.getElementById('ag-f-all').checked;
  const cal=document.querySelector('#ag-cal .fbtn.on')?.dataset.c||'azienda',per=cal==='personale';
  let a,b;
  if(all){a=new Date(v('ag-f-di')+'T00:00');b=new Date((v('ag-f-df')||v('ag-f-di'))+'T23:59')}
  else{a=new Date(v('ag-f-ini'));b=new Date(v('ag-f-fin'))}
  if(isNaN(a)||isNaN(b)){toast('Controlla le date','warn');return}
  if(b<a){toast('La fine non può essere prima dell\'inizio','warn');return}
  const titolo=v('ag-f-tit');if(!titolo){toast('Scrivi un titolo','warn');return}
  const ospiti=per?[]:v('ag-f-osp').split(/[,;\s]+/).map(s=>s.trim().toLowerCase()).filter(Boolean);
  const bad=ospiti.find(s=>!NL.emailRe.test(s));if(bad){toast('Email non valida: '+bad,'warn');return}
  const rec={titolo,tipo:ag.mtipo,cliente:v('ag-f-cli')||null,luogo:v('ag-f-luo')||null,link_call:v('ag-f-lnk')||null,descrizione:v('ag-f-des')||null,
    inizio:a.toISOString(),fine:b.toISOString(),tutto_il_giorno:all,calendario:cal,ospiti};
  const want=per?[ag.me.id]:[...document.querySelectorAll('.ag-pick input:checked')].map(x=>x.value);
  if(!per&&!want.length){toast('Scegli almeno un partecipante','warn');return}
  const btn=document.getElementById('ag-save');if(btn)btn.disabled=true;
  try{
    const have=id?agParts(id):[],toDel=have.filter(u=>!want.includes(u)),toAdd=want.filter(u=>!have.includes(u));
    // prima chi esce, poi la modifica (la notifica di spostamento non arriva a chi è stato tolto), infine chi entra
    if(id&&toDel.length){const {error}=await nlSupa.from('evento_partecipanti').delete().eq('evento_id',id).in('user_id',toDel);if(error)throw error}
    const q=id?nlSupa.from('eventi').update(rec).eq('id',id):nlSupa.from('eventi').insert({...rec,creato_da:ag.me.id});
    const {data,error}=await q.select(AG_COLS).single();if(error)throw error;
    if(toAdd.length){const {error:e2}=await nlSupa.from('evento_partecipanti').insert(toAdd.map(u=>({evento_id:data.id,user_id:u})));if(e2)throw e2}
    const i=ag.ev.findIndex(x=>x.id===data.id);if(i>=0)ag.ev[i]=data;else ag.ev.push(data);
    ag.part[data.id]=want;ag.ev.sort((x,y)=>String(x.inizio).localeCompare(String(y.inizio)));
    closeModal();render();toast(id?'Evento aggiornato':'Evento aggiunto','ok');
  }catch(e){toast(e.message||String(e),'err');if(btn)btn.disabled=false}
}
async function agToggleCancel(id){
  const e=ag.ev.find(x=>x.id===id);if(!e)return;
  const stato=e.stato==='annullato'?'confermato':'annullato';
  if(stato==='annullato'&&!confirm(`Annullare "${e.titolo}"? I partecipanti ricevono una notifica.`))return;
  const {data,error}=await nlSupa.from('eventi').update({stato}).eq('id',id).select(AG_COLS).single();
  if(error){toast(error.message,'err');return}
  const i=ag.ev.findIndex(x=>x.id===id);if(i>=0)ag.ev[i]=data;closeModal();render();toast(stato==='annullato'?'Evento annullato':'Evento riattivato','ok');
}
async function agDelete(id){
  const e=ag.ev.find(x=>x.id===id);if(!e)return;
  if(!confirm(`Eliminare "${e.titolo}"? Sparisce anche da Google Calendar e nessuno viene avvisato (per avvisare i partecipanti usa prima «Annulla evento»).`))return;
  const {error}=await nlSupa.from('eventi').delete().eq('id',id);
  if(error){toast(error.message,'err');return}
  ag.ev=ag.ev.filter(x=>x.id!==id);delete ag.part[id];closeModal();render();toast('Evento eliminato','ok');
}

/* ---- dati ---- */
async function hmLoad(opts={}){
  if(!nlSupa||!nl.session||!ag.me)return;
  try{
    const [a,b]=await Promise.all([
      nlSupa.from('messaggi').select('id,created_at,da_id,a_id,testo,letto_il').order('created_at',{ascending:false}).limit(500),
      nlSupa.from('bacheca').select('id,created_at,updated_at,autore_id,titolo,testo,fissato,categoria,scade_il').order('fissato',{ascending:false}).order('created_at',{ascending:false}).limit(100)
    ]);
    if(a.error)throw a.error;
    // senza la migrazione 20261110180000 la Bacheca funziona come prima (niente categorie né scadenza)
    hm.v2=true;
    if(b.error&&/categoria|scade_il/.test(b.error.message||'')){hm.v2=false;
      const b2=await nlSupa.from('bacheca').select('id,created_at,updated_at,autore_id,titolo,testo,fissato').order('fissato',{ascending:false}).order('created_at',{ascending:false}).limit(100);
      b.error=b2.error;b.data=b2.data}
    if(b.error)throw b.error;
    hm.msgs=a.data;hm.posts=b.data;hm.missing=false;hm.loaded=true;hmSubscribe();
  }catch(e){
    if(hmMissing(e)){hm.missing=true;hm.loaded=true}
    else if(!opts.silent)toast('Home: '+(e.message||e),'err');
  }
  hmRefreshUi();
}
function hmDeferLoad(){clearTimeout(hm.loadT);hm.loadT=setTimeout(()=>hmLoad({silent:true}),500)}
function hmSubscribe(){
  if(hm.ch||!ag.me)return;
  try{
    hm.ch=nlSupa.channel('home-'+ag.me.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'messaggi'},hmDeferLoad)
      .on('postgres_changes',{event:'*',schema:'public',table:'bacheca'},hmDeferLoad)
      .subscribe();
  }catch(e){}
  clearInterval(hm.pollT);hm.pollT=setInterval(()=>{if(!document.hidden)hmLoad({silent:true})},90000);
}
function hmStop(){
  try{if(hm.ch)nlSupa.removeChannel(hm.ch)}catch(e){}
  hm.ch=null;clearInterval(hm.pollT);clearTimeout(hm.loadT);
  Object.assign(hm,{msgs:[],posts:[],loaded:false,missing:false,thread:null,editing:null});
}
function hmRefreshUi(){

    const other=m.da_id===ag.me.id?m.a_id:m.da_id;
    const c=by[other]||(by[other]={id:other,last:m,unread:0});

function hmCalls(){
  if(!ag.me)return {calls:[],others:0};
  const day=today(),vis=ag.ev.filter(e=>e.stato!=='annullato'&&agOverlaps(e,day)&&(e.calendario==='azienda'||agParts(e.id).includes(ag.me.id)));
  const calls=vis.filter(e=>e.tipo==='call').sort((a,b)=>String(a.inizio).localeCompare(String(b.inizio)));
  return {calls,others:vis.length-calls.length};
}
function hmMail(){
  const t=today(),by=[0,0,0];let late=0;
  for(const c of state.contacts){
    if(c.haRisposto)continue;const na=nextAction(c);if(!na)continue;
    if(na.dueDate<t)late++;else if(sameDay(na.dueDate,t))by[Math.min(2,na.stepIndex||0)]++;
  }
  return {by,total:by[0]+by[1]+by[2],late};
}
const hmNewReplies=()=>state.contacts.filter(c=>c.haRisposto&&c.replySeen===false).length;
function hmSubs(){
  if(!nl.loaded)return null;
  const act=nlActive(),wk=Date.now()-7*864e5;
  return {n:act.length,week:act.filter(s=>new Date(s.created_at).getTime()>=wk).length};
}

function hmNormalize(arr){
  const known=new Map(HM_TILES.map(t=>[t.id,t])), out=[];
  (Array.isArray(arr)?arr:[]).forEach(x=>{if(x&&known.has(x.id)&&!out.some(o=>o.id===x.id))out.push({id:x.id,show:x.show!==false,size:HM_SIZES.some(z=>z.n===+x.size)?+x.size:known.get(x.id).size})});
  HM_TILES.forEach(t=>{if(!out.some(o=>o.id===t.id))out.push({id:t.id,show:true,size:t.size})});
  return out;
}

/* =======================================================
   ONLINE — chi è nella Suite in questo momento (presenza Realtime, canale privato "suite-online")
   ======================================================= */
const on={ch:null,users:[],err:false,open:false,last:'',bound:false};
function onSection(){return SEC_NAME[sectionOf(state.view)]||''}
function onPayload(){return {sezione:onSection(),stato:document.hidden?'assente':'attivo'}}
function onStart(){
  if(on.ch||!nlSupa||!ag.me)return;
  try{
    const ch=nlSupa.channel('suite-online',{config:{private:true,presence:{key:ag.me.id}}});
    on.ch=ch;
    ch.on('presence',{event:'sync'},onSync);
    ch.subscribe(async st=>{
      if(st==='SUBSCRIBED'){on.err=false;on.last='';await onTrack();onPaint()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){on.err=true;onPaint()}
    });
  }catch(e){on.err=true}
  if(!on.bound){
    on.bound=true;
    document.addEventListener('visibilitychange',()=>onTrack());
    document.addEventListener('click',e=>{if(on.open&&!e.target.closest('#onlineBox')){on.open=false;onPaint()}});
  }
}
function onStop(){
  try{if(on.ch)nlSupa.removeChannel(on.ch)}catch(e){}
  on.ch=null;on.users=[];on.err=false;on.open=false;on.last='';onPaint();
}
async function onTrack(){
  if(!on.ch||on.err)return;
  const p=onPayload(),k=p.sezione+'|'+p.stato;
  if(k===on.last)return;
  on.last=k;
  try{await on.ch.track(p)}catch(e){on.last=''}
}
function onSync(){
  if(!on.ch)return;
  const st=on.ch.presenceState(),us=[];
  for(const [id,metas] of Object.entries(st)){
    const m=(metas||[]).slice().reverse().find(x=>x.stato==='attivo')||(metas||[])[metas.length-1]||{};
    const p=agPerson(id);
    us.push({id,nome:p?p.nome:'Collega',colore:p?p.colore:'#999',avatar_url:p?p.avatar_url:null,sezione:String(m.sezione||''),stato:m.stato==='assente'?'assente':'attivo'});
  }
  const me=ag.me&&ag.me.id;
  us.sort((a,b)=>(a.id===me?-1:b.id===me?1:0)||(a.stato===b.stato?0:a.stato==='attivo'?-1:1)||a.nome.localeCompare(b.nome));
  on.users=us;onPaint();
}
function onAv(u,sm){return `<span class="ag-av${sm?' sm':''}${u.stato==='assente'?' on-away':''}" style="background:${escAttr(u.colore)}" title="${escAttr(u.nome+(u.stato==='assente'?' (non attivo)':''))}">${agAvIn(u.avatar_url,u.nome)}</span>`}
function onRows(){
  const me=ag.me&&ag.me.id;
  return on.users.map(u=>`<li class="on-row"><span class="on-ava">${onAv(u)}<i class="on-dot ${u.stato}" aria-hidden="true"></i></span><span class="on-name">${esc(u.nome)}${u.id===me?' <small>(tu)</small>':''}</span><span class="on-where">${u.stato==='assente'?'non attivo':esc(u.sezione||'')}</span></li>`).join('');
}
function onPaint(){
  const box=document.getElementById('onlineBox');
  if(box){
    if(!nl.session||!ag.me||on.err||!on.ch){box.innerHTML='';box.hidden=true}
    else{
      box.hidden=false;
      const n=on.users.length,act=on.users.filter(u=>u.stato==='attivo').length;
      box.innerHTML=`<button type="button" class="on-chip" aria-expanded="${on.open}" onclick="event.stopPropagation();on.open=!on.open;onPaint()" title="Chi è online adesso"><span class="on-dot attivo" aria-hidden="true"></span><span class="on-lbl">Online</span><b>${act}</b><span class="ag-avs">${on.users.slice(0,4).map(u=>onAv(u,true)).join('')}</span></button>${on.open?`<div class="on-pop" role="dialog" aria-label="Collaboratori online"><div class="on-pop-h">Online adesso <span>${n}</span></div><ul class="on-list">${onRows()||'<li class="on-empty">Nessuno.</li>'}</ul></div>`:''}`;
    }
  }
  const t=document.getElementById('on-tile-body');
  if(t)t.innerHTML=onTileHtml();
}
function onTileHtml(){
  if(on.err)return `<p class="hm-empty">Per vedere chi è online serve la migrazione <code>20261105100000_password_online.sql</code>.</p>`;
  if(!on.users.length)return `<p class="hm-empty">Mi collego…</p>`;
  return `<ul class="on-list">${onRows()}</ul>`;
}
function onUpdate(){onTrack();onPaint()}

function pwSafeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}

async function pwLoad(opts={}){
  if(!nlSupa||!nl.editor||pw.loading)return;
  pw.loading=true;if(state.view==='password'&&!opts.silent)render();
  try{
    const a=await nlSupa.from('credenziali').select(PW_COLS).order('servizio');
    if(a.error){
      if(/does not exist|schema cache|permission denied|42P01|PGRST205/i.test((a.error.code||'')+' '+a.error.message)){pw.missing=true;pw.loaded=true;pw.rows=[];pw.log=[];return}
      throw a.error;
    }
    pw.missing=false;pw.rows=a.data||[];
    const b=await nlSupa.from('password_log').select('id,created_at,user_id,credenziale_id,servizio,azione').order('created_at',{ascending:false}).limit(300);
    pw.log=b.error?[]:(b.data||[]);
    pw.loaded=true;
  }catch(e){toast('Password: '+(e.message||e),'err');pw.loaded=true}
  finally{pw.loading=false;if(state.view==='password')render()}
}

/* ---- azioni ---- */
function pwHide(id){const s=pw.shown[id];if(s){clearTimeout(s.t);delete pw.shown[id]}}
async function pwFetch(id){
  const {data,error}=await nlSupa.rpc('password_rivela',{p_id:id});
  if(error){toast(error.message,'err');return null}
  return data==null?'':String(data);
}
async function pwToggle(id){
  if(pw.shown[id]){pwHide(id);pwPaintList();return}
  const v=await pwFetch(id);if(v===null)return;
  pw.shown[id]={v,t:setTimeout(()=>{delete pw.shown[id];pwPaintList()},20000)};   // si rinasconde da sola dopo 20 secondi
  pwPaintList();pwLoadLogSoon();
}
async function pwCopy(id,what){
  const r=pw.rows.find(x=>x.id===id);if(!r)return;
  let v;
  if(what==='user')v=r.username||'';
  else{v=pw.shown[id]?pw.shown[id].v:await pwFetch(id);if(v===null)return;pwLoadLogSoon()}
  try{await navigator.clipboard.writeText(v);toast(what==='user'?'Utente copiato':'Password copiata','ok')}
  catch(e){toast('Non riesco a copiare: il browser non lo permette','warn')}
}
let pwLogT=null;
function pwLoadLogSoon(){clearTimeout(pwLogT);pwLogT=setTimeout(async()=>{const b=await nlSupa.from('password_log').select('id,created_at,user_id,credenziale_id,servizio,azione').order('created_at',{ascending:false}).limit(300);if(!b.error){pw.log=b.data||[];if(state.view==='password'&&pw.tab==='registro')render()}},600)}
function pwGen(len=20){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*?-_',lim=256-(256%A.length);let out='';
  while(out.length<len){const b=new Uint8Array(len*2);crypto.getRandomValues(b);for(const x of b){if(x<lim&&out.length<len)out+=A[x%A.length]}}
  return out;
}

      <div class="form-row"><label for="pw-imp">Elenco</label><textarea id="pw-imp" rows="9" required spellcheck="false" placeholder="Hostinger ; info@flowline.it ; la-password ; https://hpanel.hostinger.com"></textarea></div>
      <div class="form-row"><label for="pw-ic">Categoria per tutte</label><input id="pw-ic" list="pw-cats" value="Altro"><datalist id="pw-cats">${pwCats().map(c=>`<option value="${escAttr(c)}">`).join('')}</datalist></div>
    </div><div class="modal-f"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" id="pw-ib2" type="submit">Importa</button></div></form></div>`);

async function pwImport(ev){
  ev.preventDefault();
  const cat=(document.getElementById('pw-ic').value||'').trim()||'Altro';
  const lines=(document.getElementById('pw-imp').value||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,300);
  const b=document.getElementById('pw-ib2');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> Importo…'}
  let ok=0,ko=0;
  for(const l of lines){
    const f=(l.includes('\t')?l.split('\t'):l.split(';')).map(x=>x.trim());
    if(!f[0]){ko++;continue}
    const {error}=await nlSupa.rpc('password_salva',{p_id:null,p_servizio:f[0],p_categoria:cat,p_url:f[3]||'',p_username:f[1]||'',p_password:f[2]||'',p_note:f[4]||''});
    if(error)ko++;else ok++;
  }
  closeModal();toast(`Importate ${ok} credenziali`+(ko?` · ${ko} saltate`:''),ko?'warn':'ok');
  await pwLoad({silent:true});
}

/* =======================================================
   LINKEDIN — al posto di Notion › «Ricerca clienti LinkedIn»
   Database: linkedin_contatti (migrazione 20261110190000_linkedin_contatti.sql), tutta la squadra vede e modifica tutto.
   Quattro stati come in Notion: da contattare, contattato, risposto, esito negativo.
   Per ogni contatto: di chi è, profilo, e-mail, data invito e data messaggio, testo inviato, risposta, note.
   ======================================================= */
const LI_ST={
  da_contattare:{l:'Da contattare',c:'da'},
  contattato:{l:'Contattato',c:'seq'},
  risposto:{l:'Risposto',c:'reply'},
  esito_negativo:{l:'Esito negativo',c:'stop'}
};
const LI_COLS='id,created_at,updated_at,nome,azienda,ruolo,competenza_di,stato,url_profilo,email,invito_il,messaggio_il,messaggio,risposta,descrizione,note,creato_da';
const li={rows:[],loaded:false,loading:false,missing:false,q:'',stato:'tutti',who:'tutti',sort:'recenti',limit:60,
  ch:null,loadT:null,pollT:null,editing:null};
const LI_I={
  ext:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14 21 3"/></svg>',
  find:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M21 21l-4.35-4.35"/></svg>',
  copy:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  edit:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18 M8 6V4h8v2 M19 6l-1 14H6L5 6 M10 11v6 M14 11v6"/></svg>',
  user:'<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
};
const liPl=(k,s,p)=>k===1?s:p;
function liToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function liD(d){if(!d)return '';const x=new Date(String(d).slice(0,10)+'T00:00:00');return isNaN(x)?'':x.toLocaleDateString('it-IT',{day:'numeric',month:'short',year:x.getFullYear()===new Date().getFullYear()?undefined:'numeric'})}
function liSearchUrl(r){return 'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent([r.nome,r.azienda].filter(Boolean).join(' '))}

/* ---- dati ---- */
function liStop(){
  try{if(li.ch)nlSupa.removeChannel(li.ch)}catch(e){}
  clearInterval(li.pollT);clearTimeout(li.loadT);
  Object.assign(li,{rows:[],loaded:false,loading:false,missing:false,ch:null,editing:null,q:'',stato:'tutti',who:'tutti',limit:60});
}
async function liLoad(opts={}){
  if(!nlSupa||!nl.session||li.loading)return;
  li.loading=true;if(state.view==='linkedin'&&!opts.silent)render();
  try{
    const rows=[];let from=0;
    for(;;){
      const {data,error}=await nlSupa.from('linkedin_contatti').select(LI_COLS).order('id').range(from,from+999);
      if(error){
        if(/does not exist|schema cache|42P01|PGRST205/i.test((error.code||'')+' '+error.message)){li.missing=true;li.loaded=true;li.rows=[];return}
        throw error;
      }
      rows.push(...data);if(data.length<1000)break;from+=1000;
    }
    li.rows=rows;li.missing=false;li.loaded=true;
    liSubscribe();
  }catch(e){toast('LinkedIn: '+(e.message||e),'err');li.loaded=true}
  finally{li.loading=false;if(state.view==='linkedin'){const q=document.getElementById('li-q');const keep=q&&document.activeElement===q;render();if(keep){const n=document.getElementById('li-q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}}
}
function liDeferLoad(){clearTimeout(li.loadT);li.loadT=setTimeout(()=>{if(!document.getElementById('modalRoot')?.firstChild)liLoad({silent:true});else liDeferLoad()},1200)}
function liSubscribe(){
  if(li.ch||!ag.me)return;
  try{
    li.ch=nlSupa.channel('suite-linkedin-'+ag.me.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'linkedin_contatti'},liDeferLoad)
      .subscribe();
  }catch(e){}
  clearInterval(li.pollT);li.pollT=setInterval(()=>{if(!document.hidden&&state.view==='linkedin')liLoad({silent:true})},180000);
}

/* ---- filtri e conteggi ---- */
function liWhoMatch(r){return li.who==='tutti'||(li.who==='nessuno'?!r.competenza_di:r.competenza_di===li.who)}
function liFiltered(){
  const q=li.q.trim().toLowerCase();
  let rows=li.rows.filter(r=>liWhoMatch(r)&&(li.stato==='tutti'||r.stato===li.stato)&&(!q||[r.nome,r.azienda,r.ruolo,r.email,r.descrizione,r.note,r.messaggio,r.risposta].some(v=>String(v||'').toLowerCase().includes(q))));
  const t=(a,b)=>String(a||'').localeCompare(String(b||''),'it',{sensitivity:'base'});
  if(li.sort==='nome')rows=rows.sort((a,b)=>t(a.nome||a.azienda,b.nome||b.azienda));
  else if(li.sort==='azienda')rows=rows.sort((a,b)=>t(a.azienda||a.nome,b.azienda||b.nome));
  else if(li.sort==='contatto')rows=rows.sort((a,b)=>String(b.messaggio_il||b.invito_il||'').localeCompare(String(a.messaggio_il||a.invito_il||''))||b.id-a.id);
  else rows=rows.sort((a,b)=>b.id-a.id);
  return rows;
}
function liCount(st){return li.rows.filter(r=>liWhoMatch(r)&&(st==='tutti'||r.stato===st)).length}

/* ---- intestazione e azioni ---- */
function liHeroCopy(){
  if(!nl.session)return {t:'LinkedIn.',l:'Accedi con il tuo account per vedere i contatti LinkedIn di Flowline.'};
  if(li.missing)return {t:'LinkedIn.',l:'La sezione si attiva con la migrazione del database.'};
  if(!li.loaded||!ag.loaded)return {t:'LinkedIn.',l:'Carico i contatti…'};
  const n=li.rows.length,c=s=>li.rows.filter(r=>r.stato===s).length;
  return {t:'LinkedIn.',l:`${n} ${liPl(n,'contatto','contatti')} · ${c('da_contattare')} da contattare · ${c('contattato')} ${liPl(c('contattato'),'contattato','contattati')} · ${c('risposto')} ${liPl(c('risposto'),'risposta','risposte')}`};
}
function liTopActions(){
  if(!nl.session||!ag.me||li.missing)return '';
  return `<button class="btn primary" onclick="liForm()">${AG_I.plus}Aggiungi</button><button class="btn" onclick="liBulkForm()">Incolla elenco</button><button class="btn" onclick="liLoad()">${AG_I.refresh}<span class="lbl">Aggiorna</span></button>`;
}

/* ---- lista ---- */
function liRowHtml(r){
  const st=LI_ST[r.stato]||LI_ST.da_contattare, p=r.competenza_di?agPerson(r.competenza_di):null;
  const url=pwSafeUrl(r.url_profilo);
  const sub=[r.azienda,r.ruolo].filter(Boolean).map(esc).join(' · ');
  const dates=[r.invito_il?`Invito ${liD(r.invito_il)}`:'',r.messaggio_il?`Messaggio ${liD(r.messaggio_il)}`:''].filter(Boolean).join(' · ');
  const opts=Object.keys(LI_ST).map(k=>`<option value="${k}"${k===r.stato?' selected':''}>${LI_ST[k].l}</option>`).join('');
  return `<li class="li-row" data-id="${r.id}">
    <div class="li-main">
      <div class="li-name">${esc(r.nome||r.azienda||'Senza nome')}${r.email?`<a class="pw-ext" href="mailto:${escAttr(r.email)}" title="${escAttr(r.email)}" aria-label="Scrivi a ${escAttr(r.nome||r.azienda)}">@</a>`:''}</div>
      ${sub&&r.nome?`<div class="li-sub">${sub}</div>`:''}
    </div>
    <div class="li-who">${p?`${agAv(p.id,true)}<span>${esc(p.nome)}</span>`:'<span class="pw-none">Nessuno</span>'}</div>
    <div class="li-state"><select class="chip ${st.c} li-st" aria-label="Stato di ${escAttr(r.nome||r.azienda)}" onchange="liSetStato(${r.id},this.value)">${opts}</select>${dates?`<span class="li-dates">${dates}</span>`:''}</div>
    <div class="pw-act">
      ${url?`<a class="pw-ib" href="${escAttr(url)}" target="_blank" rel="noopener noreferrer" title="Apri il profilo LinkedIn" aria-label="Apri il profilo LinkedIn di ${escAttr(r.nome||r.azienda)}">${LI_I.ext}</a>`
           :`<a class="pw-ib" href="${escAttr(liSearchUrl(r))}" target="_blank" rel="noopener noreferrer" title="Cerca su LinkedIn" aria-label="Cerca ${escAttr(r.nome||r.azienda)} su LinkedIn">${LI_I.find}</a>`}
      ${r.messaggio?`<button class="pw-ib" onclick="liCopy(${r.id})" title="Copia il messaggio inviato" aria-label="Copia il messaggio inviato">${LI_I.copy}</button>`:''}
      <button class="pw-ib" onclick="liForm(${r.id})" title="Apri e modifica" aria-label="Modifica ${escAttr(r.nome||r.azienda)}">${LI_I.edit}</button>
    </div>
    ${r.risposta?`<div class="li-reply"><b>Risposta:</b> ${esc(r.risposta)}</div>`:''}
  </li>`;
}
function liListHtml(){
  if(!li.rows.length)return `<div class="empty">${LI_I.user}<h4>Ancora nessun contatto</h4><p>Aggiungi il primo contatto LinkedIn, oppure incolla un elenco intero in una volta.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn primary" onclick="liForm()">${AG_I.plus}Aggiungi</button><button class="btn" onclick="liBulkForm()">Aggiungi più contatti</button></div></div>`;
  const rows=liFiltered();
  if(!rows.length)return `<p class="hm-empty" style="padding:28px 4px">Nessun contatto corrisponde ai filtri.</p>`;
  const shown=rows.slice(0,li.limit);
  return `<ul class="pw-list li-list">${shown.map(liRowHtml).join('')}</ul>`
    +(rows.length>shown.length?`<div style="text-align:center;margin-top:16px"><button class="btn" onclick="liMore()">Mostra altri (${rows.length-shown.length})</button></div>`:'');
}
function liPaintList(){const e=document.getElementById('li-list');if(e)e.innerHTML=liListHtml();const c=document.getElementById('li-count');if(c){const n=liFiltered().length;c.textContent=n+' '+liPl(n,'contatto','contatti')}}
function liSearch(v){li.q=v;li.limit=60;liPaintList()}
function liMore(){li.limit+=60;liPaintList()}
function liSetFilter(k,v){li[k]=v;li.limit=60;render()}
function viewLinkedin(){

  if(!nl.session)return nlLoginView('home');

  if(li.missing)return `<div class="empty">${LI_I.user}<h4>La sezione non è ancora attiva</h4><p>Esegui nel SQL Editor di Supabase la migrazione <code>20261110190000_linkedin_contatti.sql</code>, poi premi Aggiorna.</p><button class="btn" style="margin-top:16px" onclick="liLoad()">${AG_I.refresh}Aggiorna</button></div>`;

    <div class="pw-chips">${chip('who','tutti','Tutti i referenti')}${ag.team.filter(t=>li.rows.some(r=>r.competenza_di===t.id)||t.id===ag.me.id).map(t=>`<button class="pw-chip ${li.who===t.id?'on':''}" aria-pressed="${li.who===t.id}" onclick="liSetFilter('who','${t.id}')">${agAv(t.id,true)} ${esc(t.nome)}</button>`).join('')}${semNessuno?chip('who','nessuno','Senza referente'):''}</div>

/* ---- azioni ---- */
async function liSetStato(id,st){
  const r=li.rows.find(x=>x.id===id);if(!r||r.stato===st)return;
  const prev={stato:r.stato,messaggio_il:r.messaggio_il};
  const patch={stato:st};
  if(st==='contattato'&&!r.messaggio_il)patch.messaggio_il=liToday();      // «contattato» = messaggio inviato oggi, se non c'è già una data
  Object.assign(r,patch);liPaintList();renderNav();
  const {error}=await nlSupa.from('linkedin_contatti').update(patch).eq('id',id);
  if(error){Object.assign(r,prev);liPaintList();toast(error.message,'err');return}
  if(li.stato!=='tutti')setTimeout(liPaintList,0);
}
async function liCopy(id){
  const r=li.rows.find(x=>x.id===id);if(!r||!r.messaggio)return;
  try{await navigator.clipboard.writeText(r.messaggio);toast('Messaggio copiato','ok')}
  catch(e){toast('Non riesco a copiare: il browser non lo permette','warn')}

async function liBulkSave(ev){
  ev.preventDefault();
  const who=document.getElementById('li-bw').value||null,inv=document.getElementById('li-bi').value==='oggi'?liToday():null;
  const key=(n,a)=>(String(n||'')+'|'+String(a||'')).toLowerCase().replace(/\s+/g,' ').trim();
  const have=new Set(li.rows.map(r=>key(r.nome,r.azienda)));
  const rows=[];let skip=0;
  for(const l of (document.getElementById('li-bt').value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,500)){
    const f=(l.includes('\t')?l.split('\t'):l.split(';')).map(x=>x.trim());
    if(!f[0]&&!f[1]){skip++;continue}
    const k=key(f[0],f[1]);if(have.has(k)){skip++;continue}have.add(k);
    const prof=pwSafeUrl(f[3]);
    rows.push({nome:f[0]||'',azienda:f[1]||'',ruolo:f[2]||'',url_profilo:prof||null,email:/@/.test(f[4]||'')?f[4]:null,competenza_di:who,stato:'da_contattare',invito_il:inv});
  }
  if(!rows.length){toast(skip?`Niente da aggiungere: ${skip} già presenti o vuote`:'Elenco vuoto','warn');return}
  const b=document.getElementById('li-bb');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> Aggiungo…'}
  for(let i=0;i<rows.length;i+=200){
    const {error}=await nlSupa.from('linkedin_contatti').insert(rows.slice(i,i+200));
    if(error){if(b){b.disabled=false;b.textContent='Aggiungi'}toast(error.message,'err');await liLoad({silent:true});return}
  }
  closeModal();toast(`Aggiunti ${rows.length} ${liPl(rows.length,'contatto','contatti')}`+(skip?` · ${skip} saltati`:''),'ok');
  await liLoad({silent:true});
}

/* ---- piccole utilità ---- */
const pjP=id=>pj.pr.find(p=>p.id===id);
const pjA=id=>pj.att.find(a=>a.id===id);
const pjOpenA=a=>a.stato!=='fatto';
function pjWho(){return pj.who||(ag.me?ag.me.id:'tutti')}
function pjMine(a){const w=pjWho();return w==='tutti'||(a.persone||[]).includes(w)}
function pjStats(p){
  const ts=pj.att.filter(a=>a.progetto_id===p.id),open=ts.filter(pjOpenA).length,done=(p.completate_notion||0)+ts.length-open;
  return {open,done,total:open+done};
}
function pjSort(list){return list.slice().sort((a,b)=>(b.urgente-a.urgente)||String(a.scadenza||'9999').localeCompare(String(b.scadenza||'9999'))||(a.id-b.id))}
function pjProjName(p){return p?(p.cliente&&p.cliente!==PJ_INTERNO?p.cliente:p.nome):'—'}
function pjDue(d){
  if(!d)return null;
  const x=new Date(d+'T00:00:00'),n=Math.round((x-today())/864e5);
  const lab=x.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
  if(n<0)return {c:'late',l:'Scaduta '+x.toLocaleDateString('it-IT',{day:'numeric',month:'short'})};
  if(n===0)return {c:'today',l:'Oggi'};
  if(n===1)return {c:'da',l:'Domani'};
  return {c:'da',l:lab};
}
function pjDriveId(u){u=String(u||'').trim();const m=u.match(/\/folders\/([A-Za-z0-9_-]{10,})/)||u.match(/[?&]id=([A-Za-z0-9_-]{10,})/);return m?m[1]:(/^[A-Za-z0-9_-]{20,}$/.test(u)?u:'')}
function pjSafeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
const pjAvs=ids=>`<span class="ag-avs pj-avs">${(ids||[]).map(u=>agAv(u,true)).join('')}</span>`;

/* ---- dati ---- */
function pjStop(){
  try{if(pj.ch)nlSupa.removeChannel(pj.ch)}catch(e){}
  clearInterval(pj.pollT);clearTimeout(pj.loadT);
  Object.assign(pj,{pr:[],att:[],loaded:false,loading:false,missing:false,ch:null,open:null,edit:null,editP:null,who:''});
}
async function pjLoad(opts={}){
  if(!nlSupa||!nl.session||pj.loading)return;
  pj.loading=true;if(state.view==='progetti'&&!opts.silent)render();
  try{
    const a=await nlSupa.from('progetti').select(PJ_PCOLS).order('nome');
    if(a.error){
      if(/does not exist|schema cache|42P01|PGRST205/i.test((a.error.code||'')+' '+a.error.message)){pj.missing=true;pj.loaded=true;pj.pr=[];pj.att=[];return}
      throw a.error;
    }
    const att=[];let from=0;
    for(;;){
      const {data,error}=await nlSupa.from('attivita').select(PJ_ACOLS).order('id').range(from,from+999);
      if(error)throw error;att.push(...data);if(data.length<1000)break;from+=1000;
    }
    pj.pr=a.data||[];pj.att=att;pj.missing=false;pj.loaded=true;
    pjSubscribe();
  }catch(e){toast('Progetti: '+(e.message||e),'err');pj.loaded=true}
  finally{pj.loading=false;if(state.view==='progetti'||state.view==='home')render();else renderNav()}
}
function pjDeferLoad(){clearTimeout(pj.loadT);pj.loadT=setTimeout(()=>pjLoad({silent:true}),700)}
function pjSubscribe(){
  if(pj.ch||!ag.me)return;
  try{
    pj.ch=nlSupa.channel('suite-progetti-'+ag.me.id)
      .on('postgres_changes',{event:'*',schema:'public',table:'progetti'},pjDeferLoad)
      .on('postgres_changes',{event:'*',schema:'public',table:'attivita'},pjDeferLoad)
      .subscribe();
  }catch(e){}
  clearInterval(pj.pollT);pj.pollT=setInterval(()=>{if(!document.hidden&&(state.view==='progetti'||state.view==='home'))pjLoad({silent:true})},120000);
}

/* ---- intestazione e azioni ---- */
function pjHeroCopy(){
  if(!nl.session)return {t:'Progetti.',l:'Accedi con il tuo account per vedere progetti e attività di Flowline.'};
  if(pj.missing)return {t:'Progetti.',l:'La sezione si attiva con la migrazione del database.'};
  if(!pj.loaded||!ag.loaded)return {t:'Progetti.',l:'Carico progetti e attività…'};
  if(pj.tab==='progetti'&&pj.open){
    const p=pjP(pj.open);if(!p)return {t:'Progetti.',l:''};
    const s=pjStats(p);
    return {t:p.nome+'.',l:[p.cliente,PJ_ST[p.stato].l,s.open?`${s.open} ${s.open===1?'attività aperta':'attività aperte'}`:'nessuna attività aperta'].filter(Boolean).join(' · ')};
  }
  if(pj.tab==='progetti'){
    const act=pj.pr.filter(p=>PJ_GROUPS.attivo.includes(p.stato));
    const open=pj.att.filter(a=>pjOpenA(a)&&act.some(p=>p.id===a.progetto_id)).length;
    return {t:'Progetti.',l:`${act.length} ${act.length===1?'progetto attivo':'progetti attivi'} · ${open} ${open===1?'attività aperta':'attività aperte'}`};
  }
  const my=pj.att.filter(a=>pjOpenA(a)&&pjMine(a));
  const c=k=>my.filter(a=>a.stato===k).length,u=my.filter(a=>a.urgente).length;
  const w=pjWho(),nm=w==='tutti'?'della squadra':(ag.me&&w===ag.me.id?'tue':'di '+((agPerson(w)||{}).nome||''));
  return {t:w==='tutti'?'Le attività della squadra.':(ag.me&&w===ag.me.id?'Le tue attività.':`Le attività ${nm}.`),
    l:[`${c('in_corso')} in corso`,`${c('da_fare')} da fare`,`${c('in_attesa')} in attesa`,u?`${u} ${u===1?'urgente':'urgenti'}`:null].filter(Boolean).join(' · ')};
}

function pjGroupByProject(list){

  return ids.map(id=>{const p=pjP(id);return `<div class="pj-grp"><button onclick="pjOpen(${id})">${esc(p?p.nome:'Progetto')}</button><span class="pj-gc">${esc(p&&p.cliente||'')}</span><span class="spacer"></span><span class="count">${g[id].length}</span></div><ul class="pj-list">${pjSort(g[id]).map(a=>pjRow(a)).join('')}</ul>`}).join('');
}

/* ---- azioni rapide ---- */
async function pjPatchA(id,patch,okMsg){
  const a=pjA(id);if(!a)return false;const old={...a};Object.assign(a,patch);render();
  const {data,error}=await nlSupa.from('attivita').update(patch).eq('id',id).select(PJ_ACOLS).single();
  if(error){Object.assign(a,old);render();toast(error.message,'err');return false}
  Object.assign(a,data);if(okMsg)toast(okMsg,'ok');render();return true;
}
async function pjDone(id){
  const a=pjA(id);if(!a)return;
  if(a.stato==='fatto'){await pjPatchA(id,{stato:'da_fare'},'Attività riaperta');return}
  const prev=a.stato;
  if(await pjPatchA(id,{stato:'fatto'})){
    const t=a.titolo.length>46?a.titolo.slice(0,44)+'…':a.titolo;
    pjUndoToast('Fatta: '+t,()=>pjPatchA(id,{stato:prev}));
  }
}
function pjUndoToast(msg,undo){
  toast(msg,'ok');
  const box=document.querySelector('#toasts .toast:last-child');
  if(box&&!box.querySelector('.pj-undo')){const b=document.createElement('button');b.className='pj-undo';b.textContent='Annulla';b.onclick=()=>{undo();b.remove()};box.appendChild(b)}
}
function pjCycle(id){const a=pjA(id);if(a)pjPatchA(id,{stato:PJ_NEXT[a.stato]||'da_fare'})}
async function pjQuickAdd(ev){
  ev.preventDefault();
  const t=document.getElementById('pj-qt'),pid=+document.getElementById('pj-qp').value,tit=(t.value||'').trim();
  if(!tit||!pid)return;
  pj.lastP=pid;t.disabled=true;
  const w=pjWho(),persone=w==='tutti'||pj.open?[ag.me.id]:[w];
  const {data,error}=await nlSupa.from('attivita').insert({progetto_id:pid,titolo:tit,persone}).select(PJ_ACOLS).single();
  t.disabled=false;
  if(error){toast(error.message,'err');return}
  pj.att.push(data);toast('Aggiunta a '+(pjP(pid)||{}).nome,'ok');render();
  const n=document.getElementById('pj-qt');if(n)n.focus();
}
async function pjPatchP(id,patch,okMsg){
  const p=pjP(id);if(!p)return;const old={...p};Object.assign(p,patch);render();
  const {data,error}=await nlSupa.from('progetti').update(patch).eq('id',id).select(PJ_PCOLS).single();
  if(error){Object.assign(p,old);render();toast(error.message,'err');return}
  Object.assign(p,data);if(okMsg)toast(okMsg,'ok');render();
}
function pjSetState(id,st){pjPatchP(id,{stato:st},'Stato: '+PJ_ST[st].l)}
function pjToggleUrg(id){const p=pjP(id);if(p)pjPatchP(id,{urgente:!p.urgente})}
function pjTogglePerson(id,uid){const p=pjP(id);if(!p)return;const s=p.persone||[];pjPatchP(id,{persone:s.includes(uid)?s.filter(x=>x!==uid):s.concat(uid)})}

function pjFileAdd(){
  const e=document.getElementById('pj-fl'),u=pjSafeUrl(e&&e.value);
  if(!u){toast('Incolla un link che inizi con https://','warn');return}
  if(pj.files.some(f=>f.url===u)){e.value='';return}
  let n='File collegato';
  try{const x=new URL(u);n=/drive|docs\.google/.test(x.hostname)?(/folders/.test(x.pathname)?'Cartella Drive':'Documento Drive'):x.hostname}catch(err){}
  pj.files.push({n,url:u});e.value='';pjPaintFiles();
}
function pjPickDrive(){
  const p=pjP(+document.getElementById('pj-fp').value);
  if(!googleReady()){toast('Per scegliere da Drive collega Google (in basso a destra). Intanto puoi incollare il link.','warn');return}
  if(!state.config.googleApiKey){toast('Per il selettore di Drive serve la Google API key nelle Impostazioni. Intanto puoi incollare il link.','warn');return}
  if(typeof gapi==='undefined'){toast('API Google non ancora caricate, riprova tra un attimo','err');return}
  gapi.load('picker',()=>{
    try{
      const view=new google.picker.DocsView().setIncludeFolders(true).setSelectFolderEnabled(true);
      if(p&&p.drive_id)view.setParent(p.drive_id);
      const picker=new google.picker.PickerBuilder().addView(view).enableFeature(google.picker.Feature.SUPPORT_DRIVES).enableFeature(google.picker.Feature.MULTISELECT_ENABLED)
        .setOAuthToken(state.google.token).setDeveloperKey(state.config.googleApiKey)
        .setCallback(data=>{
          if(data.action===google.picker.Action.PICKED&&data.docs){
            data.docs.forEach(d=>{const url=d.url||(PJ_FOLDER+d.id);if(!pj.files.some(f=>f.url===url))pj.files.push({n:d.name||'File Drive',url})});
            pjPaintFiles();
          }
        }).build();
      picker.setVisible(true);
    }catch(e){toast('Drive: '+e.message,'err')}
  });
}
async function pjTaskSave(ev){
  ev.preventDefault();
  const g=i=>document.getElementById(i);
  const row={titolo:(g('pj-ft').value||'').trim(),stato:(document.querySelector('input[name="pj-fs"]:checked')||{}).value||'da_fare',
    progetto_id:+g('pj-fp').value,persone:[...document.querySelectorAll('input[name="pj-fw"]:checked')].map(x=>x.value),
    scadenza:g('pj-fd').value||null,urgente:g('pj-fu').classList.contains('on'),note:(g('pj-fn').value||'').trim()||null,file:pj.files};
  if(!row.titolo){g('pj-ft').focus();return}
  if(!row.progetto_id){toast('Scegli un progetto','warn');return}
  const b=g('pj-fb');if(b)b.disabled=true;
  const id=pj.edit;
  const q=id?nlSupa.from('attivita').update(row).eq('id',id):nlSupa.from('attivita').insert(row);
  const {data,error}=await q.select(PJ_ACOLS).single();

async function pjTaskDelete(id){
  const a=pjA(id);if(!a)return;
  if(!confirm('Eliminare l\'attività «'+a.titolo+'»? Se è solo finita, meglio segnarla come fatta.'))return;
  const {error}=await nlSupa.from('attivita').delete().eq('id',id);

  pj.att=pj.att.filter(x=>x.id!==id);closeModal();toast('Attività eliminata','ok');render();

async function pjProjSave(ev){

  const row={nome:(g('pj-pn').value||'').trim(),cliente,stato:g('pj-ps').value,inizio:g('pj-pi').value||null,
    persone:[...document.querySelectorAll('input[name="pj-pw"]:checked')].map(x=>x.value),
    link:pjSafeUrl(g('pj-pl').value)||null,note:(g('pj-px').value||'').trim()||null,urgente:g('pj-pu').classList.contains('on'),drive_id:did||null};

  }

const LD_CATEGORIE=['aziende manifatturiere','metalmeccanica','carpenteria metallica','lavorazioni meccaniche conto terzi','industria alimentare','produzione mobili','materie plastiche','industria tessile','logistica e trasporti','impianti elettrici','impianti termoidraulici','imprese edili','commercio all\'ingrosso','studi commercialisti','studi legali','agenzie immobiliari','studi dentistici','hotel','ristoranti','concessionarie auto','officine meccaniche','cantine vinicole'];
const LD_PREZZO=0.006;   // dollari per azienda letta: Google Maps $0,004 + ricerca email sul sito $0,002 (Apify, ottobre 2026)
const ld={loaded:false,loading:false,searches:[],leads:[],sel:new Set(),view:'tutte',q:'',soloEmail:false,nascondiImportati:true,starting:false,pollT:null,err:''};
function ldForm(){
  if(!state.config.leadForm||typeof state.config.leadForm!=='object') state.config.leadForm={};
  const f=state.config.leadForm;
  if(!f.regione) f.regione='Lombardia';
  if(!Array.isArray(f.luoghi)) f.luoghi=[];
  if(typeof f.altri!=='string') f.altri='';
  if(!Array.isArray(f.categorie)) f.categorie=['metalmeccanica'];
  if(!f.target) f.target=50;
  if(typeof f.budget_auto!=='boolean') f.budget_auto=true;
  if(!f.budget) f.budget=ldSuggestBudget(f);
  ['solo_sito','escludi_chiuse','arricchisci'].forEach(k=>{if(typeof f[k]!=='boolean')f[k]=true});
  if(typeof f.solo_email!=='boolean') f.solo_email=false;
  return f;
}
function ldSaveForm(){save(LS.config,state.config)}
function ldAltri(f){return String(f.altri||'').split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,20)}
function ldResa(f){return f.solo_email?0.55:(f.solo_sito?0.8:0.9)}   // stessa stima del flusso n8n
function ldCostEstimate(f){const az=Math.ceil((+f.target||0)/ldResa(f));return {aziende:az,usd:az*LD_PREZZO}}
function ldSuggestBudget(f){const c=ldCostEstimate(f).usd;return Math.min(5,Math.max(0.3,Math.ceil(c*1.5*10)/10))}
function ldZones(f){const n=f.luoghi.length+ldAltri(f).length;return Math.max(1,n)}
function ldEur(usd){const r=+state.config.eurRate||EUR_DEFAULT;return '€'+(usd*r).toFixed(2).replace('.',',')}
function ldUsd(v){return '$'+(+v||0).toFixed(2).replace('.',',')}
function ldBusy(){return ld.searches.some(s=>s.status==='queued'||s.status==='running')}
function ldFmtAgo(ts){if(!ts)return '';const m=Math.max(0,Math.round((Date.now()-new Date(ts).getTime())/60000));return m<1?'meno di un minuto':m===1?'1 minuto':m<60?m+' minuti':Math.floor(m/60)+' h '+(m%60)+' min'}
function ldStuck(s){return (s.status==='running'||s.status==='queued') && Date.now()-new Date(s.started_at||s.created_at).getTime()>75*60000}

/* ---- dati ---- */
async function ldLoad(opts={}){
  if(!nlSupa||!nl.editor||ld.loading)return;
  ld.loading=true; if(state.view==='lead'&&!opts.silent) render();
  try{
    const [s,l]=await Promise.all([
      nlSupa.from('lead_searches').select('*').order('created_at',{ascending:false}).limit(50),
      nlSupa.from('leads').select('id,azienda,email,sede,ruolo,settore,descrizione,sito_web,telefono,fonte,email_fonte,search_id,importato_il,created_at,data').order('created_at',{ascending:false,nullsFirst:false}).limit(3000),
    ]);
    if(s.error)throw s.error; if(l.error)throw l.error;
    ld.searches=s.data||[]; ld.leads=l.data||[]; ld.loaded=true; ld.err='';
    const live=new Set(ld.leads.map(x=>x.id)); [...ld.sel].forEach(id=>{if(!live.has(id))ld.sel.delete(id)});
  }catch(e){ld.err=e.message||String(e); if(!opts.silent)toast('Lettura ricerche non riuscita: '+ld.err,'err')}
  ld.loading=false;
  ldSchedulePoll();
  if(state.view==='lead') render();
}
function ldSchedulePoll(){
  clearTimeout(ld.pollT); ld.pollT=null;
  if(!ldBusy())return;
  ld.pollT=setTimeout(ldPoll,8000);
}
async function ldPoll(){
  if(!nlSupa||!nl.editor)return;
  const before=new Map(ld.searches.map(s=>[s.id,s.status])), beforeIns=new Map(ld.searches.map(s=>[s.id,s.inserted||0]));
  const {data,error}=await nlSupa.from('lead_searches').select('*').order('created_at',{ascending:false}).limit(50);
  if(!error&&data){
    ld.searches=data;
    const finished=data.filter(s=>(before.get(s.id)==='queued'||before.get(s.id)==='running')&&(s.status==='done'||s.status==='error'));
    if(finished.length){
      finished.forEach(s=>s.status==='done'
        ?toast(`Ricerca finita: ${s.inserted||0} ${s.inserted===1?'lead nuovo':'lead nuovi'}, spesa ${ldUsd(s.spent_usd)}`,'ok')
        :toast('Ricerca non riuscita: '+(s.error||'errore sconosciuto'),'err'));
      const done=finished.find(s=>s.inserted); if(done){ld.view=done.id;ld.sel.clear();}
      await ldLoad({silent:true}); return;
    }
    if(data.some(s=>s.status==='running'&&(s.inserted||0)>(beforeIns.get(s.id)||0))){await ldLoad({silent:true});return}
    if(state.view==='lead') ldPaintSearches();
  }
  ldSchedulePoll();
}

/* ---- modulo ---- */
function ldSet(k,v){const f=ldForm();f[k]=v;ldSaveForm();render()}
function ldSetQuiet(k,v){const f=ldForm();f[k]=v;if(k==='budget')f.budget_auto=false;if(f.budget_auto&&k!=='budget'){f.budget=ldSuggestBudget(f);const b=document.getElementById('ld-bud');if(b)b.value=f.budget}ldSaveForm();ldPaintSummary()}
function ldBudgetAuto(){const f=ldForm();f.budget_auto=true;f.budget=ldSuggestBudget(f);ldSaveForm();render()}
function ldRegion(v){const f=ldForm();f.regione=v;f.luoghi=[];ldSaveForm();render()}
function ldToggleLuogo(c){const f=ldForm();const i=f.luoghi.indexOf(c);if(i>=0)f.luoghi.splice(i,1);else f.luoghi.push(c);ldSaveForm();render()}
function ldAllLuoghi(on){const f=ldForm();f.luoghi=on?[...(LD_REGIONI[f.regione]||[])]:[];ldSaveForm();render()}
function ldToggleCat(c){const f=ldForm();const i=f.categorie.indexOf(c);if(i>=0)f.categorie.splice(i,1);else{if(f.categorie.length>=10){toast('Massimo 10 categorie per ricerca','warn');return}f.categorie.push(c)}ldSaveForm();render()}
function ldAddCat(ev){
  ev&&ev.preventDefault();
  const inp=document.getElementById('ld-cat-new');const v=(inp?.value||'').replace(/\s+/g,' ').trim().toLowerCase().slice(0,60);
  if(!v)return; const f=ldForm();
  if(f.categorie.includes(v)){inp.value='';return}
  if(f.categorie.length>=10){toast('Massimo 10 categorie per ricerca','warn');return}
  f.categorie.push(v);ldSaveForm();render();
  setTimeout(()=>document.getElementById('ld-cat-new')?.focus(),30);
}
function ldPaintSummary(){
  const el=document.getElementById('ld-sum');if(el)el.innerHTML=ldSummaryHtml();
  const b=document.getElementById('ld-go');if(b)b.disabled=!ldCanStart().ok;
}
function ldCanStart(){
  const f=ldForm();
  if(ldBusy())return {ok:false,why:'C\'è già una ricerca in corso: aspetta che finisca.'};
  if(!f.categorie.length)return {ok:false,why:'Scegli almeno una categoria.'};
  if(ldAltri(f).length>10)return {ok:false,why:'Al massimo 10 città o zone scritte a mano.'};

function ldRepeat(id){

  else (p.luoghi||[]).forEach(l=>{const base=l.endsWith(suf)?l.slice(0,-suf.length):null; if(base&&prov.includes(base))f.luoghi.push(base); else altri.push(l)});

}

function ldContactEmails(){return new Set(state.contacts.map(c=>(c.email||'').trim().toLowerCase()).filter(Boolean))}
function ldLeadState(l,have){
  const e=(l.email||'').trim().toLowerCase();
  if(e&&have.has(e))return 'in';
  if(l.importato_il)return 'gone';
  if(!e)return 'noemail';
  return 'new';
}
function ldRows(){
  const have=ldContactEmails(), q=ld.q.trim().toLowerCase();
  return ld.leads.filter(l=>{
    if(ld.view==='precedenti'){if(l.search_id)return false}
    else if(ld.view!=='tutte'&&l.search_id!==ld.view)return false;
    const st=ldLeadState(l,have);
    if(ld.nascondiImportati&&(st==='in'||st==='gone'))return false;
    if(ld.soloEmail&&!l.email)return false;
    if(q&&![l.azienda,l.email,l.sede,l.settore,l.ruolo].some(x=>String(x||'').toLowerCase().includes(q)))return false;
    return true;
  });
}
function ldSetView(v){ld.view=v;ld.sel.clear();render()}
function ldToggleOpt(k){ld[k]=!ld[k];ld.sel.clear();render()}
function ldSearch(v){ld.q=v;clearTimeout(window._ldq);window._ldq=setTimeout(()=>{render();const i=document.getElementById('ld-q');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},220)}
function ldSel(id,on){if(on)ld.sel.add(id);else ld.sel.delete(id);ldPaintSel()}

function ldPaintSel(){

  if(el){el.hidden=!n;const b=document.getElementById('ld-sel-n');if(b)b.textContent=n;const t=document.getElementById('ld-sel-t');if(t)t.textContent=n===1?'lead scelto':'lead scelti';}
}
function ldExportCsv(all){
  const have=ldContactEmails();
  const rows=all?ldRows():ld.leads.filter(l=>ld.sel.has(l.id));
  if(!rows.length){toast('Scegli almeno un lead da esportare','warn');return}
  const cell=v=>{const t=String(v??'').replace(/\s*[\r\n]+\s*/g,' ');return /[";,]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const byId=Object.fromEntries(ld.searches.map(s=>[s.id,s]));
  const stl={new:'Nuovo',in:'Nei contatti',gone:'Eliminato dai contatti',noemail:'Senza email'};
  const head=['azienda','email','telefono','sito web','sede','settore','referente / ruolo','descrizione','fonte','email: origine','campagna','trovato il','stato'];
  const out=rows.map(l=>[l.azienda,l.email,l.telefono,l.sito_web,l.sede,l.settore,l.ruolo,l.descrizione,l.fonte,l.email_fonte,l.search_id&&byId[l.search_id]?ldSearchLabel(byId[l.search_id]):'Flusso giornaliero',l.created_at?String(l.created_at).slice(0,10):'',stl[ldLeadState(l,have)]].map(cell).join(';'));
  const sch=ld.view!=='tutte'&&ld.view!=='precedenti'?byId[ld.view]:null;
  const nome=(sch?'lead-campagna-'+String(sch.created_at).slice(0,10):'lead-tutte-le-ricerche')+'-esportato-'+isoD(today())+'.csv';
  const url=URL.createObjectURL(new Blob(['\ufeff'+[head.join(';'),...out].join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:nome});
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`${rows.length} ${rows.length===1?'lead esportato':'lead esportati'} in CSV`,'ok');
}
async function ldImport(){
  const have=ldContactEmails();
  const pick=ld.leads.filter(l=>ld.sel.has(l.id));
  const ok=[]; let skip=0;
  for(const l of pick){const e=(l.email||'').trim().toLowerCase(); if(!e||have.has(e)||l.importato_il){skip++;continue} have.add(e); ok.push(l)}
  if(!ok.length){toast('Tra quelli scelti non c\'è nessun lead nuovo con email','warn');return}
  ok.forEach(l=>state.contacts.push(mkContact({azienda:l.azienda||'',sede:l.sede||'',email:l.email,ruolo:l.ruolo||'',settore:l.settore||'',descrizione:l.descrizione||'',sitoWeb:l.sito_web||''})));
  persist();
  const now=new Date().toISOString();
  ok.forEach(l=>l.importato_il=now); ld.sel.clear(); render();
  const {error}=await nlSupa.from('leads').update({importato_il:now}).in('id',ok.map(l=>l.id));
  if(error) console.warn('importato_il',error.message);
  toast(`${ok.length} ${ok.length===1?'lead aggiunto':'lead aggiunti'} ai contatti${skip?` · ${skip} saltati (senza email o già presenti)`:''}. Li trovi in Pianificazione.`,'ok');
}
