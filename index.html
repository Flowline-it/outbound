<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowLine Suite</title>
<meta name="theme-color" content="#F3F3F1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%2260%2080%201800%201800%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22flg%22%20x1%3D%2282%22%20y1%3D%220%22%20x2%3D%221483%22%20y2%3D%220%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23FF9900%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23FDC060%22%2F%3E%3C%2FlinearGradient%3E%3Cmask%20id%3D%22flm%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%221932%22%20height%3D%221932%22%20fill%3D%22%23fff%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%22730%22%20width%3D%22520%22%20height%3D%22568%22%20fill%3D%22%23000%22%2F%3E%3C%2Fmask%3E%3C%2Fdefs%3E%3Cpath%20mask%3D%22url%28%23flm%29%22%20fill%3D%22%233A3D42%22%20fill-rule%3D%22evenodd%22%20d%3D%22M958%2083a877%20877%200%201%200%200.1%200zM958%20320a640%20640%200%201%201-0.1%200z%22%2F%3E%3Ccircle%20cx%3D%22968%22%20cy%3D%22965%22%20r%3D%22515%22%20fill%3D%22url%28%23flg%29%22%2F%3E%3Crect%20x%3D%2282%22%20y%3D%22898%22%20width%3D%22400%22%20height%3D%22205%22%20fill%3D%22url%28%23flg%29%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#F5F5F2; --surface-3:#EDEDE9; --border:#E8E8E3; --border-strong:#D3D3CC;
  --text:#18181A; --muted:#5C5C57; --faint:#73736D;
  --brand:#FF9900; --brand-hover:#FFA826; --on-brand:#1F1F1F; --brand-soft:#FFF1DC;
  --ink:#18181A; --on-ink:#FFFFFF; --ink-2:#2C2C2E; --ink-dim:#A9A9A4;
  --lilac:#FFFFFF; --on-lilac:#18181A; --lilac-2:#F3E8F5;
  --cobalt:#2B5BD8; --on-cobalt:#FFFFFF; --cobalt-2:#4672E2;
  --peach:#FFFFFF; --on-peach:#18181A;
  --accent:#A85400; --accent-soft:#FFF1DC; --accent-2:#2B5BD8;
  --ok:#18703E; --ok-soft:#E3F4E8; --warn:#8F6200; --warn-soft:#FBF1D9;
  --late:#C62F26; --late-soft:#FCE6E3; --wait:#2B5BD8; --wait-soft:#E6EDFC;
  --s1:#18181A; --s2:#2B5BD8; --s3:#B565B5; --s4:#C62F26; --s5:#1E7D45;
  --r-xl:22px; --r-lg:18px; --r-md:14px; --r-sm:10px; --pill:999px;
  --radius:18px; --radius-sm:12px;
  --card-shadow:0 1px 2px rgba(20,20,18,.04),0 1px 0 rgba(20,20,18,.02);
  --card-shadow-hover:0 2px 4px rgba(20,20,18,.05),0 14px 32px -16px rgba(20,20,18,.20);
  --shadow:0 1px 2px rgba(20,20,18,.05),0 8px 24px -12px rgba(20,20,18,.16);
  --shadow-lg:0 2px 8px rgba(0,0,0,.08),0 30px 60px -20px rgba(0,0,0,.30);
  --focus:#A85400;
  --logo-ring:#3A3D42;
  --ease:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0E0E0F; --surface:#18181A; --surface-2:#202022; --surface-3:#29292B; --border:#2A2A2D; --border-strong:#3E3E42;
  --text:#F2F2EF; --muted:#ABABA6; --faint:#8C8C87;
  --brand-soft:#33240F;
  --ink:#232325; --ink-2:#303033; --ink-dim:#9E9E99;
  --lilac:#18181A; --on-lilac:#F2F2EF; --lilac-2:#33243A;
  --cobalt:#2B5BD8; --cobalt-2:#3F6DE0;
  --peach:#18181A; --on-peach:#F2F2EF;
  --accent:#FFB040; --accent-soft:#33240F; --accent-2:#8DB0F7;
  --ok:#5FD08A; --ok-soft:#14291B; --warn:#E8B44A; --warn-soft:#2E250E;
  --late:#FF6A5C; --late-soft:#351A17; --wait:#8DB0F7; --wait-soft:#17223F;
  --s1:#F2F2EF; --s2:#8DB0F7; --s3:#E9A6E9; --s4:#FF6A5C; --s5:#5FD08A;
  --card-shadow:0 0 0 1px rgba(255,255,255,.04);
  --card-shadow-hover:0 0 0 1px rgba(255,255,255,.08),0 18px 40px -18px rgba(0,0,0,.8);
  --shadow:0 0 0 1px rgba(255,255,255,.05),0 12px 32px -14px rgba(0,0,0,.7);
  --shadow-lg:0 0 0 1px rgba(255,255,255,.06),0 30px 60px -20px rgba(0,0,0,.85);
  --focus:#FF9900;
  --logo-ring:#6B6E74;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-stretch:100%;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--brand);color:var(--on-brand)}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
*{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.mono,.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-stretch:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--text);caret-color:var(--brand)}
a{color:var(--accent);text-underline-offset:3px}
svg{flex-shrink:0}

/* ===== guscio: barra in alto ===== */
.app{display:block;min-height:100vh}
.topnav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid transparent;transition:border-color .25s var(--ease),background .25s var(--ease)}
body.scrolled .topnav{border-bottom-color:var(--border)}
.topnav-in{max-width:1320px;margin:0 auto;height:72px;display:flex;align-items:center;gap:14px;padding:0 40px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;cursor:pointer}
.brand .logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.brand .logo svg{width:34px;height:34px;display:block}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.025em;line-height:1}
.brand .sub{display:none}
.brand .suite{font-weight:500;color:var(--muted)}
.nav-spacer{flex:1}
/* livello 1: aree della suite, pillola che scorre */
.sec-wrap{position:relative;display:flex;padding:4px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--card-shadow);margin:0 auto}
.sec-switch{display:flex;gap:2px;position:relative;z-index:1}
.sec-switch > button{display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--pill);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;transition:color .25s var(--ease),background .2s var(--ease)}
.sec-switch > button:hover{color:var(--text);background:var(--surface-2)}
.sec-switch > button[aria-pressed="true"],.sec-switch > button[aria-pressed="true"]:hover{color:#fff;background:transparent}
[data-theme="dark"] .sec-switch > button[aria-pressed="true"]{color:var(--bg)}
.sec-switch > button .ico{width:16px;height:16px;display:none}
.sec-switch > button[aria-pressed="true"] .ico{display:block}
.sec-switch > button .dotb{width:7px;height:7px;border-radius:50%;background:var(--brand);margin-left:-2px}
.sec-switch > button .dotb.late{background:var(--late)}
.pill-ind{position:absolute;top:0;left:0;height:0;width:0;border-radius:var(--pill);background:var(--ink);z-index:0;pointer-events:none;opacity:0;
  transition:transform .45s var(--spring),width .45s var(--spring),height .2s var(--ease),opacity .2s var(--ease)}
[data-theme="dark"] .pill-ind{background:var(--text)}
.pill-ind.no-anim{transition:none}
.nav-tools{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .18s var(--ease),color .18s var(--ease),transform .2s var(--ease)}
.icon-btn:hover{background:var(--surface);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:19px;height:19px}
.theme-btn .i-sun{display:none}
[data-theme="dark"] .theme-btn .i-sun{display:block}
[data-theme="dark"] .theme-btn .i-moon{display:none}
.theme-btn svg{transition:transform .5s var(--spring)}
.theme-btn:hover svg{transform:rotate(-18deg)}
.menu-btn{display:none;width:42px;height:42px;border-radius:50%;align-items:center;justify-content:center;background:var(--surface);margin-left:auto;box-shadow:var(--card-shadow)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
.scrim.show{display:block}
/* spesa API (solo Outbound) */
.spend-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--pill);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:650;box-shadow:var(--card-shadow);transition:background .18s var(--ease)}
.spend-pill:hover{background:var(--surface-2)}
.spend-pill .ico{width:13px;height:13px;color:var(--accent)}
.spend-pill #spendTxt{font-variant-numeric:tabular-nums}
.spend-pill .spend-gen{font-size:12px;font-weight:500;color:var(--muted)}
.spend-table{width:100%;font-size:14px;border-collapse:collapse}
.spend-table td{padding:9px 0;border-bottom:1px solid var(--border)}
.spend-table td:last-child{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.spend-table tr:last-child td{border:none}
.spend-big{font-size:40px;font-weight:650;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

/* ===== intestazione della pagina ===== */
.main{min-width:0}
.page-head{max-width:1320px;margin:0 auto;padding:22px 40px 0}
.ph-top{display:flex;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.ph-title{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:4px}
.page-head .crumb{font-size:13px;font-weight:600;color:var(--faint);display:flex;align-items:center;gap:6px}
.page-head h2{font-size:30px;line-height:1.12;font-weight:650;letter-spacing:-.03em;text-wrap:balance;max-width:28ch}
.page-head .lede{font-size:14.5px;line-height:1.5;color:var(--muted);max-width:80ch}
.page-head .lede:empty{display:none}
.ph-actions,#topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ph-bar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:20px}
.ph-spacer{flex:1}
.ph-status{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.conn-pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--pill);font-size:12.5px;font-weight:600;
  background:var(--surface);color:var(--muted);max-width:300px;box-shadow:var(--card-shadow)}
.conn-pill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date-pill{text-transform:capitalize;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);flex:0 0 auto}
.dot.on{background:#1FA45B;box-shadow:0 0 0 3px color-mix(in srgb,#1FA45B 18%,transparent)}
.dot.warn{background:#E8A200;box-shadow:0 0 0 3px color-mix(in srgb,#E8A200 18%,transparent)}
.test-banner{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:var(--pill);font-size:12.5px;font-weight:600;background:var(--warn-soft);color:var(--warn)}
.test-banner b{font-weight:750}
/* livello 2: pagine dell'area, schede a pillola */
.subnav-wrap{position:relative;display:flex;padding:4px;border-radius:var(--pill);background:var(--surface);box-shadow:var(--card-shadow);max-width:100%;min-width:0}
.nav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;position:relative;z-index:1}
.nav::-webkit-scrollbar{display:none}
.nav .nav-area{display:none}
.nav button{display:flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--pill);
  font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap;transition:background .18s var(--ease),color .25s var(--ease)}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.active,.nav button.active:hover{background:transparent;color:#fff}
[data-theme="dark"] .nav button.active{color:var(--bg)}
.nav button .ico{display:none}
.nav button .badge{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;min-width:19px;height:19px;padding:0 6px;border-radius:var(--pill);
  display:flex;align-items:center;justify-content:center;background:var(--brand);color:var(--on-brand)}
.nav .badge.late{background:var(--late);color:#fff}
.nav .badge.ok{background:#1E7D45;color:#fff}
.nav .badge.plain{background:var(--surface-3);color:var(--text)}
.nav button.active .badge.plain{background:rgba(255,255,255,.2);color:inherit}
.content{max-width:1320px;margin:0 auto;padding:22px 40px 96px}

/* ===== generic ui ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--pill);
  font-weight:650;font-size:14.5px;background:var(--surface);border:1.5px solid var(--border-strong);color:var(--text);
  transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease);
  text-decoration:none;white-space:nowrap;line-height:1}
.btn:hover{border-color:var(--text)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--on-brand);font-weight:700}
.btn.primary:hover{background:var(--brand-hover)}
.btn.dark{background:var(--ink);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
.btn.danger{color:var(--late);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--late-soft)}
.btn.sm{height:36px;padding:0 15px;font-size:13.5px;gap:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn .ico{width:16px;height:16px}
.btn.sm .ico{width:15px;height:15px}

.card{background:var(--surface);border:none;border-radius:var(--r-lg)}
.grid{display:grid;gap:16px}
.section-h{display:flex;align-items:center;gap:12px;margin:44px 0 16px;flex-wrap:wrap}
.section-h h3{font-size:26px;font-weight:800;font-stretch:110%;letter-spacing:-.035em;line-height:1.1}
.section-h .count{font-size:13px;font-weight:700;min-width:28px;height:28px;padding:0 9px;border-radius:var(--pill);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.section-h .line{flex:1;min-width:10px}

/* ===== tiles / bento ===== */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.tile{border-radius:var(--r-xl);padding:26px 28px;background:var(--surface);min-width:0;position:relative;overflow:hidden}
.tile-h{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.tile-h h3{font-size:24px;font-weight:800;font-stretch:110%;letter-spacing:-.035em;line-height:1.1}
.tile-h .spacer{flex:1}
.tile-h .sub{font-size:14px;font-weight:600;opacity:.75}
.t-ink{background:var(--ink);color:#fff}
.t-lilac{background:var(--lilac);color:var(--on-lilac)}
.t-cobalt{background:var(--cobalt);color:#fff}
.t-peach{background:var(--peach);color:var(--on-peach)}
.t-orange{background:var(--brand);color:var(--on-brand)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.stat-t{border-radius:var(--r-xl);padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;min-height:168px;gap:14px}
.stat-t .k{font-size:15px;font-weight:650;line-height:1.25}
.stat-t .v{font-size:56px;font-weight:800;font-stretch:112%;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.stat-t .m{font-size:13px;font-weight:500;opacity:.75}
.stat-t .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.stat-t .btn{height:34px;padding:0 14px;font-size:13px}

/* week chart tile */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:190px}
.wk-c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;min-width:0}
.wk-n{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.wk-b{width:100%;max-width:46px;border-radius:14px;background:rgba(255,255,255,.95);min-height:8px;transition:height .5s var(--ease)}
.wk-b.zero{background:rgba(255,255,255,.22)}
.wk-c.today .wk-b{background:var(--brand)}
.wk-d{font-size:12.5px;font-weight:600;text-transform:capitalize;opacity:.85;text-align:center;line-height:1.2}
.wk-d b{display:block;font-weight:800;font-size:13px;opacity:1}

/* ===== departures list (board) ===== */
.board{background:var(--ink);color:#fff;border-radius:var(--r-xl);overflow:hidden;padding:8px 0 6px}
.board-h{display:flex;align-items:center;gap:12px;padding:20px 26px 14px;flex-wrap:wrap}
.board-h .bt{font-size:24px;font-weight:800;font-stretch:110%;letter-spacing:-.035em;line-height:1.1}
.board-h .bt .lit{color:var(--brand)}
.board-h .bsub{font-size:14px;font-weight:600;color:var(--ink-dim)}
.board-h .spacer{flex:1}
.board-h .clock{height:32px;padding:0 13px;border-radius:var(--pill);background:var(--ink-2);display:inline-flex;align-items:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.board-h .btn{background:transparent;border-color:#5A5A56;color:#fff}
.board-h .btn:hover{border-color:#fff}
.board-h .btn.primary{background:var(--brand);border-color:transparent;color:var(--on-brand)}
.board table{font-size:14.5px;border-collapse:separate;border-spacing:0 2px;padding:0 12px;width:100%}
.board thead{display:none}
.board td{padding:0 14px;height:54px;border:none;color:#fff;background:transparent}
.board tbody tr{cursor:pointer}
.board tbody tr td:first-child{border-radius:16px 0 0 16px}
.board tbody tr td:last-child{border-radius:0 16px 16px 0}
.board tbody tr:hover td{background:var(--ink-2)}
.board .b-n{width:44px;color:var(--ink-dim);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.board .b-dest{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;width:42%;letter-spacing:-.01em}
.board .b-city{color:var(--ink-dim);font-size:13.5px;white-space:nowrap}
.board .b-step{white-space:nowrap}
.board .b-step{font-size:12.5px;font-weight:650;color:#fff}
.board .b-step span{display:inline-block;padding:4px 10px;border-radius:var(--pill);box-shadow:inset 0 0 0 1.5px #5A5A56}
.board .b-date{font-variant-numeric:tabular-nums;font-size:14px;font-weight:650;white-space:nowrap;color:var(--ink-dim)}
.board .b-date.late{color:#FF8A7E}
.board .b-st{width:160px;text-align:right}
.board tr.gone td{color:var(--ink-dim)}
.board-empty{padding:10px 26px 24px;color:var(--ink-dim);font-size:14.5px}
.board-foot{display:flex;align-items:center;gap:10px;padding:12px 26px 18px;font-size:14px;color:var(--ink-dim);flex-wrap:wrap}
.board-foot .spacer{flex:1}
.board-foot .btn{background:#fff;border-color:transparent;color:#292929}
.board-foot .btn:hover{background:var(--brand)}
.flap{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 13px;border-radius:var(--pill);
  font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--ink-2);color:#fff}
.flap.today{background:var(--brand);color:var(--on-brand)}
.flap.late{background:#FF8A7E;color:#2A0E0B}
.flap.wait{background:#9DB8FA;color:#0E1D45}
.flap.reply,.flap.gone{background:#8FE0AE;color:#0D2416}
.flap.plan,.flap.done,.flap.stop{background:var(--ink-2);color:var(--ink-dim)}
.flap.flip{animation:pop .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}

/* arrivals (replies) */
.arr-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.arr-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-radius:var(--r-md);background:rgba(255,255,255,.72);color:#292929;cursor:pointer;transition:background .18s var(--ease),transform .18s var(--ease)}
[data-theme="dark"] .arr-item{background:rgba(255,255,255,.08);color:var(--on-lilac)}
.arr-item:hover{background:#fff;transform:translateY(-1px)}
[data-theme="dark"] .arr-item:hover{background:rgba(255,255,255,.14)}
.arr-dest{font-weight:750;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.arr-time{font-size:12.5px;font-weight:650;opacity:.7;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.arr-time small{font-size:inherit;font-weight:inherit}
.arr-snip{grid-column:1 / -1;font-size:13.5px;line-height:1.45;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.arr-empty{font-size:15px;line-height:1.5;opacity:.85;padding:6px 0 10px}

/* ===== tables ===== */
.table-wrap{overflow:auto;border-radius:var(--r-lg);background:var(--surface);padding:6px 10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--faint);font-size:13px;padding:14px 14px 10px;white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--border)}
td{padding:13px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .15s var(--ease)}
tbody tr:hover{background:var(--surface-2)}
.az{font-weight:650}
.email-cell{color:var(--muted);font-size:13px}

/* ===== status pills ===== */
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px 0 10px;border-radius:var(--pill);font-size:12.5px;font-weight:650;white-space:nowrap}
.chip .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.da{background:var(--surface-2);color:var(--muted)} .chip.da .d{background:var(--faint)}
.chip.plan{background:var(--lilac-2);color:var(--on-lilac)} .chip.plan .d{background:#B565B5}
[data-theme="dark"] .chip.plan .d{background:#E9A6E9}
.chip.seq{background:var(--accent-soft);color:var(--accent)} .chip.seq .d{background:var(--brand)}
.chip.wait{background:var(--wait-soft);color:var(--wait)} .chip.wait .d{background:var(--wait)}
.chip.reply{background:var(--ok-soft);color:var(--ok)} .chip.reply .d{background:var(--ok)}
.chip.done{background:var(--surface-2);color:var(--faint)} .chip.done .d{background:var(--faint)}
.chip.stop{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--border-strong)} .chip.stop .d{background:var(--late)}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.late .d{background:var(--late)}
.chip.today{background:var(--brand);color:var(--on-brand)} .chip.today .d{background:var(--on-brand)}
.step-pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:var(--pill);font-size:12.5px;font-weight:650;color:var(--text);box-shadow:inset 0 0 0 1.5px var(--border-strong);white-space:nowrap}

/* ===== send queue ===== */
.qboard{margin-bottom:8px}
.queue-card{border-radius:var(--r-xl);background:var(--surface);margin-bottom:16px;padding:6px;scroll-margin-top:100px;transition:box-shadow .25s var(--ease)}
.queue-card:focus-within{box-shadow:0 0 0 2px var(--border-strong)}
.queue-card.pulse{animation:qpulse 1.3s var(--ease)}
@keyframes qpulse{0%{box-shadow:0 0 0 4px var(--brand)}100%{box-shadow:0 0 0 0 transparent}}
.qc-head{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:18px 22px 16px;border-radius:26px;background:var(--surface-2)}
.qc-head > div:first-child{min-width:0;margin-right:auto}
.qc-head .qn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:800;margin-right:10px;vertical-align:middle;font-variant-numeric:tabular-nums}
.qc-head .az{font-size:22px;font-weight:800;font-stretch:108%;letter-spacing:-.03em;line-height:1.2}
.qc-head .meta{font-size:13.5px;color:var(--muted)}
.qc-head > div:first-child .meta{margin-top:3px}
.qc-head .spacer{display:none}
.qc-head .qtags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qc-head > .meta:last-child{font-weight:600}
.qc-main{display:grid;grid-template-columns:minmax(0,720px) minmax(200px,260px);gap:0 24px;align-items:start}
.qc-main .qc-foot{flex-direction:column;align-items:stretch;padding:22px 22px 22px 0;max-width:none;gap:8px;position:sticky;top:100px}
.qc-main .qc-foot .spacer{display:none}
.qc-main .qc-foot .btn.primary{order:-1;height:54px;font-size:16px}
.qc-main .qc-foot .btn{width:100%}
.qc-body{padding:22px 22px 8px;display:flex;flex-direction:column;gap:16px;max-width:720px}
.field-lbl{font-size:13px;font-weight:700;color:var(--text);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.field-lbl .cnt{margin-left:auto;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
input.subj,textarea.body{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--r-md);padding:12px 16px;resize:vertical;
  transition:border-color .18s var(--ease),background .18s var(--ease)}
input.subj{font-size:16.5px;font-weight:650;border-radius:var(--pill);padding:12px 20px}
input.subj:hover,textarea.body:hover{border-color:var(--border)}
input.subj:focus,textarea.body:focus{outline:none;background:var(--surface);border-color:var(--focus)}
textarea.body{min-height:250px;line-height:1.7;white-space:pre-wrap;font-size:15.5px;padding:16px 20px;border-radius:22px}
.qc-foot{display:flex;align-items:center;gap:8px;padding:8px 22px 20px;flex-wrap:wrap;max-width:720px}
.qc-foot .spacer{flex:1}
.qc-foot .btn.primary{height:48px;padding:0 26px;font-size:15px}
.preview-note{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:7px}

.alert{display:flex;align-items:center;gap:14px;padding:16px 18px 16px 20px;border-radius:var(--r-lg);margin-bottom:16px;background:var(--late-soft);color:var(--text)}
.alert .ai{width:22px;height:22px;color:var(--late);flex:0 0 auto}
.alert b{font-weight:750}
.alert .email-cell{color:color-mix(in srgb,var(--late) 55%,var(--text))}

/* agenda */
.agenda-col{margin-bottom:20px}
.agenda-day{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.agenda-day .dnum{font-size:24px;font-weight:800}
.agenda-day .dname{font-size:13px;color:var(--muted);font-weight:600;text-transform:capitalize}
.agenda-day .dcount{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600}
.agenda-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-md);background:var(--surface);margin-bottom:7px}
.agenda-row .az{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agenda-row .when{font-size:12px;color:var(--muted);white-space:nowrap}

/* ===== planning ===== */
.card:has(> .load-strip){background:transparent;overflow:visible!important}
.load-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px}
.load-cell{display:flex;flex-direction:column;gap:10px;padding:16px 14px 14px;border-radius:var(--r-lg);background:var(--surface);min-width:0}
.load-cell.today{background:var(--brand);color:var(--on-brand)}
.load-d{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:capitalize;line-height:1.3}
.load-d b{display:block;color:var(--text);font-weight:750;font-variant-numeric:tabular-nums}
.load-cell.today .load-d,.load-cell.today .load-d b{color:var(--on-brand)}
.load-n{font-size:34px;font-weight:800;font-stretch:110%;letter-spacing:-.04em;line-height:1;order:2;font-variant-numeric:tabular-nums}
.load-n.over{color:var(--late)}
.load-bar-wrap{order:3;width:100%;height:8px;border-radius:var(--pill);background:var(--surface-2);overflow:hidden;display:flex}
.load-cell.today .load-bar-wrap{background:rgba(41,41,41,.18)}
.load-bar{height:100%!important;border-radius:var(--pill);background:var(--ink);min-width:3px;transition:width .4s var(--ease)}
[data-theme="dark"] .load-bar{background:var(--text)}
.load-cell.today .load-bar{background:var(--on-brand)}
.load-bar.over{background:var(--late)!important}
.plan-bar{padding:8px 0;margin:16px 0;display:flex;flex-direction:column;border-radius:var(--r-xl)}
.plan-bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 24px}
.plan-bar-row + .plan-bar-row{border-top:1px solid var(--border)}
.plan-sel-info{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px;font-weight:500}
.plan-sel-info b{color:var(--text);font-size:30px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;min-width:1.1em}
.plan-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.plan-lbl{font-size:15px;font-weight:750;color:var(--text);min-width:210px}
.plan-bar input[type=date],.plan-bar input[type=number],.table-wrap input[type=date]{height:40px;background:var(--surface-2);border:1.5px solid transparent;border-radius:var(--pill);padding:0 16px;font-variant-numeric:tabular-nums}
.plan-bar input:focus,.table-wrap input[type=date]:focus{outline:none;border-color:var(--focus);background:var(--surface)}
input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:var(--ink)}
[data-theme="dark"] input[type=checkbox]{accent-color:var(--brand)}
.table-wrap input[type=date]{height:36px;font-size:13px;padding:0 13px}

/* ===== calendar ===== */
.cal-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cal-bar .btn.ghost{width:44px;padding:0;background:var(--surface)}
.cal-title{flex:1;display:flex;flex-direction:column;line-height:1.2;gap:3px;text-align:center}
.cal-title b{font-size:28px;font-weight:800;font-stretch:110%;letter-spacing:-.04em}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.cal-cell{background:var(--surface);border-radius:var(--r-lg);min-height:250px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cal-cell.today{background:var(--brand);color:var(--on-brand)}
.cal-cell.wknd{background:var(--surface-2)}
.cal-cell.past .cal-dname,.cal-cell.past .cal-dnum,.cal-cell.past .cal-az{color:var(--faint)}
.cal-cell-h{display:flex;align-items:center;gap:6px;padding:16px 16px 8px}
.cal-dname{font-size:13px;color:var(--muted);font-weight:650;text-transform:capitalize}
.cal-dnum{font-size:30px;font-weight:800;font-stretch:110%;letter-spacing:-.04em;margin-left:auto;line-height:1;font-variant-numeric:tabular-nums}
.cal-cell.today .cal-dname{color:var(--on-brand)}
.cal-count{font-size:12px;font-weight:800;background:var(--ink);color:#fff;min-width:22px;height:22px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;padding:0 7px;font-variant-numeric:tabular-nums}
.cal-cell.today .cal-count{background:var(--on-brand);color:var(--brand)}
.cal-count.late{background:var(--late);color:#fff}
[data-theme="dark"] .cal-count{background:var(--text);color:var(--bg)}
[data-theme="dark"] .cal-count.late{background:var(--late);color:#2A0E0B}
.cal-items{padding:6px 10px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1}
.cal-item{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:var(--pill);cursor:pointer;font-size:13px;background:var(--surface-2);transition:background .15s var(--ease)}
.cal-item:hover{background:var(--border)}
.cal-cell.today .cal-item{background:rgba(255,255,255,.55);color:#292929}
.cal-cell.today .cal-item:hover{background:#fff}
.cal-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.cal-az{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cal-cell.today .cal-az{color:#292929}
.cal-more{font-size:12.5px;padding:2px 10px;font-weight:650;opacity:.8}
.cal-empty{font-size:14px;color:var(--faint);padding:4px 6px}
.cal-legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13.5px;color:var(--muted);font-weight:600}
.cal-leg{display:flex;align-items:center;gap:8px}

.empty{text-align:center;padding:72px 24px;border-radius:var(--r-xl);background:var(--surface);color:var(--muted)}
.empty .ico{width:44px;height:44px;margin:0 auto 18px;color:var(--brand)}
.empty h4{font-size:30px;font-weight:800;font-stretch:110%;letter-spacing:-.04em;color:var(--text);margin-bottom:10px;line-height:1.1}
.empty p{font-size:15.5px;max-width:460px;margin:0 auto 22px;line-height:1.55}

/* ===== modal ===== */
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadein .2s var(--ease)}
.modal{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);width:100%;max-width:580px;max-height:88vh;overflow:auto;animation:rise .28s var(--ease)}
.modal.wide{max-width:800px}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
.modal-h{display:flex;align-items:center;gap:10px;padding:24px 26px 14px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h3{font-size:24px;font-weight:800;font-stretch:108%;letter-spacing:-.035em;flex:1;line-height:1.15}
.modal-b{padding:8px 26px 24px;display:flex;flex-direction:column;gap:18px}
.modal-f{padding:16px 26px 22px;display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.x{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);background:var(--surface-2);cursor:pointer;flex:0 0 auto;transition:background .15s var(--ease)}
.x:hover{background:var(--border)}
.x svg{width:17px;height:17px}

.form-row{display:flex;flex-direction:column;gap:7px}
.form-row label{font-size:13.5px;font-weight:700;color:var(--text)}
.form-row .hint{font-size:12.5px;color:var(--faint);font-weight:400;line-height:1.45}
.form-row input,.form-row select,.form-row textarea{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:11px 15px;width:100%;transition:border-color .18s var(--ease),background .18s var(--ease)}
.form-row input:hover,.form-row select:hover,.form-row textarea:hover{border-color:var(--border)}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--focus);background:var(--surface)}
.form-row textarea{min-height:96px;resize:vertical;line-height:1.55}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.toggle{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.toggle .sw{width:44px;height:26px;border-radius:var(--pill);background:var(--border-strong);position:relative;transition:background .2s var(--ease);flex:0 0 auto}
.toggle .sw::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--ink)}
[data-theme="dark"] .toggle.on .sw{background:var(--brand)}
.toggle.on .sw::after{left:21px}

.cad-step{display:grid;grid-template-columns:1fr 120px 40px;gap:10px;align-items:center;margin-bottom:8px}
.cad-step input{background:var(--surface-2);border:1.5px solid transparent;border-radius:14px;padding:10px 14px}
.cad-step input:focus{outline:none;border-color:var(--focus)}

.map-row{display:grid;grid-template-columns:180px 1fr;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.map-row:last-child{border:none}
.map-row .lbl{font-size:13.5px;font-weight:650}
.map-row .lbl small{display:block;font-weight:400;color:var(--faint);font-size:12px}

.toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px}
.toast{background:#292929;color:#fff;border-radius:var(--pill);padding:13px 22px 13px 16px;box-shadow:var(--shadow-lg);font-size:14.5px;font-weight:600;
  display:flex;align-items:center;gap:11px;max-width:460px;animation:slidein .3s var(--ease);transition:opacity .2s,transform .2s}
.toast::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--brand);flex:0 0 auto}
.toast.ok::before{background:#5FD08A} .toast.err::before{background:#FF6A5C}

.filters{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;height:50px;background:var(--surface);border:1.5px solid transparent;border-radius:var(--pill);padding:0 20px;transition:border-color .18s var(--ease)}
.search:focus-within{border-color:var(--focus)}
.search input{background:none;border:none;flex:1;outline:none;min-width:0;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{height:40px;padding:0 16px;border-radius:var(--pill);font-size:14px;font-weight:650;color:var(--text);background:var(--surface);transition:background .15s var(--ease),color .15s var(--ease)}
.fbtn:hover{background:var(--border)}
.fbtn.on{background:var(--ink);color:#fff}
[data-theme="dark"] .fbtn.on{background:var(--text);color:var(--bg)}

.spinner{width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning svg{animation:spin .6s linear infinite}
.kbd{font-size:11.5px;font-weight:650;background:var(--surface-2);border-radius:6px;padding:2px 6px;color:var(--muted)}
.helptip{font-size:13.5px;color:var(--muted);line-height:1.55}
.content > .helptip:first-child{max-width:80ch;margin-bottom:6px!important}

@media(max-width:1180px){
  .nav button{padding:0 11px;font-size:14px}
  .spend-pill .spend-gen{display:none}
  .span-7,.span-5,.span-6{grid-column:span 12}
  .load-strip{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:900px){
  .topnav{margin:10px 10px 0;top:10px}
  .topnav-in{min-height:58px;padding:8px 8px 8px 10px;border-radius:29px;flex-wrap:wrap;position:relative}
  .sec-switch,.subnav-wrap,.nav-tools,.nav-spacer{display:none}
  .menu-btn{display:flex}
  .topnav.open .topnav-in{height:auto;border-radius:26px;padding:10px 10px 14px 12px}
  .topnav.open .sec-switch{display:flex;flex-basis:100%;order:3;margin-top:8px}
  .topnav.open .sec-switch > button{flex:1;justify-content:center;padding:0 8px;gap:6px;font-size:14px}
  .topnav.open .subnav-wrap{display:block}
  .topnav.open .nav{flex-direction:column;align-items:stretch;border-radius:26px;padding:8px;overflow:visible}
  .topnav.open .nav button{height:46px}
  .topnav.open .nav .nav-area{display:block;padding:8px 12px 4px}
  .topnav.open .nav-tools{display:flex;flex-basis:100%;order:4;margin-top:6px}
  .hero{margin-top:-68px;padding:96px 18px 34px}
  .hero .crumb{font-size:13px}
  .hero h2{font-size:40px;letter-spacing:-.04em}
  .hero .lede{font-size:16px}
  .content{padding:20px 14px 72px}
  .two-col{grid-template-columns:1fr}
  .tile{padding:20px;border-radius:26px}

.pj-kv{display:grid;grid-template-columns:76px 1fr;gap:10px 12px;font-size:14px;margin:0}
.pj-kv dt{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:2px}
.pj-kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pj-pp{display:flex;flex-wrap:wrap;gap:6px}
.pj-pp .pw-chip{height:30px;padding:0 12px;font-size:12.5px}
.pj-lab{font-size:13.5px;font-weight:700}
.pj-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pj-seg label{position:relative;cursor:pointer}
.pj-seg input{position:absolute;opacity:0;pointer-events:none}
.pj-seg span{display:flex;align-items:center;justify-content:center;height:40px;border-radius:var(--pill);background:var(--surface-2);font-weight:700;font-size:13px}
.pj-seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.pj-seg .da input:checked+span{background:var(--text);color:var(--bg)}
.pj-seg .seq input:checked+span{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.pj-seg .wait input:checked+span{background:var(--wait-soft);color:var(--wait);box-shadow:inset 0 0 0 2px var(--wait)}
.pj-seg .reply input:checked+span{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.pj-pc{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px 0 6px;border-radius:var(--pill);background:var(--surface-2);cursor:pointer;font-weight:650;font-size:13.5px;position:relative}
.pj-pc input{position:absolute;opacity:0;pointer-events:none}
.pj-pc:has(input:checked){background:var(--text);color:var(--bg)}
.pj-pc:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.pj-two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.pj-two .toggle{height:44px}
.pj-fadd{display:flex;gap:8px;flex-wrap:wrap}
.pj-fadd input{flex:1 1 220px;min-width:0}
.pj-link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pj-undo{margin-left:12px;background:rgba(255,255,255,.12);color:var(--brand);border-radius:var(--pill);padding:4px 11px;font-weight:700;font-size:13px}
.pj-cc{opacity:.6;font-variant-numeric:tabular-nums;margin-left:2px}
.pj-bar{margin-bottom:16px}
.pj-home .pj-hsplit li{border-top-color:var(--border)}
.pj-home .pj-hsplit{margin-bottom:12px}
.pj-hlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pj-hlist li{display:grid;grid-template-columns:10px minmax(0,1fr);column-gap:10px;align-items:baseline;font-size:14px;font-weight:600}
.pj-hlist small{grid-column:2;font-size:12.5px;color:var(--muted);font-weight:500}
.pj-hd{width:8px;height:8px;border-radius:50%;background:var(--brand);align-self:center}.pj-hd.u{background:var(--late)}
@media(max-width:1100px){.pj-prow{grid-template-columns:minmax(0,1fr) minmax(100px,1fr) 128px}.pj-prow .pj-avs,.pj-prow .pj-open{display:none}.bento.pj-detail .span-8,.bento.pj-detail .span-4{grid-column:span 12}}
@media(max-width:700px){
  .pj-brow,.pj-prow{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 10px}
  .pj-brow .pj-avs,.pj-prow .pj-prog{display:none}
  .pj-brow .flap{min-width:0}
  .pj-brows{padding:0 6px}
  .pj-row{grid-template-columns:auto minmax(0,1fr);gap:10px 12px}
  .pj-right{grid-column:2;justify-content:flex-start}
  .pj-right .pj-avs{display:none}
  .pj-quick{flex-wrap:wrap;border-radius:22px}
  .pj-quick input{flex:1 1 100%}
  .pj-quick select{flex:1;max-width:none;min-width:0}
  .pj-seg{grid-template-columns:1fr 1fr}
  .pj-two{grid-template-columns:1fr}
  .pj-tile{padding:14px 12px 14px}
}

/* =====================================================================
   RISTRUTTURAZIONE GRAFICA v3 — dal concept "dashboard"
   Schede bianche su fondo grigio caldo, una sola luce arancione,
   numeri grandi e leggeri, animazioni morbide. Solo aspetto: la logica
   e i nomi delle classi usati dal codice restano quelli di prima.
   ===================================================================== */

/* --- titoli: niente più caratteri larghi e pesanti --- */
.section-h{margin:36px 0 14px;gap:10px}
.section-h h3,.tile-h h3,.board-h .bt,.modal-h h3,.empty h4,.cal-title b,.qc-head .az,.hm-pt,.pj-grp button,.pj-gl,.gate-card h2,.gate-brand h1{font-stretch:100%;font-weight:650;letter-spacing:-.025em}
.section-h h3{font-size:19px}
.section-h .count,.pj-grp .count{background:var(--surface);box-shadow:var(--card-shadow);height:24px;min-width:24px;font-size:12px}
.tile-h{margin-bottom:16px;gap:10px}
.tile-h h3{font-size:16.5px;line-height:1.25}
.tile-h .sub{font-size:13px;font-weight:550;opacity:.65}
.board-h .bt{font-size:16.5px}
.modal-h h3{font-size:19px}
.empty h4{font-size:21px}
.cal-title b{font-size:22px}
.qc-head .az{font-size:19px}

/* --- schede --- */
.card,.table-wrap,.empty,.queue-card,.nl-send,.agenda-row,.pj-quick,.ag-n,.hm-post{box-shadow:var(--card-shadow)}
.card{border-radius:var(--r-xl)}
.tile{border-radius:var(--r-xl);padding:22px 24px;box-shadow:var(--card-shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.t-lilac,.t-peach,.t-cobalt,.t-white{background:var(--surface);color:var(--text)}
.t-orange{background:radial-gradient(130% 120% at 100% 0%,#FFC266 0%,#FFA41F 38%,#FF9900 70%);color:var(--on-brand);box-shadow:0 1px 2px rgba(168,84,0,.18),0 16px 34px -18px rgba(255,140,0,.65)}
.t-ink{background:var(--ink);color:#fff}
[data-theme="dark"] .t-ink{background:#232325;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.t-orange .btn:not(.primary){background:rgba(255,255,255,.85);border-color:transparent;color:#1F1F1F}
.t-ink .btn:not(.primary){background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.t-ink .btn:not(.primary):hover{background:rgba(255,255,255,.16)}

/* numeri: grandi ma leggeri, come nel concept */
.stat-t{border-radius:var(--r-xl);padding:20px 22px;min-height:148px;box-shadow:var(--card-shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.stat-t .k{font-size:13.5px;font-weight:600;opacity:.72}
.stat-t .v{font-size:40px;font-weight:650;font-stretch:100%;letter-spacing:-.035em;line-height:1}
.stat-t .m{font-size:12.5px;opacity:.68}
.ct-v{font-size:32px!important;letter-spacing:-.035em}
.hm-big{font-size:46px;font-weight:650;font-stretch:100%;letter-spacing:-.04em;line-height:1;margin:2px 0 10px}
.hm-big.sm{font-size:32px;letter-spacing:-.035em}
.hm-sub{font-size:13.5px;font-weight:550;opacity:.7}
.hm-foot{font-size:13px;font-weight:600;opacity:.9}
.load-n{font-size:28px;font-weight:650;font-stretch:100%;letter-spacing:-.03em}
.cal-dnum{font-size:24px;font-weight:650;font-stretch:100%;letter-spacing:-.03em}
.plan-sel-info b{font-size:26px;font-weight:650}
.spend-big,.hm-pt{font-stretch:100%}
.ag-dd{font-weight:650;font-size:20px}

/* schede cliccabili: si alzano un poco */
.hm-card,.rq-stat{cursor:pointer}
.hm-card:hover,.rq-stat:hover{transform:translateY(-3px);box-shadow:var(--card-shadow-hover);filter:none}
.t-orange.hm-card:hover,.t-orange.rq-stat:hover{box-shadow:0 2px 4px rgba(168,84,0,.2),0 22px 40px -18px rgba(255,140,0,.75)}
.hm-card.hm-alert{box-shadow:inset 0 0 0 2px var(--brand),var(--card-shadow)}
.hm-card:focus-visible{outline:2px solid var(--focus)}

/* elementi che stavano su fondi colorati: ora su bianco */
.arr-item,[data-theme="dark"] .arr-item{background:var(--surface-2);color:var(--text)}
.arr-item:hover,[data-theme="dark"] .arr-item:hover{background:var(--surface-3)}
.hm-call{background:var(--surface-2)}
.hm-call:hover{background:var(--surface-3)}
.hm-cset{background:var(--surface-2)}
.hm-cset:hover{background:var(--surface-3)}
.hm-split li{border-top-color:color-mix(in srgb,currentColor 12%,transparent)}
.pj-flist a,[data-theme="dark"] .pj-flist a{background:var(--surface-2)}
.pj-flist a:hover{background:var(--surface-3)}
.t-orange .pj-flist a,.t-orange .hm-call,.t-orange .hm-cset{background:rgba(255,255,255,.55)}
.t-ink .pj-flist a,.t-ink .hm-call,.t-ink .hm-cset{background:rgba(255,255,255,.08)}

/* grafico 7 giorni: pillole grigie, oggi arancione */
.wk{height:180px;gap:12px}
.wk-n{font-size:14px;font-weight:650}
.wk-b{background:var(--surface-3);border-radius:14px;max-width:44px;transform-origin:bottom}
.wk-b.zero{background:var(--surface-2)}
.wk-c.today .wk-b{background:linear-gradient(to top,var(--ink) 0 26%,var(--brand) 26%)}
[data-theme="dark"] .wk-c.today .wk-b{background:linear-gradient(to top,#F2F2EF 0 26%,var(--brand) 26%)}
.wk-d{opacity:1;color:var(--muted)}
.wk-d b{color:var(--text)}
.wk-c.today .wk-d,.wk-c.today .wk-d b{color:var(--accent)}

/* tabellone partenze: resta scuro, più sobrio */
.board{border-radius:var(--r-xl);box-shadow:0 1px 2px rgba(0,0,0,.08)}
[data-theme="dark"] .board{background:#1D1D1F;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.board td{height:50px}
.board .b-dest{font-weight:650;font-size:15px}
.board-h .clock{background:rgba(255,255,255,.08)}

/* tabelle */
.table-wrap{border-radius:var(--r-xl);padding:4px 10px}
th{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:14px 14px 10px}
td{padding:12px 14px}
tbody tr:hover{background:var(--surface-2)}
.az{font-weight:600}

/* chip di stato: più compatte */
.chip{height:26px;font-size:12px;padding:0 10px 0 9px;gap:6px}
.chip.today{background:var(--brand-soft);color:var(--accent)}
.chip.today .d{background:var(--brand)}
.step-pill{height:24px;font-size:12px;box-shadow:inset 0 0 0 1px var(--border-strong)}

/* pulsanti */
.btn{height:40px;padding:0 16px;font-size:14px;font-weight:600;border:1px solid var(--border);box-shadow:var(--card-shadow);
  transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease)}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--brand);border-color:transparent;color:var(--on-brand);font-weight:650;box-shadow:0 1px 2px rgba(168,84,0,.2),0 6px 14px -8px rgba(255,140,0,.7)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.dark{background:var(--ink);color:#fff;border-color:transparent}
[data-theme="dark"] .btn.dark{background:var(--text);color:var(--bg)}
.btn.ghost,.btn.danger{box-shadow:none;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:transparent}
.btn.sm{height:34px;padding:0 13px;font-size:13px}
.btn.del{box-shadow:none}
.page-head .btn{height:40px}
.board-h .btn,.board-foot .btn{box-shadow:none}
.board-foot .btn{background:#fff;color:#1F1F1F}

/* filtri e ricerca */
.filters{gap:8px}
.search{height:44px;border:1px solid var(--border);box-shadow:var(--card-shadow);padding:0 16px}
.search:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.search input{font-size:14.5px}
.fbtn,.pw-chip{height:34px;padding:0 14px;font-size:13px;font-weight:600;background:var(--surface);color:var(--muted);box-shadow:var(--card-shadow);transition:background .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.fbtn:hover,.pw-chip:hover{background:var(--surface-2);color:var(--text)}
.fbtn:active,.pw-chip:active{transform:scale(.96)}
.fbtn.on,.pw-chip.on{background:var(--ink);color:#fff;box-shadow:none}
[data-theme="dark"] .fbtn.on,[data-theme="dark"] .pw-chip.on{background:var(--text);color:var(--bg)}
.pw-search input{background:var(--surface);box-shadow:var(--card-shadow)}
.ld-which select,.ct-sel{height:44px;background:var(--surface);box-shadow:var(--card-shadow);border:1px solid var(--border)}

/* campi */
.form-row label{font-size:13px;font-weight:650}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus,input.subj:focus,textarea.body:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}

/* finestre */
.overlay{background:rgba(14,14,15,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{border-radius:var(--r-xl)}
.modal-h{padding:22px 24px 12px}
.modal-b{padding:8px 24px 22px}
.modal-f{padding:14px 24px 20px;border-top:1px solid var(--border)}
.x{width:36px;height:36px}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}

/* vuoti, avvisi */
.empty{border-radius:var(--r-xl);padding:60px 24px}
.empty .ico{width:40px;height:40px}
.alert{border-radius:var(--r-lg)}

/* coda invio */
.queue-card{border-radius:var(--r-xl)}
.qc-head{border-radius:18px}

/* calendari: oggi in arancione tenue, non pieno */
.cal-cell{border-radius:var(--r-lg);box-shadow:var(--card-shadow)}
.cal-cell.today{background:var(--brand-soft);color:var(--text);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent)}
.cal-cell.today .cal-dname{color:var(--accent)}
.cal-cell.today .cal-item{background:var(--surface);color:var(--text)}
.cal-cell.today .cal-az{color:var(--text)}
.cal-cell.today .cal-count{background:var(--brand);color:var(--on-brand)}
.load-cell{border-radius:var(--r-lg);box-shadow:var(--card-shadow)}
.load-cell.today{background:var(--brand-soft);color:var(--text);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent)}
.load-cell.today .load-d,.load-cell.today .load-d b{color:var(--accent)}
.load-cell.today .load-bar-wrap{background:var(--surface)}
.load-cell.today .load-bar{background:var(--brand)}
.ag-day{border-radius:var(--r-md)}
.ag-day.today{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--brand) 55%,transparent)}
.ag-ev{border-radius:12px;box-shadow:var(--card-shadow)}
.ct-m.now{background:var(--brand-soft)}

/* lo stato del database si vede solo quando c'è qualcosa che non va */
.conn-pill:has(#sdot.on){display:none}
/* voci del menu sopra la pillola che scorre */
.sec-switch > button,.nav button{position:relative;z-index:1}
/* utente e online in alto (l'avatar resta sempre visibile, anche quando il nome si nasconde) */
.ag-me .ag-av{display:inline-flex!important}
.user-box{margin:0 0 0 6px}
.ag-me{height:40px;background:var(--surface);box-shadow:var(--card-shadow);padding:0 14px 0 5px;font-weight:650}
.ag-me:hover{filter:none;background:var(--surface-2)}
.on-chip{height:40px;background:var(--surface);box-shadow:var(--card-shadow)}
.ag-bellb{box-shadow:0 0 0 2px var(--bg)}

/* toast */
.toast{background:#18181A;border-radius:14px}
[data-theme="dark"] .toast{background:#2C2C2E}

/* accesso */
.gate-card{border-radius:var(--r-xl);border:0;box-shadow:var(--shadow)}

/* ---------------------------------------------------------------------
   animazioni
   --------------------------------------------------------------------- */
@keyframes v3In{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes v3Fade{from{opacity:0}to{opacity:1}}
@keyframes v3Grow{from{transform:scaleY(.04)}to{transform:none}}
.rv{animation:v3In .6s var(--ease) both;animation-delay:calc(min(var(--i,0),10) * 50ms)}
.page-head.enter .ph-title{animation:v3In .5s var(--ease) both}
.page-head.enter .ph-actions{animation:v3Fade .5s var(--ease) .08s both}
.page-head.enter .ph-bar{animation:v3Fade .5s var(--ease) .12s both}
.wk.grow .wk-b{animation:v3Grow .8s var(--ease) both}
.wk.grow .wk-c:nth-child(2) .wk-b{animation-delay:.04s}.wk.grow .wk-c:nth-child(3) .wk-b{animation-delay:.08s}
.wk.grow .wk-c:nth-child(4) .wk-b{animation-delay:.12s}.wk.grow .wk-c:nth-child(5) .wk-b{animation-delay:.16s}
.wk.grow .wk-c:nth-child(6) .wk-b{animation-delay:.2s}.wk.grow .wk-c:nth-child(7) .wk-b{animation-delay:.24s}
.ct-bars.grow .ct-b,.load-bar.grow{animation:v3Grow .8s var(--ease) both;transform-origin:bottom}
/* cambio tema: cerchio che si allarga dal pulsante */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* ---------------------------------------------------------------------
   misure intermedie e telefono
   --------------------------------------------------------------------- */
@media(max-width:1499px){.ag-me span{display:none}.ag-me{padding:0 5px}.on-lbl{display:none}}
@media(max-width:1299px) and (min-width:901px){
  .sec-switch > button .ico{display:block}
  .sec-switch > button[aria-pressed="false"]>span:not(.dotb){display:none}
  .sec-switch > button[aria-pressed="false"]{padding:0 11px}
  .on-lbl{display:none}
}
@media(max-width:1180px){
  .topnav-in,.page-head,.content{padding-left:24px;padding-right:24px}
  .ag-me span{display:none}.ag-me{padding:0 5px}
}
@media(max-width:900px){
  .topnav{margin:0;top:0}
  .topnav-in{height:auto;min-height:60px;padding:8px 14px;border-radius:0;flex-wrap:wrap;box-shadow:none;background:transparent}
  .sec-wrap,.nav-tools,.nav-spacer{display:none}
  .menu-btn{display:flex}
  .topnav.open{background:var(--bg);box-shadow:var(--shadow-lg)}
  .topnav.open .topnav-in{padding:8px 14px 16px}
  .topnav.open .sec-wrap{display:flex;order:3;flex-basis:100%;margin:8px 0 0;border-radius:20px;padding:6px}
  .topnav.open .sec-switch{flex-direction:column;width:100%;gap:2px}
  .topnav.open .sec-switch > button{justify-content:flex-start;height:46px;padding:0 14px;font-size:15px;border-radius:14px;flex:none}
  .topnav.open .sec-switch > button .ico{display:block}
  .topnav.open .sec-switch > button>span:not(.dotb){display:inline}
  .topnav.open .sec-switch > button[aria-pressed="true"]{background:var(--ink)}
  [data-theme="dark"] .topnav.open .sec-switch > button[aria-pressed="true"]{background:var(--text)}
  .topnav.open .sec-wrap .pill-ind{display:none}
  .topnav.open .nav-tools{display:flex;flex-basis:100%;order:4;margin-top:10px;justify-content:space-between}
  .page-head .subnav-wrap{display:flex}
  .page-head{padding:10px 14px 0}
  .page-head h2{font-size:24px}
  .page-head .lede{font-size:14px}
  .ph-top{flex-direction:column;align-items:stretch;gap:14px}
  .ph-title{flex:none}
  .ph-actions,#topActions{justify-content:flex-start}
  .ph-bar{margin-top:14px;gap:8px}
  .ph-bar .subnav-wrap{flex:1 1 100%}
  .ph-spacer,.date-pill,.spend-pill .spend-gen,.test-banner .tb-x{display:none}
  .content{padding:16px 14px 72px}
  .tile{padding:18px;border-radius:20px}
  .stat-t .v{font-size:34px}
  .hm-big{font-size:40px}
}
@media(max-width:560px){
  .page-head .btn .lbl{display:none}
  .conn-pill{max-width:180px}
}
@media (prefers-reduced-motion:reduce){
  .rv,.page-head.enter .ph-title,.page-head.enter .ph-actions,.page-head.enter .ph-bar,.wk.grow .wk-b{animation:none!important}
  .pill-ind{transition:none}
}

/* ---- impostazioni ---- */
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px;align-items:start}
.st-card{display:flex;flex-direction:column;gap:0;scroll-margin-top:96px}
.st-card-h{margin-bottom:16px}
.st-card-h h3{font-size:16.5px;font-weight:650;letter-spacing:-.02em}
.st-card-h p{font-size:13.5px;color:var(--muted);margin-top:2px}
.st-card-b{display:flex;flex-direction:column;gap:16px}
.st-card-b .toggle{align-items:flex-start}
.st-card-b .toggle .sw{margin-top:1px}
.st-card-b .toggle .hint{font-size:12.5px;color:var(--faint);font-weight:400;line-height:1.45}
.st-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-row .spacer{flex:1}
.st-sep{padding-top:14px;border-top:1px solid var(--border)}

/* ---------- date utils ---------- */
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){if(!s)return null;const p=String(s).slice(0,10).split('-');if(p.length===3&&p[0].length===4){const d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);return d}const d=new Date(s);d.setHours(0,0,0,0);return d}
function fmtD(d){if(!d)return '—';return d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'})}
function fmtDLong(d){if(!d)return '—';return d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})}
function isoD(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function nextWorkday(d){if(!state.config.saltaWeekend)return d;let x=new Date(d);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return x}
function sameDay(a,b){return a&&b&&a.getTime()===b.getTime()}

/* ---------- cadence engine ---------- */
// returns {dueDate, stepIndex, label} for the NEXT action, or null if no more action
function nextAction(c){
  if(c.haRisposto) return null;
  const step = c.step||0;
  if(step>=state.cadence.length) return null;
  const cad = state.cadence[step];
  let due;
  if(step===0){
    // prima email: parte solo se PIANIFICATA
    if(!c.scheduledDate) return null;            // backlog: da pianificare, non in coda
    due = nextWorkday(parseD(c.scheduledDate));
  } else {
    if(!c.anchorDate){ due = nextWorkday(today()); }
    else due = nextWorkday(addDays(parseD(c.anchorDate), cad.offset));
  }
  return {dueDate:due, stepIndex:step, label:cad.nome, cad};
}
function isUnplanned(c){return !c.haRisposto && (c.step||0)===0 && !c.scheduledDate}
function statusOf(c){
  if(c.haRisposto) return {key:'reply',label:'Ha risposto'};
  if((c.step||0)>=state.cadence.length) return {key:'done',label:'Sequenza conclusa'};
  if(c.fermato) return {key:'stop',label:'Fermato'};
  if(isUnplanned(c)) return {key:'plan',label:'Da pianificare'};
  const na = nextAction(c);
  if(!na) return {key:'done',label:'Concluso'};
  const t=today();
  if((c.step||0)===0){
    if(na.dueDate<t) return {key:'late',label:'In ritardo'};
    if(sameDay(na.dueDate,t)) return {key:'today',label:'Da inviare oggi'};
    return {key:'wait',label:'Pianificato '+fmtD(na.dueDate)};
  }
  // already in sequence (sent at least email1)
  if(na.dueDate<t) return {key:'late',label:'In ritardo'};
  if(sameDay(na.dueDate,t)) return {key:'today',label:'In coda oggi'};
  return {key:'wait',label:'In attesa'};
}
function isDue(c){ // due today or overdue, action pending
  if(c.haRisposto) return false;
  const na=nextAction(c); if(!na) return false;
  return na.dueDate<=today();
}
function dueToday(c){ // azione prevista esattamente oggi (incluse le prime email pronte)
  if(c.haRisposto) return false;
  const na=nextAction(c); if(!na) return false;
  return sameDay(na.dueDate,today());
}
function isLate(c){
  if(c.haRisposto) return false;
  const na=nextAction(c); if(!na) return false;
  return na.dueDate<today();
}

async function gfetch(url,opts={}){
  if(!googleReady()){ // prova un refresh silenzioso al volo
    await new Promise(res=>{
      const prev=tokenClient&&tokenClient.callback;
      if(!tokenClient){res();return}
      let done=false;
      tokenClient.callback=(resp)=>{
        if(resp&&resp.access_token){state.google.token=resp.access_token;state.google.expires=Date.now()+((resp.expires_in||3600)*1000);saveGAuth();scheduleRefresh();}
        tokenClient.callback=prev;done=true;res();
      };
      try{tokenClient.requestAccessToken({prompt:''});}catch(e){res();}
      setTimeout(()=>{if(!done){tokenClient.callback=prev;res();}},3000);
    });
  }
  if(!googleReady()) throw new Error('Sessione Google scaduta, premi Riconnetti');
  const r=await fetch(url,{...opts,headers:{'Authorization':'Bearer '+state.google.token,'Content-Type':'application/json',...(opts.headers||{})}});
  if(r.status===401){state.google.token=null;state.google.expires=0;saveGAuth();renderConn();throw new Error('Sessione Google scaduta, riconnetti')}
  if(!r.ok){const t=await r.text();throw new Error('Google '+r.status+': '+t.slice(0,160))}
  return r.json();
}

/* ---- MIME build ---- */
function utf8b64(s){return btoa(unescape(encodeURIComponent(s)))}
function b64url(s){return s.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function encSubject(s){return /[^\x00-\x7F]/.test(s)?'=?UTF-8?B?'+utf8b64(s)+'?=':s}
function buildRaw({to,from,subject,body,inReplyTo,references}){
  const headers=[
    'From: '+from,
    'To: '+to,
    'Subject: '+encSubject(subject),
    'MIME-Version: 1.0',
    'Content-Type: text/plain; charset="UTF-8"',
  ];
  if(inReplyTo){headers.push('In-Reply-To: '+inReplyTo);headers.push('References: '+(references||inReplyTo));}
  const msg=headers.join('\r\n')+'\r\n\r\n'+body;
  return b64url(utf8b64(msg));
}
// multipart/alternative: testo semplice + HTML (firma e formattazione)
function buildRawHtml({to,from,subject,text,html,inReplyTo,references}){
  const b='flo'+Math.random().toString(36).slice(2,12);
  const headers=[
    'From: '+from,
    'To: '+to,
    'Subject: '+encSubject(subject),
    'MIME-Version: 1.0',
    'Content-Type: multipart/alternative; boundary="'+b+'"',
  ];
  if(inReplyTo){headers.push('In-Reply-To: '+inReplyTo);headers.push('References: '+(references||inReplyTo));}
  const b64=x=>utf8b64(x).match(/.{1,76}/g).join('\r\n');
  const parts=[
    '--'+b,
    'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',
    b64(text),
    '--'+b,
    'Content-Type: text/html; charset="UTF-8"','Content-Transfer-Encoding: base64','',
    b64(html),
    '--'+b+'--',''
  ].join('\r\n');
  const msg=headers.join('\r\n')+'\r\n\r\n'+parts;
  return b64url(utf8b64(msg));
}
function textToHtml(t){return esc(t).replace(/\r?\n/g,'<br>');}
// testo → HTML come lo scrive Gmail: un <div> per riga, <div><br></div> per le righe vuote, nessun font imposto
function textToGmailHtml(t,link){
  const URL_RE=/(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)])/g;
  const line=l=>link?l.split(URL_RE).map((x,i)=>i%2?`<a href="${escAttr(link(x))}">${esc(x)}</a>`:esc(x)).join(''):esc(l);
  return String(t||'').replace(/\r\n?/g,'\n').replace(/\s+$/,'').split('\n').map(l=>l.trim()?`<div>${line(l)}</div>`:'<div><br></div>').join('');
}
// statistiche anonime outbound (funzione ob-track): codice casuale per email, mai salvato con il contatto
const OB_TRACK=APP_DEFAULTS.supabaseUrl+'/functions/v1/ob-track';
function obNonce(){const a=new Uint8Array(10);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
function obQ(trk){return 's='+trk.step+'&n='+trk.n+'&t='+trk.t}
function obLink(trk,url){return trk&&state.config.obTrackClick?OB_TRACK+'/c?'+obQ(trk)+'&u='+encodeURIComponent(url):url}
function obTrackHrefs(html,trk){
  if(!trk||!state.config.obTrackClick)return html;
  return html.replace(/href="(https?:\/\/[^"]+)"/gi,(m,u)=>'href="'+escAttr(obLink(trk,u.replace(/&amp;/g,'&')))+'"');
}
// segno invisibile e diverso per ogni email: senza, Gmail nasconde firma e disiscrizione nei follow-up ("•••") perché identiche alla prima email
function hiddenMark(){const a=new Uint8Array(6);crypto.getRandomValues(a);return `<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:transparent;opacity:0">${[...a].map(x=>x.toString(36)).join('')}</div>`}
// composizione unica, usata sia per l'invio sia per l'anteprima
function composeEmail(c,body,trk){
  const unsub=(c.disiscrizione||state.templates.disiscrizione||'').trim();
  const sigText=(state.templates.firmaTesto||'').trim();
  const lk=trk&&state.config.obTrackClick?(u=>obLink(trk,u)):null;
  const sigHtml=obTrackHrefs(buildSigHtml().trim(),trk)||textToGmailHtml(sigText,lk);
  const text=String(body||'').trim()+(sigText?('\n\n'+sigText):'')+(unsub?('\n\n'+unsub):'');
  const pixel=trk&&state.config.obTrackOpen?`<img src="${escAttr(OB_TRACK+'/o?'+obQ(trk))}" width="1" height="1" alt="" style="display:block;width:1px;height:1px;border:0">`:'';
  const html='<div dir="ltr">'
    +textToGmailHtml(body,lk)+hiddenMark()
    +(sigHtml?('<div><br></div>'+sigHtml+hiddenMark()):'')
    +(unsub?(`<div><br></div><div style="color:#888888;font-size:12px">${esc(unsub)}</div>`):'')
    +hiddenMark()+pixel+'</div>';
  return {text,html};
}
function buildSigHtml(){
  const url=(state.templates.logoUrl||'').trim();
  const logo = url?`<img src="${escAttr(url)}" alt="logo" width="60" style="display:block;border:0">`:'';
  let h=state.templates.firmaHtml||'';
  // senza logo tolgo la sua cella: altrimenti resta una riga grigia verticale vuota prima della firma
  if(!url) h=h.replace(/<td[^>]*>\s*{logo_block}\s*<\/td>\s*/g,'').replace(/padding-left:14px;/g,'');
  return h.replace(/{logo_block}/g,logo).replace(/{logo_url}/g,url);
}

async function sendEmailGmail(c, step, subject, body){
  const track=!state.config.testMode&&state.config.formatoHtml&&(state.config.obTrackOpen||state.config.obTrackClick);
  const trk=track?{step,n:obNonce(),t:Math.floor(Date.now()/1000)}:null;
  const mail=composeEmail(c,body,trk);
  if(state.config.testMode){
    await new Promise(r=>setTimeout(r,500));
    return {threadId:c.threadId||('sim_'+c.id), messageId:c.messageId||('<sim-'+c.id+'-'+step+'@flowline>'), simulated:true};
  }
  const inReplyTo = step>0?c.messageId:null;
  let raw;
  if(state.config.formatoHtml){
    raw=buildRawHtml({to:c.email, from:fromHeader(), subject, text:mail.text, html:mail.html, inReplyTo, references:inReplyTo});
  } else {
    raw=buildRaw({to:c.email, from:fromHeader(), subject, body:mail.text, inReplyTo, references:inReplyTo});
  }
  const payload={raw};
  if(step>0 && c.threadId) payload.threadId=c.threadId;
  const sent=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',body:JSON.stringify(payload)});
  // statistiche anonime: si registra solo step e codice casuale, nessun dato del contatto
  if(trk&&supaReady()) supa.rpc('outbound_track_sent',{p_step:step,p_nonce:trk.n}).then(({error})=>{if(error)console.warn('outbound_track_sent',error.message)});
  // fetch message to read Message-ID header + threadId
  let messageId=c.messageId, threadId=sent.threadId;
  try{
    const full=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+sent.id+'?format=metadata&metadataHeaders=Message-ID');
    const h=(full.payload?.headers||[]).find(x=>x.name.toLowerCase()==='message-id');
    if(h && step===0) messageId=h.value;
  }catch(e){}
  return {threadId, messageId, simulated:false};
}

/* ---- reply detection ---- */
// mittenti automatici da non considerare risposte (errori di consegna, sistemi)
const AUTO_SENDER=/mailer-daemon|postmaster|no-?reply|noreply|bounce/i;
function _hdr(m,name){const h=(m.payload?.headers||[]).find(x=>x.name.toLowerCase()===name.toLowerCase());return h?h.value:'';}
function _isAutoReply(m){
  const subj=_hdr(m,'Subject'), auto=_hdr(m,'Auto-Submitted');
  return (auto && auto.toLowerCase()!=='no') || /^(fuori sede|risposta automatica|automatic reply|auto(matic)?[- ]?reply|out of (the )?office|abwesenheit|absence)/i.test(subj.trim());
}
function _replyInfo(m,via){
  return {date:new Date(+m.internalDate||Date.now()).toISOString(), from:_hdr(m,'From'), subject:_hdr(m,'Subject'),
          snippet:(m.snippet||'').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&amp;/g,'&').slice(0,280),
          threadId:m.threadId||'', msgId:m.id||'', via, auto:_isAutoReply(m)};
}
// cerca una risposta: 1) nel thread dell'invio  2) in tutta la casella, per mittente (copre risposte inoltrate da Hostinger e finite fuori thread o nello spam)
async function findReply(c){
  const META='format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Auto-Submitted';
  if(c.threadId && !String(c.threadId).startsWith('sim_')){
    try{
      const th=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/threads/'+c.threadId+'?'+META);
      const m=(th.messages||[]).find(m=>{const l=m.labelIds||[];return !l.includes('SENT')&&!l.includes('DRAFT')&&!AUTO_SENDER.test(_hdr(m,'From'));});
      if(m) return _replyInfo(m,'thread');
    }catch(e){console.warn('thread check',c.azienda,e.message)}
  }
  const em=(c.email||'').trim();
  if(!em) return null;
  const first=(c.history||[]).find(h=>!h.skipped&&h.date);
  const since=first?first.date.replace(/-/g,'/'):null;
  const q='from:'+em+(since?' after:'+since:'');
  const lst=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?includeSpamTrash=true&maxResults=5&q='+encodeURIComponent(q));
  for(const it of (lst.messages||[])){
    const m=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+it.id+'?'+META);
    const l=m.labelIds||[];
    if(l.includes('SENT')||l.includes('DRAFT')||l.includes('TRASH'))continue;
    return _replyInfo(m, l.includes('SPAM')?'spam':'casella');
  }
  return null;
}
/* ---- Riallinea Outbound con Gmail ----
   Per ogni contatto con una conversazione Gmail conta le email partite davvero (etichetta SENT)
   e le confronta con lo storico della Suite. Se in Gmail ce ne sono di più, propone di
   avanzare lo step e la data dell'ultimo invio. Non tocca niente senza conferma. */
let _realign=null;
async function obRealignScan(){
  if(!googleReady()){toast('Connetti Google: serve leggere le conversazioni in Gmail','warn');connectGoogle();return}
  if(state.config.testMode){toast('Spegni la modalità test: con gli invii simulati non ci sono conversazioni vere da leggere','warn');return}
  const list=state.contacts.filter(c=>c.threadId&&!String(c.threadId).startsWith('sim_')&&!c.haRisposto);
  if(!list.length){toast('Nessun contatto con una conversazione Gmail','warn');return}
  modal(`<div class="modal" onclick="event.stopPropagation()" style="max-width:560px">
    <div class="modal-h"><h3>Riallineo con Gmail</h3></div>
    <div class="modal-b"><p class="helptip" id="ra-prog">Leggo 0 di ${list.length} conversazioni…</p>
    <div class="load-bar-wrap" style="height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden"><div id="ra-bar" style="height:100%;width:0;background:var(--brand);transition:width .2s"></div></div></div></div>`);
  const fixes=[]; let i=0, done=0, errs=0;
  const worker=async()=>{
    while(i<list.length){
      const c=list[i++];
      try{
        const th=await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/threads/'+c.threadId+'?format=metadata&metadataHeaders=Subject');
        const sent=(th.messages||[]).filter(m=>(m.labelIds||[]).includes('SENT')).sort((a,b)=>(+a.internalDate)-(+b.internalDate));
        const hs=(c.history||[]).filter(h=>!h.skipped);
        const room=state.cadence.length-(c.step||0);
        const extra=sent.slice(hs.length).slice(0,Math.max(0,room));
        if(extra.length) fixes.push({id:c.id, extra:extra.map(m=>({date:isoD(new Date(+m.internalDate)), subject:_hdr(m,'Subject')}))});
      }catch(e){errs++;console.warn('riallinea',c.azienda,e.message)}
      done++;
      const p=document.getElementById('ra-prog'),b=document.getElementById('ra-bar');
      if(p)p.textContent=`Leggo ${done} di ${list.length} conversazioni…`; if(b)b.style.width=Math.round(done/list.length*100)+'%';
    }
  };
  await Promise.all([worker(),worker(),worker(),worker()]);
  _realign=fixes;
  if(!fixes.length){closeModal();toast(`Tutto allineato: Gmail e Suite coincidono${errs?` (${errs} conversazioni non lette)`:''}`,'ok');return}
  const rows=fixes.map((f,k)=>{const c=state.contacts.find(x=>x.id===f.id);const st=c.step||0;const last=f.extra[f.extra.length-1];
    return `<label class="ra-row"><input type="checkbox" checked data-k="${k}"><span class="ra-az"><b>${esc(c.azienda||c.email)}</b><small>${esc(c.email||'')}</small></span>
      <span class="ra-ch">step ${st+1} → ${st+1+f.extra.length}<small>ultimo invio ${esc(fmtD(parseD(last.date)))}</small></span></label>`}).join('');
  modal(`<div class="modal" onclick="event.stopPropagation()" style="max-width:640px">
    <div class="modal-h"><h3>${fixes.length} contatti da riallineare</h3><div class="x" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
    <div class="modal-b"><p class="helptip">In Gmail queste conversazioni hanno più email inviate di quelle che risultano nella Suite. Confermando, ogni contatto avanza allo step giusto e prende la data dell'ultimo invio vera, così non risulta più in ritardo e il prossimo follow-up parte alla data corretta. Togli la spunta se un messaggio l'hai scritto a mano da Gmail e non era un follow-up.${errs?` <b>${errs}</b> conversazioni non si sono potute leggere.`:''}</p>
    <div class="ra-list">${rows}</div></div>
    <div class="modal-f"><button class="btn ghost" onclick="closeModal()">Annulla</button><span class="spacer"></span><button class="btn primary" onclick="obRealignApply()">Riallinea</button></div></div>`);
}
function obRealignApply(){
  if(!_realign)return;
  const on=new Set([...document.querySelectorAll('.ra-list input:checked')].map(x=>+x.dataset.k));
  let n=0;
  _realign.forEach((f,k)=>{
    if(!on.has(k))return;
    const c=state.contacts.find(x=>x.id===f.id);if(!c)return;
    c.history=c.history||[];
    f.extra.forEach(m=>{
      const step=c.step||0; if(step>=state.cadence.length)return;
      c.history.push({step,oggetto:m.subject||'(da Gmail)',corpo:'',date:m.date,ricostruito:true});
      if(c.drafts)delete c.drafts[step];
      if(!c.anchorDate)c.anchorDate=m.date;
      c.dataUltimoInvio=m.date; c.step=step+1;
    });
    n++;
  });
  _realign=null;persist();closeModal();render();
  toast(n+' contatti riallineati con Gmail','ok');
}
async function checkReplies(opts={}){
  const silent=opts.silent;
  if(!googleReady()){if(!silent)toast('Connetti Google per controllare le risposte','warn');return 0}
  if(state.config.testMode){if(!silent)toast('Disattiva la modalità test per leggere le risposte reali','warn');return 0}
  const active=state.contacts.filter(c=>!c.haRisposto && (c.step||0)>0 && (c.history||[]).some(h=>!h.skipped));
  if(!active.length){if(!silent)toast('Nessuna email inviata da controllare','warn');return 0}
  let found=0, auto=0, spam=0, errs=0;
  for(const c of active){
    try{
      const r=await findReply(c);
      if(!r)continue;
      c.reply=r;
      if(r.auto){auto++;continue;}          // risposta automatica: la mostro ma non fermo la sequenza
      c.haRisposto=true; c.replySeen=false; found++;
      if(r.via==='spam')spam++;
    }catch(e){errs++;console.warn('reply check',c.azienda,e.message)}
  }
  if(found||auto){persist();render();}
  const extra=(spam?` (${spam} nello spam di Gmail)`:'')+(auto?` · ${auto} risposte automatiche ignorate`:'');
  if(!silent) toast(found?`${found} nuove risposte${extra} — follow-up fermati`:(errs?`Controllo non riuscito per ${errs} contatti`:'Nessuna nuova risposta'+(auto?extra:'')),found?'ok':(errs?'warn':'ok'));
  else if(found) toast(`${found} nuove risposte${extra}`,'ok');
  return found;
}
let _replyTimer=null;

  _replyTimer=setInterval(()=>{ if(googleReady() && !state.config.testMode) checkReplies({silent:true}); }, 180000); // ogni 3 min
}

  const silent=opts.silent;
  if(!googleReady()){if(!silent)toast('Connetti Google per sincronizzare','warn');return 0}
  if(!state.config.sheetId){if(!silent)toast('Nessun foglio collegato. Premi "Sheet" una volta per crearlo.','warn');return 0}
  let rows;
  try{
    const tab=await sheetTab(state.config.sheetId);
    const r=await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${state.config.sheetId}/values/${encodeURIComponent(tab)}!A1:Z10000`);
    rows=r.values||[];
  }catch(e){if(!silent)toast('Lettura foglio fallita: '+e.message,'err');return 0}
  if(rows.length<2) return 0;
  const map=guessMap(rows[0]);
  if(map.email==null){if(!silent)toast('Nel foglio non trovo una colonna email','warn');return 0}
  const byEmail=new Map(state.contacts.map(c=>[(c.email||'').toLowerCase(),c]));
  let added=0, updated=0;
  for(let i=1;i<rows.length;i++){
    const row=rows[i];const g=f=>map[f]!=null?String(row[map[f]]??'').trim():'';
    const email=g('email');
    if(!email||!email.includes('@')) continue;
    const key=email.toLowerCase();
    if(_deletedEmails.has(key)) continue;       // eliminato da noi: il foglio non lo rimette in lista
    const existing=byEmail.get(key);
    if(existing){
      // aggiorna i campi di ricerca dal foglio (senza toccare lo stato)
      let ch=false;
      const desc=g('descrizione'), web=g('sitoWeb');
      if(desc && desc!==existing.descrizione){existing.descrizione=desc;ch=true;}
      if(web && web!==existing.sitoWeb){existing.sitoWeb=web;ch=true;}
      // riempi i campi vuoti se il foglio ne ha
      ['azienda','sede','ruolo','settore','tipoAsset'].forEach(f=>{const v=g(f);if(v&&!existing[f]){existing[f]=v;ch=true;}});
      if(ch)updated++;
      continue;
    }
    byEmail.set(key,true);
    const c=mkContact({
      azienda:g('azienda'),sede:g('sede'),email,ruolo:[g('nome'),g('ruolo')].filter(Boolean).join(' — '),settore:g('settore'),
      descrizione:g('descrizione'),sitoWeb:g('sitoWeb'),
      tipoAsset:g('tipoAsset'),oggettoBase:g('oggetto'),corpoBase:g('corpo'),
      disiscrizione:g('disiscrizione')||state.templates.disiscrizione,
    });
    state.contacts.push(c);byEmail.set(key,c);
    added++;
  }
  if(added||updated){persist();render()}
  if(!silent) toast(added||updated?`${added} nuovi · ${updated} aggiornati dal foglio`:'Foglio già allineato','ok');
  else if(added||updated) toast(`${added} nuovi · ${updated} aggiornati`,'ok');
  return added;
}
