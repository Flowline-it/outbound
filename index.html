    <span class="spacer"></span><button class="btn sm" onclick="ldExportCsv(true)" ${rows.length?'':'disabled'} title="Esporta tutti i lead che vedi con questi filtri">${LD_I.ext}Esporta tutti (${rows.length})</button>
  </div>
  ${shown.length?`<div class="table-wrap"><table class="ld-table"><thead><tr>
      <th style="width:34px"><input type="checkbox" aria-label="Scegli tutti i lead" ${allSel?'checked':''} ${selectable.length?'':'disabled'} onclick="ldSelAll(this.checked)"></th>
      <th>Azienda</th><th>Settore</th><th>Sede</th><th>Email</th><th>Telefono</th><th>Stato</th></tr></thead><tbody>
    ${shown.map(l=>{const st=ldLeadState(l,have);return `<tr>
      <td><input type="checkbox" aria-label="Scegli ${escAttr(l.azienda||'lead')}" ${ld.sel.has(l.id)?'checked':''} onclick="ldSel('${l.id}',this.checked)"></td>
      <td class="az"><div>${esc(l.azienda||'—')}</div>${site(l.sito_web)}${l.ruolo?`<div class="ld-sub">${esc(l.ruolo)}</div>`:''}${l.descrizione?`<div class="ld-sub" title="${escAttr(l.descrizione)}">${esc(l.descrizione)}</div>`:''}</td>
      <td class="email-cell">${esc(l.settore||'—')}</td>
      <td class="email-cell">${esc(l.sede||'—')}</td>
      <td class="email-cell">${l.email?`${esc(l.email)}${l.email_fonte==='dedotta-ai'?' <span class="ld-tag" title="Indirizzo ricostruito dall\'AI dal nome del referente: il dominio riceve posta, la casella non è verificata">dedotta</span>':''}`:'—'}</td>
      <td class="email-cell tnum" style="white-space:nowrap">${l.telefono?`<a href="tel:${escAttr(l.telefono.replace(/\s+/g,''))}" style="color:inherit">${esc(l.telefono)}</a>`:'—'}</td>
      <td>${stChip(st)}</td></tr>`}).join('')}
  </tbody></table></div>${rows.length>500?`<p class="helptip" style="margin-top:10px">Mostro i primi 500 di ${rows.length}: usa la ricerca o scegli una ricerca specifica.</p>`:''}
  <div class="ld-selbar" id="ld-selbar" ${ld.sel.size?'':'hidden'}><span class="plan-sel-info"><b id="ld-sel-n">${ld.sel.size}</b> <span id="ld-sel-t">${ld.sel.size===1?'lead scelto':'lead scelti'}</span></span><span class="spacer"></span><button class="btn sm ghost" onclick="ld.sel.clear();render()">Annulla</button><button class="btn" onclick="ldExportCsv()">${LD_I.ext}Esporta in CSV</button><button class="btn primary" onclick="ldImport()">${LD_I.plus}Aggiungi ai contatti</button></div>`
  :`<div class="empty">${LD_I.search}<h4>${ld.leads.length?'Nessun lead con questi filtri':'Ancora nessun lead'}</h4><p>${ld.leads.length?'Prova a togliere un filtro o a cambiare ricerca.':'Avvia la prima ricerca qui sopra: i risultati compaiono qui appena n8n ha finito.'}</p></div>`}
  <p class="helptip" style="margin-top:12px">Aggiungendo un lead ai contatti entra in Outbound come “da pianificare”, con descrizione e sito per scrivere l'email. I lead senza email restano qui: puoi chiamarli o cercare l'indirizzo sul sito.</p>`;
}

/* =======================================================
   STATISTICHE OUTBOUND — anonime, come per la newsletter (funzione ob-track)
   ======================================================= */
const ob={loaded:false,loading:false,err:'',period:'30',rows:[],links:[],at:0};
async function obLoad(force){
  if(!supaReady()){ob.err='Database non collegato';render();return}
  if(ob.loading||(!force&&ob.loaded&&Date.now()-ob.at<60000))return;
  ob.loading=true; if(state.view==='stats')render();
  const since=ob.period==='all'?null:new Date(Date.now()-(+ob.period)*864e5).toISOString();
  const [a,b]=await Promise.all([supa.rpc('outbound_stats',{p_since:since}),supa.rpc('outbound_link_stats',{p_since:since})]);
  ob.loading=false;
  if(a.error||b.error){ob.err=(a.error||b.error).message;}
  else {ob.err='';ob.rows=a.data||[];ob.links=b.data||[];ob.loaded=true;ob.at=Date.now();}
  if(state.view==='stats')render();
}
function obSetPeriod(p){ob.period=p;ob.loaded=false;obLoad(true)}
function obPct(n,base){return base?Math.round(n/base*100)+'%':'—'}
function obTot(){return ob.rows.reduce((t,r)=>({sent:t.sent+ +r.sent,opens:t.opens+ +r.opens_unique,clicks:t.clicks+ +r.clicks_unique,bots:t.bots+ +r.bots}),{sent:0,opens:0,clicks:0,bots:0})}
// risposte: dai contatti (non sono dati anonimi, ma restano dentro Outbound come già oggi)
function obReplies(){
  const since=ob.period==='all'?null:new Date(Date.now()-(+ob.period)*864e5);
  const inRange=c=>!since||(c.reply&&c.reply.date&&new Date(c.reply.date)>=since);
  const real=state.contacts.filter(c=>c.haRisposto&&!(c.reply&&c.reply.auto)&&inRange(c));
  const byStep={};real.forEach(c=>{const sent=(c.history||[]).filter(h=>!h.skipped);const st=sent.length?Math.max(...sent.map(h=>h.step)):0;byStep[st]=(byStep[st]||0)+1});
  return {n:real.length,byStep};
}
function obHeroCopy(){
  if(!ob.loaded) return {t:'Statistiche.',l:'Quante email della sequenza vengono aperte e cliccate, in forma anonima come per la newsletter.'};
  const t=obTot();
  if(!t.sent) return {t:'Ancora nessun dato.',l:'I numeri partono dai prossimi invii reali: ogni email della sequenza viene contata in forma anonima.'};
  return {t:`${obPct(t.opens,t.sent)} delle email aperte.`,l:`${t.sent} email contate ${ob.period==='all'?'da quando sono attive le statistiche':'negli ultimi '+ob.period+' giorni'} · ${obPct(t.clicks,t.sent)} con almeno un clic.`};
}
function viewStats(){
  if(!ob.loaded&&!ob.loading&&!ob.err) setTimeout(()=>obLoad(),0);
  const seg=`<div class="filters"><div class="seg" role="group" aria-label="Periodo">
    ${[['7','Ultimi 7 giorni'],['30','Ultimi 30 giorni'],['90','Ultimi 90 giorni'],['all','Da sempre']].map(([k,l])=>`<button class="fbtn ${ob.period===k?'on':''}" aria-pressed="${ob.period===k}" onclick="obSetPeriod('${k}')">${l}</button>`).join('')}
  </div></div>`;
  if(ob.err) return seg+`<div class="empty"><h4>Statistiche non disponibili</h4><p>${esc(ob.err)}</p><button class="btn" onclick="obLoad(true)">Riprova</button></div>`;
  if(!ob.loaded) return seg+`<div class="empty"><span class="spinner"></span><p style="margin-top:14px">Carico le statistiche…</p></div>`;
  const t=obTot(), rep=obReplies();
  const off=!state.config.formatoHtml?'il formato "come Gmail" è spento':(!state.config.obTrackOpen&&!state.config.obTrackClick?'aperture e clic sono spenti':'');
  const warn=off?`<div class="alert"><span><b>Statistiche in pausa:</b> ${off} nelle Impostazioni, quindi le nuove email non vengono contate.</span></div>`:'';
  if(!t.sent) return seg+warn+`<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18 M7 16v-5 M12 16V8 M17 16v-8"/></svg><h4>Ancora nessun dato</h4><p>I numeri partono dai prossimi invii reali (non in modalità test). Ogni email della sequenza riceve un codice casuale: si contano le aperture e i clic, non chi li fa.</p></div>`;
  const rows=ob.rows.map(r=>{const st=state.cadence[r.step]?.nome||('Step '+(r.step+1));
    return `<tr><td class="az">${esc(st)}</td><td class="tnum">${r.sent}</td><td class="tnum">${obPct(r.opens_unique,r.sent)} <span class="email-cell">(${r.opens_unique})</span></td><td class="tnum">${obPct(r.clicks_unique,r.sent)} <span class="email-cell">(${r.clicks_unique})</span></td><td class="tnum">${rep.byStep[r.step]||0}</td></tr>`}).join('');
  return seg+warn+`
  <div class="nl-kpis">
    <div class="stat-t t-white"><div class="k">Email contate</div><div class="row"><div class="v">${t.sent}</div><div class="m">tutti gli step</div></div></div>
    <div class="stat-t t-white"><div class="k">Aperture stimate</div><div class="row"><div class="v">${obPct(t.opens,t.sent)}</div><div class="m">${t.opens} email aperte</div></div></div>
    <div class="stat-t t-white"><div class="k">Con almeno un clic</div><div class="row"><div class="v">${obPct(t.clicks,t.sent)}</div><div class="m">${t.clicks} email</div></div></div>
  </div>
  <div class="section-h"><h3>Per step della sequenza</h3><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Step</th><th>Inviate</th><th>Aperte</th><th>Con clic</th><th>Risposte</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${ob.links.length?`<div class="section-h"><h3>Link cliccati</h3><span class="count">${ob.links.length}</span><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Link</th><th>Email</th><th>Clic</th></tr></thead><tbody>${ob.links.map(l=>`<tr><td class="az" style="word-break:break-all">${esc(l.url)}</td><td class="tnum">${l.clicks_unique}</td><td class="tnum">${l.clicks_total}</td></tr>`).join('')}</tbody></table></div>`:''}
  <p class="helptip" style="margin-top:14px">Numeri anonimi, come per la newsletter: ogni email ha un codice casuale che non viene salvato con il contatto, quindi si sa quante email sono state aperte o cliccate, non da chi. Le aperture sono una stima: Apple Mail le gonfia, chi blocca le immagini non viene contato, e contano anche le volte che riapri tu un'email dalla cartella "Inviati" di Gmail. Le risposte invece vengono dai contatti e sono esatte.${t.bots?` Esclusi ${t.bots} accessi automatici di filtri antispam.`:''}</p>`;
}

/* ---- boot ---- */
(function boot(){
  const th=load(LS.theme,null)||(window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',th);
  initGoogle();
  // ripristina la sessione Google salvata; se scaduta, tenta un rinnovo silenzioso
  if(state.config.googleClientId){
    if(googleReady()){ scheduleRefresh(); setTimeout(()=>afterGoogleAuth(),300); }
    else if(state.google.email){ setTimeout(()=>refreshToken(),800); }
  }
  initSupabase();
  nlInit();
  render();
})();
</script>
