// mappa RIGA (colonne Supabase) -> contatto app
function contactFromRow(r){
  const c=mkContact({email:r.email||''});
  c.id=r.id||c.id;
  c.azienda=r.azienda||''; c.sede=r.sede||''; c.ruolo=r.ruolo||''; c.settore=r.settore||'';
  c.descrizione=r.descrizione||''; c.sitoWeb=r.sito_web||''; c.tipoAsset=r.tipo_asset||'';
  c.oggettoBase=r.oggetto||''; c.corpoBase=r.corpo||'';
  c.scheduledDate=r.scheduled_date||null; c.step=r.step||0;
  c.anchorDate=r.anchor_date||null; c.dataUltimoInvio=r.data_ultimo_invio||null;
  c.haRisposto=!!r.ha_risposto; c.threadId=r.thread_id||null; c.messageId=r.message_id||null;
  const d=r.data||{};
  c.drafts=d.drafts||{}; c.history=d.history||[];
  c.disiscrizione=d.disiscrizione||state.templates.disiscrizione; c.fermato=!!d.fermato; c.n=d.n||'';
  c.reply=d.reply||null; c.replySeen=d.replySeen!==false;
  return c;
}
// mappa contatto app -> RIGA (colonne Supabase)
function contactToSupaRow(c){
  const nn=v=>(v===''||v===undefined)?null:v; // vuoti -> null (date/testo)
  return {
    id:c.id, email:c.email||null, azienda:nn(c.azienda), sede:nn(c.sede), ruolo:nn(c.ruolo), settore:nn(c.settore),
    descrizione:nn(c.descrizione), sito_web:nn(c.sitoWeb), tipo_asset:nn(c.tipoAsset),
    oggetto:nn(c.oggettoBase), corpo:nn(c.corpoBase),
    scheduled_date:nn(c.scheduledDate), step:c.step||0, stato:statusOf(c).label,
    anchor_date:nn(c.anchorDate), data_ultimo_invio:nn(c.dataUltimoInvio),
    ha_risposto:!!c.haRisposto, thread_id:nn(c.threadId), message_id:nn(c.messageId),
    data:{drafts:c.drafts||{}, history:c.history||[], disiscrizione:c.disiscrizione, fermato:!!c.fermato, n:c.n||'', reply:c.reply||null, replySeen:c.replySeen!==false},
    updated_at:new Date().toISOString()
  };
}
async function supaLoad(opts={}){
  if(!supa)return;
  try{
    const {data,error}=await supa.from('contacts').select('*').order('updated_at',{ascending:true});
    if(error)throw error;
    if(data && data.length){
      _suppressPush=true;
      // il DATABASE è la verità: sostituisco lo stato locale
      state.contacts=data.map(contactFromRow);
      // ripulisco le lapidi ormai confermate (la riga non c'è più sul DB)
      const live=new Set(state.contacts.map(c=>c.id));
      [..._deleted].forEach(id=>{if(!live.has(id))forgetDeleted(id)});
      // inizializzo lo snapshot: così non rispingo dati appena letti
      _lastPushed=new Map();
      state.contacts.forEach(c=>{_lastPushed.set(c.id,rowSig(contactToSupaRow(c)));});
      save(LS.contacts,state.contacts);
      _suppressPush=false;
      _lastLoad=Date.now();
      renderConn();
      if(opts.silent)softRender(); else {render();toast(state.contacts.length+' contatti dal database','ok');}
    } else if(state.contacts.length){
      await pushAllToSupabase();
      renderConn();
      toast('Database inizializzato con i contatti locali','ok');
    } else {
      renderConn();
    }
  }catch(e){toast('Supabase load: '+e.message,'err')}
}
function supaSubscribe(){
  if(!supa)return;
  if(_supaChan){supa.removeChannel(_supaChan);_supaChan=null;}
  _supaChan=supa.channel('contacts-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'contacts'},payload=>{
      if(payload.eventType==='DELETE'){
        const id=payload.old&&payload.old.id;
        if(id){state.contacts=state.contacts.filter(c=>c.id!==id);_lastPushed.delete(id);save(LS.contacts,state.contacts);softRender();}
        return;
      }
      const row=payload.new; if(!row||!row.id)return;
      if(_deleted.has(row.id)) return;            // l'abbiamo eliminato noi: non farlo tornare
      const inc=contactFromRow(row); const cur=state.contacts.find(c=>c.id===inc.id);
      if(cur && JSON.stringify(cur)===JSON.stringify(inc)) return; // stesso dato nostro, ignora
      _suppressPush=true;
      if(cur)Object.assign(cur,inc); else state.contacts.push(inc);
      // allineo lo snapshot al dato appena arrivato: evita un push inutile
      _lastPushed.set(inc.id,rowSig(contactToSupaRow(inc)));
      save(LS.contacts,state.contacts);
      _suppressPush=false;
      softRender();
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED'){ if(_rtDown){_rtDown=false;supaRefresh('riconnesso');} }
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){ _rtDown=true; }
    });
}
/* ---- la scheda non deve mai lavorare su dati vecchi ----
   Se la pagina torna visibile dopo un po', se il tempo reale si era interrotto o ogni 10 minuti,
   prima salvo le mie modifiche e poi ricarico tutto dal database (che è la verità).
   Mai durante un invio: l'invio lavora sugli stessi contatti. */
let _lastLoad=Date.now(), _rtDown=false, _hiddenAt=0, _sending=0, _refreshing=false;
async function supaRefresh(why){
  if(!supaReady()||_sending||_refreshing)return;
  _refreshing=true;
  try{
    if(_pushTimer){clearTimeout(_pushTimer);_pushTimer=null;}
    await pushAllToSupabase();
    await supaLoad({silent:true});
    if(_rtDown||!_supaChan)supaSubscribe();
  }catch(e){console.warn('refresh',why,e)}
  finally{_refreshing=false;}
}

function softRender(){

  if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT')&&a.closest('#content')){ _pendingRender=true; return; }

function schedulePush(){

// snapshot dell'ultimo stato scritto sul DB: serve a spingere SOLO ciò che è cambiato
let _lastPushed=new Map();
// firma di un contatto per capire se è cambiato: SENZA updated_at e SENZA stato, che è calcolato dalla data.
// (prima lo stato era incluso: a ogni cambio di giorno tutte le righe sembravano "modificate" e una scheda
//  rimasta aperta da giorni riscriveva sul database i suoi dati vecchi — incidente del 9/11)
function rowSig(row){const r={...row};delete r.updated_at;delete r.stato;return JSON.stringify(r);}
// "lapidi": id eliminati da noi. Impediscono che un upsert li resusciti.
let _deleted=new Set(load('flo_deleted',[]));
function rememberDeleted(id){_deleted.add(id);save('flo_deleted',[..._deleted]);}
function forgetDeleted(id){_deleted.delete(id);save('flo_deleted',[..._deleted]);}

function setSyncState(s,msg){
  const dot=document.getElementById('sdot'),txt=document.getElementById('stxt');
  if(!dot||!txt)return;
  if(s==='saving'){dot.className='dot warn';txt.textContent='Salvataggio…';}
  else if(s==='err'){dot.className='dot';txt.style.color='var(--late)';txt.textContent=msg||'Errore sync';}
  else{dot.className='dot on';txt.style.color='';txt.textContent='Database online';}
}

async function pushAllToSupabase(){
  if(!supaReady()||_suppressPush)return;
  // spingi SOLO i contatti nuovi o modificati (mai tutti: eviterebbe di riscrivere righe altrui)
  const changed=[];
  for(const c of state.contacts){
    if(_deleted.has(c.id)) continue;            // mai reinserire ciò che abbiamo eliminato
    const row=contactToSupaRow(c);
    const sig=rowSig(row); // ignora timestamp e stato calcolato
    if(_lastPushed.get(c.id)!==sig){ changed.push({row,sig,id:c.id}); }
  }
  if(!changed.length)return;
  setSyncState('saving');
  try{
    const {error}=await supa.from('contacts').upsert(changed.map(x=>x.row),{onConflict:'id'});
    if(error)throw error;
    changed.forEach(x=>_lastPushed.set(x.id,x.sig));
    setSyncState('ok');
  }catch(e){
    setSyncState('err','Sync fallita');
    toast('Salvataggio su Supabase fallito: '+e.message,'err');
    console.warn('supabase push',e);
  }
}
// elimina davvero: attende la conferma del DB, altrimenti ripristina il contatto
async function supaDelete(id){
  if(!supaReady())return {ok:true,local:true};
  setSyncState('saving');
  try{
    const {error}=await supa.from('contacts').delete().eq('id',id);
    if(error)throw error;
    _lastPushed.delete(id);
    rememberDeleted(id);
    setSyncState('ok');
    return {ok:true};
  }catch(e){
    setSyncState('err','Eliminazione fallita');
    return {ok:false,err:e.message};
  }
}

/* migrazione una-tantum dal vecchio Google Sheet -> Supabase */
async function migrateFromSheet(){
  const url=(document.getElementById('mig-sheet')?.value||'').trim();
  if(!url){toast('Incolla il link (o ID) del vecchio Google Sheet','warn');return}
  if(!googleReady()){toast('Connetti prima Google (serve per leggere il foglio)','warn');connectGoogle();return}
  if(!supaReady()){ if(!confirm('Supabase non risulta connesso: i contatti verrebbero importati solo in locale. Continuare comunque?'))return; }
  const btn=document.getElementById('mig-btn');const old=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Migro…';}
  const prevId=state.config.sheetId, prevTab=state.config.sheetTab;
  try{
    const m=url.match(/\/d\/([a-zA-Z0-9-_]+)/); const id=m?m[1]:url;
    state.config.sheetId=id; state.config.sheetTab='';
    const before=state.contacts.length;
    await pullFromSheet({});                 // legge il foglio, importa i nuovi + aggiorna esistenti, persiste
    const imported=state.contacts.length-before;
    if(supaReady()) await pushAllToSupabase(); // spinge subito tutto su Supabase
    toast(`Migrazione completata: ${imported} nuovi contatti su Supabase`,'ok');
  }catch(e){toast('Migrazione fallita: '+e.message,'err');}
  finally{
    // non lascio il foglio collegato: Supabase resta l'unica sorgente
    state.config.sheetId=prevId||''; state.config.sheetTab=prevTab||''; persist();
    if(btn){btn.disabled=false;btn.innerHTML=old;}
    render();
  }
}

/* =======================================================
   ANTHROPIC — generazione email
   ======================================================= */
async function generateEmail(c, step){
  const key=state.config.anthropicKey;
  if(!key) throw new Error('Manca la chiave API Anthropic (Impostazioni)');
  const cad=state.cadence[step];
  const prevSent=c.history.filter(h=>h.step<step).map(h=>`[${state.cadence[h.step]?.nome}] Oggetto: ${h.oggetto}\n${h.corpo}`).join('\n\n---\n\n');
  const sys=(state.templates.promptSistema||PROMPT_SISTEMA_DEFAULT)
    .replace(/{azienda}/g, state.templates.azienda||'')
    .replace(/{mittente}/g, state.templates.mittente||'')
    .replace(/{tono}/g, state.templates.tono||'')
    .replace(/{regole_oggetto}/g, state.templates.regoleOggetto||'')
    .replace(/{regole_corpo}/g, state.templates.regoleCorpo||'');
  const ctx=`Destinatario:
- Azienda: ${c.azienda||'n/d'}
- Sede: ${c.sede||'n/d'}
- Persona di contatto / ruolo: ${c.ruolo||'n/d (nessun nome: saluta solo con "Buongiorno,")'}
- Settore: ${c.settore||'n/d'}
- Sito web: ${c.sitoWeb||'n/d'}
- Tipo asset/offerta: ${c.tipoAsset||'automazione dei processi (preventivi, ordini, listini)'}
${c.descrizione?`
DESCRIZIONE AZIENDA (informazione reale e verificata su cui basare la personalizzazione — usala per un aggancio concreto e specifico, senza copiarla parola per parola):
${c.descrizione}`:''}

Step da scrivere: "${cad.nome}".
Angolo/obiettivo di questo step: ${cad.angolo}
${step===0&&c.corpoBase?`\nBozza esistente da migliorare/riadattare (mantieni il senso, rendila naturale):\nOggetto: ${c.oggettoBase}\n${c.corpoBase}`:''}
${prevSent?`\nEmail già inviate in questo thread (NON ripeterti, costruisci sopra):\n${prevSent}`:''}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:Object.assign({'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      state.config.anthropicWorkspace?{'anthropic-workspace-id':state.config.anthropicWorkspace}:{}),
    body:JSON.stringify({model:MODEL,max_tokens:900,system:sys,messages:[{role:'user',content:ctx}]})
  });
  if(!r.ok){const t=await r.text();
    if(/anthropic-workspace-id|not scoped to a workspace/i.test(t)) throw new Error('La chiave Anthropic non è legata a un workspace: inserisci il Workspace ID in Impostazioni → Collegamenti');
    throw new Error('Anthropic '+r.status+': '+t.slice(0,200))}
  const data=await r.json();
  const u=data.usage||{};
  const inT=(u.input_tokens||0)+(u.cache_read_input_tokens||0)+(u.cache_creation_input_tokens||0);
  const outT=u.output_tokens||0;
  recordUsage(inT,outT);
  const callCost=costEUR({input:inT,output:outT});
  let txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  txt=txt.replace(/```json|```/g,'').trim();
  const m=txt.match(/\{[\s\S]*\}/); if(m)txt=m[0];
  const obj=JSON.parse(txt);
  return {oggetto:obj.oggetto||'', corpo:obj.corpo||'', cost:callCost};
}

/* get or build the draft for a contact's current step */
function getDraft(c, step){
  if(c.drafts && c.drafts[step]) return c.drafts[step];
  // default seed
  if(step===0 && c.oggettoBase){ return {oggetto:c.oggettoBase, corpo:c.corpoBase, seeded:true}; }
  // follow-ups: subject = same as email1 (stesso thread) ; body from template angle placeholder
  const subj = c.history[0]?.oggetto || c.oggettoBase || 'Seguito';
  return {oggetto:subj, corpo:'(Genera con AI o scrivi il testo del follow-up)', seeded:true};
}
function setDraft(c,step,d){c.drafts=c.drafts||{};c.drafts[step]={...d,seeded:false};persist()}

const HEADER_MAP={
  email:['email','e-mail','mail','indirizzo email','posta'],
  azienda:['azienda','company','ragione sociale','nome azienda','ditta','cliente'],
  sede:['sede','città','city','luogo','indirizzo','provincia','località'],
  nome:['nome','contatto','referente','name','persona'],
  ruolo:['ruolo','role','posizione','carica','title','qualifica'],
  settore:['settore','industry','categoria','comparto','ambito'],
  descrizione:['descrizione azienda','descrizione','description','note azienda','info azienda','profilo','about','bio'],
  sitoWeb:['sito web','sito internet','sito','website','web','url','homepage','pagina web'],
  tipoAsset:['tipo asset','asset','offerta','offer','prodotto','servizio','proposta'],
  oggetto:['oggetto','subject','titolo'],
  corpo:['corpo email 1','corpo','body','testo','email 1','messaggio','corpo email'],
  disiscrizione:['disiscrizione','unsubscribe','opt-out','disisc'],
  n:['n','#','num','numero','id'],
};
function guessMap(headers){
  const map={};
  const norm=h=>String(h||'').toLowerCase().trim();
  for(const field in HEADER_MAP){
    for(let i=0;i<headers.length;i++){
      const h=norm(headers[i]);
      if(HEADER_MAP[field].some(k=>h===k||h.includes(k))){map[field]=i;break;}
    }
  }
  return map;
}
function handleFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      // pick the sheet with most rows that has an email-like column
      let best=null,bestRows=null;
      for(const name of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,blankrows:false});
        if(rows.length<2)continue;
        const hdr=rows[0].map(x=>String(x||'').toLowerCase());
        const score=rows.length + (hdr.some(h=>h.includes('email')||h.includes('mail'))?1000:0);
        if(!best||score>best.score){best={name,score};bestRows=rows;}
      }
      if(!bestRows){toast('Nessun foglio valido trovato','err');return}
      openImportModal(bestRows[0], bestRows.slice(1), best.name, wb.SheetNames);
    }catch(err){toast('Errore lettura file: '+err.message,'err')}
  };
  reader.readAsArrayBuffer(file);
}

function v3After(){

// i numeri grandi salgono da zero al valore vero
function v3Count(root){
  const els=root.querySelectorAll('.stat-t .v,.hm-big,.load-n,.wk-n,.plan-sel-info b');
  els.forEach((el,i)=>{
    if(el.children.length)return;
    const txt=el.textContent, m=txt.match(/^(\D*?)(\d{1,3}(?:\.\d{3})+|\d+)(,\d+)?(.*)$/s);
    if(!m)return;
    const grouped=m[2].includes('.'), dec=m[3]?m[3].length-1:0;
    const val=parseFloat(m[2].replace(/\./g,'')+(m[3]?'.'+m[3].slice(1):''));
    if(!isFinite(val)||val===0)return;
    const fmt=n=>m[1]+n.toLocaleString('it-IT',{minimumFractionDigits:dec,maximumFractionDigits:dec,useGrouping:grouped})+m[4];
    const t0=performance.now()+Math.min(i,10)*50, D=val<10?450:850;
    el.textContent=fmt(0);
    const step=now=>{
      if(!el.isConnected)return;
      const p=Math.max(0,Math.min(1,(now-t0)/D)), e=1-Math.pow(1-p,3);
      if(p>=1){el.textContent=txt;return}
      el.textContent=fmt(dec?val*e:Math.round(val*e));
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
// pillola nera che scorre sotto la voce attiva (aree e pagine)
function v3Pills(){
  const pairs=[[document.getElementById('secSwitch'),'button[aria-pressed="true"]','.sec-wrap'],[document.getElementById('nav'),'button.active','.subnav-wrap']];
  requestAnimationFrame(()=>pairs.forEach(([box,sel,wrapSel])=>{
    if(!box)return;
    // il menu viene ridisegnato con innerHTML: tengo un riferimento fisso alla pillola e la rimetto dentro
    const wrap=box.closest(wrapSel);
    const ind=box._ind||(box._ind=wrap&&wrap.querySelector('.pill-ind'));
    if(!ind)return;
    if(ind.parentNode!==box)box.prepend(ind);
    const b=box.querySelector(sel);
    if(!b||!b.offsetWidth){ind.style.opacity='0';ind.dataset.on='';return}
    const x=b.offsetLeft,y=b.offsetTop,w=b.offsetWidth,h=b.offsetHeight;
    const same=ind.dataset.x==x&&ind.dataset.w==w&&ind.dataset.y==y;
    const first=!ind.dataset.on||v3Calm();
    if(first){ind.classList.add('no-anim');}
    ind.style.transform=`translate(${x}px,${y}px)`;ind.style.width=w+'px';ind.style.height=h+'px';ind.style.opacity='1';
    ind.dataset.x=x;ind.dataset.y=y;ind.dataset.w=w;ind.dataset.on='1';
    if(first){void ind.offsetWidth;ind.classList.remove('no-anim');}
    else if(!same){ // il testo della voce nuova diventa chiaro mentre la pillola arriva
      b.style.transition='none';b.style.color='var(--muted)';void b.offsetWidth;
      b.style.transition='color .3s cubic-bezier(.16,1,.3,1) .12s';b.style.color='';
    }
  }));
}

                :`<button class="btn sm ghost" onclick="markReply('${c.id}',false)" title="Per esempio una risposta automatica: riprende la sequenza">Non è una risposta</button>`}
      </div></div>`;};
  return `
    <div class="helptip" style="margin-bottom:12px">Le risposte vengono cercate in Gmail ogni 3 minuti: nel thread dell'invio e, se non c'è, in tutta la casella (spam compreso) per indirizzo del mittente. Chi risponde esce dalla sequenza e non riceve altri follow-up. Le risposte automatiche (fuori sede) vengono mostrate ma non fermano la sequenza.</div>
    <div class="section-h"><h3>Risposte</h3><span class="count">${real.length}</span><div class="line"></div></div>
    ${real.length?real.map(c=>card(c,false)).join(''):`<div class="empty" style="padding:30px"><h4>Ancora nessuna risposta</h4><p>Appena qualcuno risponde compare qui. Puoi controllare subito con il pulsante <b>Risposte</b> in alto.</p></div>`}
    ${autos.length?`<div class="section-h" style="margin-top:18px"><h3>Risposte automatiche</h3><span class="count">${autos.length}</span><div class="line"></div></div>${autos.map(c=>card(c,true)).join('')}`:''}`;
}
function markReply(id,yes){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  c.haRisposto=!!yes; if(c.reply)c.reply.auto=!yes; c.replySeen=true;
  if(!yes&&!c.reply)c.reply={auto:true,date:new Date().toISOString(),snippet:'',via:'manuale'};
  persist();render();toast(yes?'Segnata come risposta: follow-up fermati':'Sequenza ripresa per '+(c.azienda||c.email),'ok');
}

/* ---------- DASHBOARD ---------- */
function viewDashboard(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  const tot=state.contacts.length;
  const due=state.contacts.filter(dueToday).length;
  const late=state.contacts.filter(isLate).length;
  const waiting=state.contacts.filter(c=>!c.haRisposto && (c.step||0)>0 && (c.step||0)<state.cadence.length && !isDue(c)).length;
  const replied=state.contacts.filter(c=>c.haRisposto).length;
  const concluded=state.contacts.filter(c=>!c.haRisposto && (c.step||0)>=state.cadence.length).length;
  const backlog=state.contacts.filter(isUnplanned).length;
  const week=[];for(let i=0;i<7;i++)week.push(addDays(t,i));
  const wcount=week.map(d=>state.contacts.filter(c=>{const na=nextAction(c);return na&&sameDay(na.dueDate,d)}).length);
  const maxW=Math.max(1,...wcount), wsum=wcount.reduce((s,x)=>s+x,0);
  const rows=departures();
  const arrivals=state.contacts.filter(c=>c.haRisposto).sort((a,b)=>String(b.reply?.date||'').localeCompare(String(a.reply?.date||''))).slice(0,4);
  const fmtArr=d=>{if(!d)return '';const x=new Date(d);return x.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' · '+x.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
  return `
  <div class="bento">
    <div class="span-7">${boardHtml(rows,{title:'Partenze di oggi',
      foot:`<span>${due} da inviare oggi${late?` · <span style="color:#FF8A7E">${late} in ritardo</span>`:''}</span><span class="spacer"></span>
        <button class="btn sm" onclick="go('coda')">Apri la coda invio</button>`})}</div>
    <section class="tile t-lilac span-5" aria-label="Ultime risposte">
      <div class="tile-h"><h3>Ultime risposte</h3><span class="spacer"></span>${replied?`<button class="btn sm" onclick="go('risposte')">Vedi tutte</button>`:''}</div>
      ${arrivals.length?`<ul class="arr-list">${arrivals.map(c=>{const r=c.reply||{};
        return `<li class="arr-item" onclick="go('risposte')">
          <div class="arr-dest">${esc(c.azienda||c.email)}</div><div class="arr-time">${fmtArr(r.date)}</div>
          <div class="arr-snip">${r.snippet?esc(r.snippet):'Risposta segnata a mano: aprila in Gmail.'}</div>
        </li>`;}).join('')}</ul>`
      :`<p class="arr-empty">Ancora nessuna risposta. Le cerco in Gmail ogni 3 minuti e compaiono qui appena arrivano.</p>`}
    </section>
    <section class="tile t-cobalt span-6" aria-label="Prossimi 7 giorni">
      <div class="tile-h"><h3>Prossimi 7 giorni</h3><span class="spacer"></span><span class="sub">${wsum} ${wsum===1?'invio':'invii'}</span></div>
      <div class="wk">${week.map((d,i)=>{const isToday=sameDay(d,t);
        return `<div class="wk-c${isToday?' today':''}" title="${wcount[i]} invii previsti">
          <div class="wk-n">${wcount[i]}</div>
          <div class="wk-bw"><div class="wk-b${wcount[i]?'':' zero'}" style="height:${wcount[i]?Math.max(10,wcount[i]/maxW*100):6}%"></div></div>
          <div class="wk-d">${isToday?'Oggi':d.toLocaleDateString('it-IT',{weekday:'short'})}<b>${d.getDate()}</b></div>
        </div>`;}).join('')}</div>
    </section>
    <div class="span-6 stat-grid">
      <div class="stat-t t-orange"><div class="k">Tasso di risposta</div><div class="row"><div class="v">${tot?Math.round(replied/tot*100):0}%</div><div class="m">${replied} su ${tot}</div></div></div>
      <div class="stat-t t-white"><div class="k">In attesa di risposta</div><div class="row"><div class="v">${waiting}</div><div class="m">follow-up programmati</div></div></div>
      <div class="stat-t t-peach"><div class="k">Da pianificare</div><div class="row"><div class="v">${backlog}</div>${backlog?`<button class="btn sm dark" onclick="go('pianifica')">Pianifica</button>`:'<div class="m">backlog vuoto</div>'}</div></div>
      <div class="stat-t t-ink"><div class="k">Contatti totali</div><div class="row"><div class="v">${tot}</div><div class="m">${concluded} ${concluded===1?'sequenza conclusa':'sequenze concluse'}</div></div></div>
    </div>
  </div>`;
}

/* ---------- TABELLONE PARTENZE ---------- */
function sentToday(c){const h=c.history||[];const last=h[h.length-1];return !!(last&&!last.skipped&&last.date===isoD(today()));}
// partenze di oggi: prima i ritardi, poi quelle in coda oggi, poi quelle già inviate oggi
function departures(){
  const late=state.contacts.filter(isLate).sort((a,b)=>nextAction(a).dueDate-nextAction(b).dueDate);
  const tod=state.contacts.filter(dueToday).sort((a,b)=>(a.step||0)-(b.step||0));
  const gone=state.contacts.filter(c=>sentToday(c)&&!isDue(c));
  return [...late,...tod,...gone];
}
let _flapSeen={};
function boardStatus(c){
  if(sentToday(c)&&!isDue(c)) return {key:'gone',label:'Inviata oggi'};
  return statusOf(c);
}
function flap(c){
  const st=boardStatus(c);const prev=_flapSeen[c.id];_flapSeen[c.id]=st.label;
  return `<span class="flap ${st.key}${prev!==undefined&&prev!==st.label?' flip':''}">${esc(st.label)}</span>`;
}
function boardRow(c,i){
  const na=nextAction(c);const gone=!na||(sentToday(c)&&!isDue(c));
  const h=c.history||[];const lastStep=h.length?h[h.length-1].step:0;
  const stepLabel=gone?(state.cadence[lastStep]?.nome||''):na.label;
  const dd=gone?today():na.dueDate;const lateD=!gone&&dd<today();
  return `<tr class="${gone?'gone':''}" onclick="${gone?`openContact('${c.id}')`:`goCard('${c.id}')`}" title="${escAttr((c.azienda||'')+' — '+(c.email||''))}">
    <td class="b-n">${String(i+1).padStart(2,'0')}</td>
    <td class="b-dest">${esc(c.azienda||c.email)}</td>
    <td class="b-city">${esc(c.sede||'')}</td>
    <td class="b-step"><span>${esc(stepLabel)}</span></td>
    <td class="b-date${lateD?' late':''}">${String(dd.getDate()).padStart(2,'0')}.${String(dd.getMonth()+1).padStart(2,'0')}</td>
    <td class="b-st">${flap(c)}</td>
  </tr>`;
}
function boardHtml(rows,o){
  return `<section class="board" aria-label="${escAttr(o.title)}">
    <div class="board-h"><span class="bt">${esc(o.title)}</span><span class="bsub">${esc(o.sub||'')}</span><span class="spacer"></span>
      ${o.actions||`<span class="clock" id="boardClock">${clockNow()}</span>`}</div>
    ${rows.length?`<table><thead><tr><th class="b-n">N.</th><th>Destinazione</th><th class="b-city">Sede</th><th class="b-step">Step</th><th>Prevista</th><th class="b-st" style="text-align:right">Stato</th></tr></thead>
      <tbody>${rows.map(boardRow).join('')}</tbody></table>`
    :`<div class="board-empty">Nessuna partenza oggi. Le prime email pianificate compariranno qui nel giorno scelto.</div>`}
    ${o.foot?`<div class="board-foot">${o.foot}</div>`:''}
  </section>`;
}
function clockNow(){return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
setInterval(()=>{const el=document.getElementById('boardClock');if(el)el.textContent=clockNow()},15000);
function goCard(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(isLate(c)&&!_showLate)_showLate=true;
  if(state.view!=='coda')go('coda');
  setTimeout(()=>{const el=document.getElementById('card-'+id);if(!el)return;
    el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
    el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');},30);
}

/* ---------- PIANIFICAZIONE ---------- */
let _planSel=new Set();
function viewPianifica(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  const cap=state.config.maxAlGiorno||10;
  const backlog=state.contacts.filter(isUnplanned);
  const planned=state.contacts.filter(c=>!c.haRisposto && (c.step||0)===0 && c.scheduledDate)
    .sort((a,b)=>parseD(a.scheduledDate)-parseD(b.scheduledDate));
  // carico per i prossimi giorni lavorativi (tutti gli step, non solo email 1)
  const loadByDay={};
  state.contacts.forEach(c=>{const na=nextAction(c);if(na&&na.dueDate>=t){const k=isoD(na.dueDate);loadByDay[k]=(loadByDay[k]||0)+1;}});
  const strip=[];let d=new Date(t),guard=0;
  while(strip.length<10 && guard<40){ if(!(state.config.saltaWeekend&&(d.getDay()===0||d.getDay()===6))) strip.push(new Date(d)); d=addDays(d,1);guard++; }
  const defStart=isoD(nextWorkday(addDays(t,1)));

  // strip carico
  const stripHtml=strip.map(dd=>{const k=isoD(dd);const n=loadByDay[k]||0;const over=n>cap;const isToday=sameDay(dd,t);
    return `<div class="load-cell${isToday?' today':''}" title="${n} invii previsti">
      <div class="load-d">${dd.toLocaleDateString('it-IT',{weekday:'short'})}<b>${String(dd.getDate()).padStart(2,'0')}.${String(dd.getMonth()+1).padStart(2,'0')}</b></div>
      <div class="load-bar-wrap"><div class="load-bar${over?' over':''}" style="width:${Math.min(100,n/Math.max(cap,1)*100)}%"></div></div>
      <div class="load-n${over?' over':''}">${n}</div>
    </div>`;}).join('');

  if(!backlog.length && !planned.length){
    return `<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18"/></svg>
      <h4>Tutto pianificato</h4><p>Non ci sono contatti da pianificare. Importa nuovi lead per assegnare le date di contatto.</p>
      <button class="btn primary" onclick="pickFile()">Importa contatti</button></div>`;
  }

  let html=`
  <div class="section-h" style="margin-top:0"><h3>Carico per giorno</h3><span class="email-cell">limite ${cap} al giorno</span><div class="line"></div></div>
  <div class="card" style="overflow:hidden"><div class="load-strip">${stripHtml}</div></div>`;

  if(backlog.length){
    html+=`
    <div class="card plan-bar">
      <div class="plan-bar-row">
        <div class="plan-sel-info"><b id="plan-count">0</b> selezionati su ${backlog.length}
          <button class="btn sm ghost" onclick="planSelAll(true)">Tutti</button>
          <button class="btn sm ghost" onclick="planSelAll(false)">Nessuno</button>
          ${backlog.some(c=>!c.email)?`<button class="btn sm ghost" onclick="planSelNoEmail()">Senza email (${backlog.filter(c=>!c.email).length})</button>`:''}
        </div>
        <span style="flex:1"></span>
        <button class="btn sm del" onclick="askDeleteMany([..._planSel])">Elimina selezionati</button>
      </div>
      <div class="plan-bar-row">
        <div class="plan-group">
          <span class="plan-lbl">Assegna a una data</span>
          <input type="date" id="plan-date" value="${defStart}">
          <button class="btn sm primary" onclick="planSelected(document.getElementById('plan-date').value)">Pianifica selezionati</button>
          <button class="btn sm ghost" onclick="planSelected('${isoD(t)}')">Oggi</button>
          <button class="btn sm ghost" onclick="planSelected('${defStart}')">Domani</button>
        </div>
      </div>
      <div class="plan-bar-row">
        <div class="plan-group">
          <span class="plan-lbl">Distribuzione automatica</span>
          <input type="number" id="plan-perday" value="${cap}" style="width:64px"> al giorno, da
          <input type="date" id="plan-autostart" value="${defStart}">
          <button class="btn sm" onclick="planAuto(false)">Distribuisci selezionati</button>
          <button class="btn sm" onclick="planAuto(true)">Distribuisci tutto il backlog</button>
        </div>
      </div>
    </div>

    <div class="section-h"><h3>Da pianificare</h3><span class="count">${backlog.length}</span><div class="line"></div></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="plan-allcheck" onclick="planSelAll(this.checked)"></th>
          <th>Azienda</th><th>Email</th><th>Sede</th></tr></thead>
        <tbody>
        ${backlog.map(c=>`<tr onclick="if(event.target.tagName!=='INPUT'){const cb=this.querySelector('input');cb.checked=!cb.checked;togglePlanSel('${c.id}',cb.checked)}">
          <td><input type="checkbox" data-pid="${c.id}" ${_planSel.has(c.id)?'checked':''} onclick="togglePlanSel('${c.id}',this.checked)"></td>
          <td class="az">${esc(c.azienda)}</td>
          <td class="email-cell">${c.email?esc(c.email):'<span class="no-mail">senza email</span>'}</td>
          <td class="email-cell">${esc(c.sede||'—')}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  if(planned.length){
    html+=`<div class="section-h"><h3>Già pianificati (prima email)</h3><span class="count">${planned.length}</span><div class="line"></div></div>
    <div class="table-wrap"><table>
      <thead><tr><th>Azienda</th><th>Email</th><th>Data prevista</th><th></th></tr></thead>
      <tbody>
      ${planned.map(c=>{const dd=parseD(c.scheduledDate);const lateP=dd<t;
        return `<tr>
          <td class="az">${esc(c.azienda)}</td>
          <td class="email-cell">${esc(c.email)}</td>
          <td><span class="chip ${lateP?'late':(sameDay(dd,t)?'today':'wait')}"><span class="d"></span>${fmtDLong(dd)}</span></td>
          <td style="text-align:right">
            <input type="date" value="${c.scheduledDate}" onchange="rescheduleOne('${c.id}',this.value)" style="margin-right:6px">
            <button class="btn sm ghost danger" onclick="unplan('${c.id}')">Rimetti in backlog</button>
          </td>
        </tr>`;}).join('')}
      </tbody></table></div>`;
  }
  return html;
}
function bindPianifica(){ updatePlanCount(); }
function updatePlanCount(){const el=document.getElementById('plan-count');if(el)el.textContent=_planSel.size;}
function togglePlanSel(id,on){ if(on)_planSel.add(id);else _planSel.delete(id); updatePlanCount(); }
function planSelAll(on){
  const backlog=state.contacts.filter(isUnplanned);
  _planSel=new Set(on?backlog.map(c=>c.id):[]);
  render();
}
function planSelNoEmail(){state.contacts.filter(isUnplanned).forEach(c=>{if(!c.email)_planSel.add(c.id)});render()}
function planSelected(dateISO){
  if(!dateISO){toast('Scegli una data','warn');return}
  if(!_planSel.size){toast('Seleziona prima dei contatti','warn');return}
  let n=0;
  state.contacts.forEach(c=>{ if(_planSel.has(c.id) && isUnplanned(c)){ c.scheduledDate=dateISO; n++; } });
  _planSel.clear();persist();render();
  toast(`${n} contatti pianificati per ${fmtDLong(parseD(dateISO))}`,'ok');
}
function planAuto(all){
  const perDay=Math.max(1, +(document.getElementById('plan-perday')?.value)||state.config.maxAlGiorno||10);
  const startISO=document.getElementById('plan-autostart')?.value || isoD(nextWorkday(addDays(today(),1)));
  let pool=state.contacts.filter(isUnplanned);
  if(!all) pool=pool.filter(c=>_planSel.has(c.id));
  if(!pool.length){toast(all?'Backlog vuoto':'Nessun contatto selezionato','warn');return}
  let day=nextWorkday(parseD(startISO)); let cnt=0, days=0;
  pool.forEach(c=>{
    c.scheduledDate=isoD(day); cnt++;
    if(cnt>=perDay){ cnt=0; days++; day=nextWorkday(addDays(day,1)); }
  });
  _planSel.clear();persist();render();
  toast(`${pool.length} contatti distribuiti (${perDay}/giorno)`,'ok');
}
function rescheduleOne(id,dateISO){const c=state.contacts.find(x=>x.id===id);if(c&&dateISO){c.scheduledDate=dateISO;persist();render();toast('Data aggiornata','ok')}}
function unplan(id){const c=state.contacts.find(x=>x.id===id);if(c){c.scheduledDate=null;persist();render();toast('Rimesso in backlog','warn')}}

/* ---------- CODA INVIO ---------- */
let _showLate=false;
function toggleLate(){_showLate=!_showLate;render()}
function viewCoda(){
  if(!state.contacts.length) return emptyState();
  const cap=state.config.maxAlGiorno||999;
  const todayList=state.contacts.filter(dueToday).sort((a,b)=>(a.step||0)-(b.step||0));
  const lateList=state.contacts.filter(isLate).sort((a,b)=>nextAction(a).dueDate-nextAction(b).dueDate);

  if(!todayList.length && !lateList.length){
    const backlog=state.contacts.filter(isUnplanned).length;
    return `<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
    <h4>Niente da inviare oggi</h4>
    <p>${backlog?`Hai <b>${backlog} contatti da pianificare</b>: assegna loro una data nella sezione Pianificazione e compariranno qui nel giorno scelto.`:'Nessun contatto previsto per oggi. I prossimi follow-up compariranno qui alla data prevista.'}</p>
    <button class="btn primary" onclick="go('${backlog?'pianifica':'calendario'}')">${backlog?'Vai alla pianificazione<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'Vedi il calendario'}</button></div>`;
  }

  let html='';
  // banner ritardi (fuori dal "solo oggi", ma recuperabili a richiesta)
  if(lateList.length){
    html+=`<div class="alert" role="status">
      <svg class="ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4 M12 16h.01"/></svg>
      <div style="flex:1"><b>${lateList.length} follow-up in ritardo</b><div class="email-cell">erano previsti nei giorni scorsi e non sono ancora partiti.</div></div>
      <button class="btn sm" onclick="toggleLate()">${_showLate?'Nascondi':'Mostra e recupera'}</button>
    </div>`;
    if(_showLate){
      html+=`<div class="section-h" style="margin-top:8px"><h3 style="color:var(--late)">In ritardo</h3><span class="count">${lateList.length}</span><div class="line"></div></div>`;
      html+=lateList.map((c,i)=>codaCard(c,i,9999)).join('');
    }
  }

  // intestazione di oggi: tabellone partenze con le azioni di gruppo
  const qrows=[...(_showLate?lateList:[]),...todayList,...state.contacts.filter(c=>sentToday(c)&&!isDue(c))];
  html+=`<div class="qboard">${boardHtml(qrows,{title:'Partenze di oggi',sub:todayList.length+' '+(todayList.length===1?'contatto':'contatti')})}</div>`;
  if(!todayList.length){
    html+=`<div class="email-cell" style="padding:6px 2px 14px">Nessun contatto previsto per oggi.${lateList.length&&!_showLate?' Hai però dei follow-up in ritardo qui sopra.':''}</div>`;
  } else {
    if(cap<todayList.length) html+=`<div class="helptip" style="margin:-4px 0 14px">Hai impostato un limite di <b>${cap} email/giorno</b>: oltre questa soglia i contatti sono marcati "oltre limite", così resti nel ritmo.</div>`;
    html+=`<div class="section-h"><h3>Bozze da rivedere</h3><span class="count">${todayList.length}</span><div class="line"></div></div>`;
    html+=todayList.map((c,idx)=>codaCard(c,idx,cap)).join('');
  }
  return html;
}
function codaCard(c,idx,cap){
  const na=nextAction(c);const step=na.stepIndex;const d=getDraft(c,step);const st=statusOf(c);
  const over=idx>=cap;
  const subjLen=(d.oggetto||'').length, bodyLen=(d.corpo||'').length;
  return `<div class="card queue-card" id="card-${c.id}">
    <div class="qc-head">
      <div>
        <div class="az">${cap>=9999?'':`<span class="qn">${idx+1}</span>`}${esc(c.azienda)}</div>
        <div class="meta">${esc(c.email)}${c.sede?' · '+esc(c.sede):''}</div>
      </div>
      <div class="qtags"><span class="step-pill">${esc(na.label)}</span>
      ${chip(st)}
      ${over?`<span class="chip da" title="Oltre il limite giornaliero">oltre limite</span>`:''}</div>
      <div class="spacer"></div>
      <div class="meta">previsto ${fmtD(na.dueDate)}</div>
    </div>
    <div class="qc-main">
    <div class="qc-body">
      <div>
        <div class="field-lbl">Oggetto <span class="cnt">${subjLen} car.</span></div>
        <input class="subj" data-id="${c.id}" data-f="oggetto" value="${escAttr(d.oggetto)}" placeholder="Oggetto email">

async function regen(id,step){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  const btn=document.getElementById('regen-'+id);const old=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Genero...';
  try{
    const r=await generateEmail(c,step);
    setDraft(c,step,r);
    toast('Email rigenerata · ≈ €'+fmtMoney(r.cost||0),'ok');render();
  }catch(e){toast(e.message,'err');btn.disabled=false;btn.innerHTML=old}
}
async function generateAllDrafts(){
  const list=state.contacts.filter(c=>dueToday(c)||(_showLate&&isLate(c)));
  if(!state.config.anthropicKey){toast('Manca la chiave Anthropic','warn');openSettings('collegamenti');return}
  let done=0,batchCost=0;toast('Genero '+list.length+' bozze...','warn');
  for(const c of list){
    const na=nextAction(c);if(!na)continue;
    if(c.drafts&&c.drafts[na.stepIndex]&&!c.drafts[na.stepIndex].seeded)continue;
    // for email1 with a base draft, skip (already good); generate only missing/followups
    if(na.stepIndex===0 && c.oggettoBase) continue;
    try{const r=await generateEmail(c,na.stepIndex);setDraft(c,na.stepIndex,r);batchCost+=(r.cost||0);done++;render();}catch(e){console.warn(e)}
  }
  toast(done+' bozze generate · ≈ €'+fmtMoney(batchCost),'ok');render();
}
function draftReady(c,step){const d=getDraft(c,step);return !!(d.oggetto&&d.corpo&&!(d.seeded&&step>0));}
async function sendContact(c,step){
  if(!c.email) return {err:'senza email'};
  const d=getDraft(c,step);
  if(!d.oggetto||!d.corpo||(d.seeded&&step>0)) return {skip:true};
  const res=await sendEmailGmail(c,step,d.oggetto,d.corpo);
  c.history.push({step,oggetto:d.oggetto,corpo:d.corpo,date:isoD(today())});
  if(step===0){c.anchorDate=isoD(today());c.threadId=res.threadId;c.messageId=res.messageId||c.messageId;}
  else{if(res.threadId)c.threadId=res.threadId;}
  c.dataUltimoInvio=isoD(today());
  c.step=step+1;
  if(c.drafts)delete c.drafts[step];
  persist();
  return {ok:true, simulated:res.simulated};
}
async function doSend(id,step){
  _sending++;try{return await _doSend(id,step);}finally{_sending--;}
}
async function _doSend(id,step){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(!c.email){toast('Contatto senza email','err');return}
  if(!state.config.testMode && !googleReady()){toast('Connetti Google per inviare (o attiva la modalità test)','warn');connectGoogle();return}
  if(!draftReady(c,step)){toast('Completa oggetto e corpo prima di inviare','warn');return}
  const btn=document.getElementById('send-'+id);const old=btn.innerHTML;
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Invio...';
  try{
    const res=await sendContact(c,step);
    toast(res.simulated?`Simulato invio a ${c.azienda}`:`Inviata a ${c.azienda}`,'ok');
    render();
  }catch(e){toast('Invio fallito: '+e.message,'err');btn.disabled=false;btn.innerHTML=old}
}
async function sendAllToday(){
  _sending++;try{return await _sendAllToday();}finally{_sending--;if(_pushTimer){clearTimeout(_pushTimer);_pushTimer=null;}pushAllToSupabase();}
}
async function _sendAllToday(){
  const list=state.contacts.filter(c=>dueToday(c)||(_showLate&&isLate(c)));
  const ready=list.filter(c=>{const na=nextAction(c);return na&&draftReady(c,na.stepIndex);});
  const notReady=list.length-ready.length;
  if(!ready.length){toast(notReady?'Nessuna bozza pronta: genera prima i testi mancanti':'Coda vuota','warn');return}
  if(!state.config.testMode && !googleReady()){toast('Connetti Google per inviare (o attiva la modalità test)','warn');connectGoogle();return}
  if(!confirm(`Inviare ${ready.length} email${state.config.testMode?' (SIMULATE — modalità test attiva)':''}?${notReady?`\n\n${notReady} verranno saltate perché senza testo.`:''}`))return;
  const btn=document.getElementById('btnSendAll');const old=btn?btn.innerHTML:'';
  if(btn)btn.disabled=true;
  let sent=0,fail=0,skip=notReady;
  for(const c of ready){
    const na=nextAction(c);if(!na){skip++;continue;}
    if(btn)btn.innerHTML=`<span class="spinner"></span> ${sent+1}/${ready.length}`;
    try{ const r=await sendContact(c,na.stepIndex); if(r&&r.ok)sent++; else if(r&&r.skip)skip++; else fail++; }
    catch(e){fail++;console.warn('invio',c.azienda,e.message);}
  }
  render();
  toast(`${sent} email inviate${fail?` · ${fail} errori`:''}${skip?` · ${skip} saltate`:''}`, fail?'warn':'ok');
}
function skipStep(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  const na=nextAction(c);if(!na)return;
  c.history.push({step:na.stepIndex,oggetto:'(saltato)',corpo:'',date:isoD(today()),skipped:true});
  if(na.stepIndex===0)c.anchorDate=isoD(today());
  c.step=na.stepIndex+1;persist();render();toast('Step saltato','warn');
}

let _calWeek=0; // offset settimane rispetto a questa
function calNav(d){_calWeek+=d;render()}
function calToday(){_calWeek=0;render()}
function startOfWeek(d){const x=new Date(d);const g=(x.getDay()+6)%7;return addDays(x,-g);} // lunedì
function viewCalendario(){
  if(!state.contacts.length) return emptyState();
  const t=today();
  // mappa data->items
  const byDay={};
  let lateCount=0;
  state.contacts.forEach(c=>{const na=nextAction(c);if(!na)return;
    if(na.dueDate<t)lateCount++;
    const k=isoD(na.dueDate);(byDay[k]=byDay[k]||[]).push({c,na});
  });

  const wkStart=startOfWeek(addDays(t,_calWeek*7));
  const days=[];for(let i=0;i<7;i++)days.push(addDays(wkStart,i));
  const wkLabel=`${wkStart.getDate()} ${wkStart.toLocaleDateString('it-IT',{month:'short'})} – ${addDays(wkStart,6).getDate()} ${addDays(wkStart,6).toLocaleDateString('it-IT',{month:'short'})}`;
  const weekTotal=days.reduce((s,d)=>s+((byDay[isoD(d)]||[]).length),0);

  const stepColors=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];

  function dayCell(d){
    const k=isoD(d);const items=(byDay[k]||[]);
    const isToday=sameDay(d,t);const isPast=d<t;const wknd=(d.getDay()===0||d.getDay()===6);
    const overdue=isPast&&items.length;
    return `<div class="cal-cell${isToday?' today':''}${wknd?' wknd':''}${isPast&&!isToday?' past':''}">
      <div class="cal-cell-h">
        <span class="cal-dname">${d.toLocaleDateString('it-IT',{weekday:'short'})}</span>
        <span class="cal-dnum">${d.getDate()}</span>
        ${items.length?`<span class="cal-count${overdue?' late':''}">${items.length}</span>`:''}
      </div>
      <div class="cal-items">
        ${items.slice(0,6).map(x=>{
          const col=stepColors[Math.min(x.na.stepIndex,stepColors.length-1)];
          return `<div class="cal-item" title="${escAttr(x.c.azienda+' — '+x.na.label+' ('+x.c.email+')')}" onclick="openContact('${x.c.id}')">
            <span class="cal-dot" style="background:${col}"></span>
            <span class="cal-az">${esc(x.c.azienda||x.c.email)}</span>
          </div>`;
        }).join('')}
        ${items.length>6?`<div class="cal-more">+${items.length-6} altri</div>`:''}
        ${!items.length?`<div class="cal-empty">—</div>`:''}
      </div>
    </div>`;
  }

  const legend=state.cadence.map((s,i)=>`<span class="cal-leg"><span class="cal-dot" style="background:${stepColors[Math.min(i,stepColors.length-1)]}"></span>${esc(s.nome)}</span>`).join('');

  return `
  ${lateCount?`<div class="alert" role="status">
    <svg class="ai" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4 M12 16h.01"/></svg>
    <div style="flex:1"><b>${lateCount} in ritardo</b> <span class="email-cell">— follow-up arretrati da recuperare</span></div>
    <button class="btn sm primary" onclick="go('coda')">Vai alla coda<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`:''}

  <div class="cal-bar">
    <button class="btn sm ghost" onclick="calNav(-1)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="cal-title"><b>${wkLabel}</b><span class="email-cell">${weekTotal} invii in settimana${_calWeek===0?' · settimana corrente':''}</span></div>
    <button class="btn sm ghost" onclick="calNav(1)"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    ${_calWeek!==0?`<button class="btn sm" onclick="calToday()">Oggi</button>`:''}
  </div>

  <div class="cal-grid">${days.map(dayCell).join('')}</div>

  <div class="cal-legend">${legend}<span class="cal-leg" style="margin-left:auto;color:var(--faint)">Clicca un contatto per i dettagli</span></div>
  `;
}

function confirmImport(){
  const {headers,rows}=_importData;
  const fields=['email','azienda','sede','nome','ruolo','settore','descrizione','sitoWeb','tipoAsset','oggetto','corpo','disiscrizione','n'];
  const sel={};fields.forEach(f=>{const el=document.getElementById('map-'+f);sel[f]=el?(el.value===''?-1:+el.value):-1});
  const dedup=document.getElementById('dedup-tog').classList.contains('on');
  const seen=new Set(state.contacts.map(c=>c.email.toLowerCase()));
  let added=0,skipped=0;
  rows.forEach(r=>{
    const g=f=>sel[f]>=0?String(r[sel[f]]??'').trim():'';
    const email=g('email');
    if(dedup&&(!email||seen.has(email.toLowerCase()))){skipped++;return}
    if(email)seen.add(email.toLowerCase());

/* ---------- eliminazione in blocco ---------- */
// email eliminate: il foglio Google sincronizzato non deve rimetterle in lista
let _deletedEmails=new Set(load('flo_deleted_emails',[]));
function rememberDeletedEmail(e){e=String(e||'').trim().toLowerCase();if(e){_deletedEmails.add(e);save('flo_deleted_emails',[..._deletedEmails]);}}
async function supaDeleteMany(ids){
  if(!supaReady())return {ok:true,local:true};
  setSyncState('saving');
  try{
    for(let i=0;i<ids.length;i+=100){
      const chunk=ids.slice(i,i+100);
      const {error}=await supa.from('contacts').delete().in('id',chunk);
      if(error)throw error;
      chunk.forEach(id=>{_lastPushed.delete(id);rememberDeleted(id)});
    }
    setSyncState('ok');return {ok:true};
  }catch(e){setSyncState('err','Eliminazione fallita');return {ok:false,err:e.message};}
}
function askDeleteMany(ids){
  const set=new Set(ids), list=state.contacts.filter(c=>set.has(c.id));
  if(!list.length){toast('Seleziona prima dei contatti','warn');return}
  const n=list.length, att=list.filter(c=>(c.step||0)>0||c.haRisposto).length, noMail=list.filter(c=>!c.email).length;
  const shown=list.slice(0,8).map(c=>`<li><b>${esc(c.azienda||'(senza nome)')}</b> <span class="email-cell">${esc(c.email||'senza email')}</span></li>`).join('');
  modal(`<div class="modal" onclick="event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="del-t">
    <div class="modal-h"><h3 id="del-t">Eliminare ${n} ${n===1?'contatto':'contatti'}?</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
    <div class="modal-b">
      <ul class="del-list">${shown}${n>8?`<li class="email-cell">e altri ${n-8}</li>`:''}</ul>
      ${noMail?`<p class="helptip">${noMail} ${noMail===1?'è senza email':'sono senza email'}.</p>`:''}
      ${att?`<div class="alert" style="margin:0"><span><b>${att} ${att===1?'è già in sequenza o ha risposto':'sono già in sequenza o hanno risposto'}.</b> Eliminandoli perdi anche lo storico delle email inviate.</span></div>`:''}
      <p class="helptip">Vengono tolti anche dal database, per tutto il team, e non tornano dal foglio Google collegato. Non si può annullare.</p>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn del" id="del-go" onclick="deleteMany(${escAttr(JSON.stringify(list.map(c=>c.id)))})">Elimina ${n}</button></div>
  </div>`);
  setTimeout(()=>document.getElementById('del-go')?.focus(),50);
}
async function deleteMany(ids){
  const set=new Set(ids), backup=state.contacts.filter(c=>set.has(c.id));
  closeModal(); if(!backup.length)return;
  state.contacts=state.contacts.filter(c=>!set.has(c.id));
  save(LS.contacts,state.contacts);
  ids.forEach(id=>{_ctSel.delete(id);_planSel.delete(id)});
  render();
  const res=await supaDeleteMany(backup.map(c=>c.id));
  if(!res.ok){
    state.contacts.push(...backup);save(LS.contacts,state.contacts);render();
    toast('Eliminazione non riuscita sul database: '+res.err+'. Nessun contatto è stato tolto.','err');
    return;
  }
  backup.forEach(c=>rememberDeletedEmail(c.email));
  toast(`${backup.length} ${backup.length===1?'contatto eliminato':'contatti eliminati'}`,'ok');
}

async function deleteContact(id){
  const c=state.contacts.find(x=>x.id===id);if(!c)return;
  if(!confirm(`Eliminare "${c.azienda||c.email}"?\n\nVerrà rimosso anche dal database Supabase, per tutto il team.`))return;
  const backup={...c};
  state.contacts=state.contacts.filter(x=>x.id!==id);
  save(LS.contacts,state.contacts);
  closeModal();render();
  const res=await supaDelete(id);
  if(!res.ok){
    // il DB ha rifiutato: rimetto il contatto e avviso, così non c'è divergenza silenziosa
    state.contacts.push(backup);save(LS.contacts,state.contacts);render();
    toast('Eliminazione fallita sul database: '+res.err,'err');
  } else {
    rememberDeletedEmail(backup.email);
    toast('Contatto eliminato','ok');
  }
}

  if(!document.startViewTransition||v3Calm()){apply();return}
  const b=document.getElementById('themeBtn').getBoundingClientRect();
  const x=b.left+b.width/2,y=b.top+b.height/2,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
  document.startViewTransition(apply).ready.then(()=>{

/* ---- testo della newsletter: formattazione semplice ---- */
// riga vuota = paragrafo · **grassetto** · [testo](https://link) · "- " = elenco · "## " = titoletto
function nlInline(s,trk){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s"']+)\)/g,(m,t,u)=>{
      const raw=u.replace(/&amp;/g,'&');                        // l'indirizzo esatto scritto nel testo
      const href=trk&&/^https?:/i.test(raw)?NL_TRACK+'/c?'+nlTrackQ(trk)+'&u='+encodeURIComponent(raw):raw;
      return `<a href="${escAttr(href)}" style="color:#A85400;text-decoration:underline">${t}</a>`;
    });
}
function nlBodyHtml(text,trk){
  const P='margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#1E1E1E';
  return String(text||'').replace(/\r/g,'').split(/\n\s*\n/).map(b=>b.replace(/^\n+|\n+$/g,'')).filter(Boolean).map(b=>{
    const lines=b.split('\n');
    if(lines.length===1&&/^##\s+/.test(b)) return `<h2 style="margin:24px 0 10px;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.3;color:#1E1E1E">${nlInline(b.replace(/^##\s+/,''),trk)}</h2>`;
    if(lines.every(l=>/^\s*-\s+/.test(l))) return `<ul style="margin:0 0 16px;padding-left:22px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#1E1E1E">${lines.map(l=>`<li style="margin:0 0 6px">${nlInline(l.replace(/^\s*-\s+/,''),trk)}</li>`).join('')}</ul>`;
    return `<p style="${P}">${lines.map(l=>nlInline(l,trk)).join('<br>')}</p>`;
  }).join('\n');
}
function nlBodyText(text){
  return String(text||'').replace(/\r/g,'')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'$1 ($2)')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/^##\s+/gm,'').replace(/^\s*-\s+/gm,'• ').trim();
}
function nlEmailHtml(c,unsubUrl,trk){
  return `<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(c.subject||'')}</title></head>
<body style="margin:0;padding:0;background:#F3F3F1">
<div style="display:none;max-height:0;overflow:hidden;opacity:0">${esc(c.preheader||'')}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F3F3F1"><tr><td align="center" style="padding:24px 12px">

<tr><td style="padding:14px 32px 18px">
${nlBodyHtml(c.body,trk)||'<p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#9A9A92">Il testo della newsletter comparirà qui.</p>'}
</td></tr></table>

</td></tr></table>${trk?`<img src="${escAttr(NL_TRACK+'/o?'+nlTrackQ(trk))}" width="1" height="1" alt="" style="display:block;border:0;width:1px;height:1px;opacity:0">`:''}
</td></tr></table></body></html>`;

// MIME con parti in base64 (righe da 76): niente righe troppo lunghe per i server di posta
function nlB64Lines(s){return utf8b64(s).match(/.{1,76}/g).join('\r\n')}
function nlBuildRaw({to,from,subject,html,text,listUnsub}){
  const b='flonl'+Math.random().toString(36).slice(2,12);
  const headers=['From: '+from,'To: '+to,'Subject: '+encSubject(subject),'MIME-Version: 1.0','Content-Type: multipart/alternative; boundary="'+b+'"'];
  if(listUnsub) headers.push('List-Unsubscribe: '+listUnsub);
  const parts=['--'+b,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',nlB64Lines(text),
    '--'+b,'Content-Type: text/html; charset="UTF-8"','Content-Transfer-Encoding: base64','',nlB64Lines(html),'--'+b+'--',''].join('\r\n');
  return b64url(utf8b64(headers.join('\r\n')+'\r\n\r\n'+parts));
}

// track=true solo negli invii veri: le prove a sé e l'anteprima non entrano nelle statistiche
async function nlSendOne(to,c,token,track){

  const unsub=nlUnsubUrl(token,track?c.id:null);
  const fromEmail=nlFromEmail();
  const raw=nlBuildRaw({to, from:fromHeader(), subject:c.subject, html:nlEmailHtml(c,unsub,trk), text:nlEmailText(c,unsub),
    listUnsub:`<mailto:${fromEmail}?subject=Disiscrizione%20newsletter>, <${unsub}>`});
  return gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',body:JSON.stringify({raw})});
}

async function nlRun(){
  const c=nl.edit; if(!c)return;
  if(nl.sending){toast('Un invio è già in corso','warn');return}
  if(c.status==='draft' && !(await nlSave(true)))return;
  if(!nlCheckReady(c,true))return;
  nl.sending=c.id; nl.stop=false;
  try{
    if(c.status!=='sent'){
      const {data:total,error}=await nlSupa.rpc('newsletter_prepare',{p_campaign:c.id});
      if(error)throw error;
      c.status='sending'; c.total=total;
    }
    await nlLoadSends(c.id);
    nl.prog={sent:nl.sends.filter(s=>s.status==='sent').length, failed:nl.sends.filter(s=>s.status==='failed').length, total:nl.sends.length};
    render();
    let stopReason='';
    for(;;){
      if(nl.stop){stopReason='Invio messo in pausa: riprendi quando vuoi.';break}
      const {data:rows,error}=await nlSupa.rpc('newsletter_claim',{p_campaign:c.id,p_limit:1});
      if(error)throw error;
      if(!rows||!rows.length)break;
      const r=rows[0];
      if(!r.token){ await nlSupa.rpc('newsletter_mark',{p_send:r.send_id,p_status:'skipped',p_error:'disiscritto prima dell\'invio'}); continue; }
      try{
        const sent=await nlSendOne(r.email,c,r.token,true);
        await nlSupa.rpc('newsletter_mark',{p_send:r.send_id,p_status:'sent',p_gmail:sent&&sent.id||null});
        nl.prog.sent++;
      }catch(e){
        const m=String(e.message||e);
        if(/quota|rate ?limit|limit ?exceeded|429|sessione google scaduta|riconnetti/i.test(m)){
          await nlSupa.rpc('newsletter_mark',{p_send:r.send_id,p_status:'pending'}); // torna in coda, nessuna email persa
          stopReason=/sessione|riconnetti/i.test(m)?'Sessione Google scaduta: riconnetti e premi "Riprendi l\'invio".':'Gmail ha raggiunto il limite di invii: riprendi più tardi (di solito il giorno dopo).';
          break;
        }
        await nlSupa.rpc('newsletter_mark',{p_send:r.send_id,p_status:'failed',p_error:m.slice(0,280)});
        nl.prog.failed++;
      }
      nlProgressPaint();
      await nlSleep(NL.pauseMs);
    }
    if(stopReason) toast(stopReason,'warn'); else toast(nl.prog.failed?`Newsletter inviata · ${nl.prog.failed} non ${nl.prog.failed===1?'riuscita':'riuscite'}`:'Newsletter inviata',nl.prog.failed?'warn':'ok');
  }catch(e){toast('Invio interrotto: '+e.message,'err')}
  nl.sending=null; nl.stop=false;
  await nlLoad({keepView:true});
  const fresh=nl.camps.find(x=>x.id===c.id);
  if(fresh && nl.edit && nl.edit.id===c.id){nl.edit={...fresh};await nlLoadSends(c.id);}   // solo se sei ancora sulla sua pagina
  if(state.view==='newsletter') render(); else renderNav();
}

  const t=document.getElementById('nl-prog-t'); if(t)t.textContent=`${p.sent} inviate · ${p.failed} non riuscite · ${p.total} in tutto`;
}

function nlPickCsv(){document.getElementById('nlFile').click()}
function nlParseCsv(text){
  const lines=text.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length)return [];
  const sep=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';
  const split=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())};
  const head=split(lines[0]).map(h=>h.toLowerCase());
  let ie=head.findIndex(h=>/e-?mail/.test(h)); const hasHead=ie>=0; if(!hasHead)ie=0;
  const isrc=head.findIndex(h=>/fonte|source/.test(h)), idt=head.findIndex(h=>/iscritt|created|data/.test(h));
  return (hasHead?lines.slice(1):lines).map(l=>{const c=split(l);return {email:(c[ie]||'').toLowerCase(),source:isrc>=0?c[isrc]:'',date:idt>=0?c[idt]:''}});
}
let _nlImport=null;
function nlHandleCsv(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const rows=nlParseCsv(String(rd.result||''));
    const seen=new Set(nl.subs.map(s=>s.email)), batch=new Set();
    const ok=[]; let bad=0, dup=0;
    rows.forEach(r=>{
      if(!NL.emailRe.test(r.email)){bad++;return}
      if(seen.has(r.email)||batch.has(r.email)){dup++;return}
      batch.add(r.email);
      const d=r.date&&!isNaN(Date.parse(r.date))?new Date(r.date).toISOString():new Date().toISOString();
      const src=(r.source||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,60)||'importazione';
      ok.push({email:r.email,source:src,consent:true,consent_at:d,created_at:d});
    });
    _nlImport=ok;
    modal(`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-h"><h3>Importa iscritti</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
      <div class="modal-b">
        <table class="spend-table">
          <tr><td>Indirizzi nuovi da importare</td><td>${ok.length}</td></tr>
          <tr><td>Già presenti (saltati)</td><td>${dup}</td></tr>
          <tr><td>Non validi (saltati)</td><td>${bad}</td></tr>
        </table>
        <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45"><input type="checkbox" id="nl-imp-ok" style="margin-top:2px"> <span>Tutti questi indirizzi hanno dato il consenso a ricevere la newsletter (per esempio: gli iscritti esportati dal Journal).</span></label>
        <div class="helptip">Colonne riconosciute: email (obbligatoria), fonte, data di iscrizione. È lo stesso formato del CSV esportato da flowline.it/journal/admin.</div>
      </div>
      <div class="modal-f"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" ${ok.length?'':'disabled'} onclick="nlImportGo()">Importa ${ok.length}</button></div>
    </div>`);
  };
  rd.readAsText(file);
}
async function nlImportGo(){
  if(!document.getElementById('nl-imp-ok')?.checked){toast('Conferma il consenso per importare','warn');return}
  const rows=_nlImport||[]; let done=0;
  for(let i=0;i<rows.length;i+=500){
    const {error}=await nlSupa.from('newsletter_subscribers').upsert(rows.slice(i,i+500),{onConflict:'email',ignoreDuplicates:true});
    if(error){toast('Importazione: '+error.message,'err');break}
    done+=Math.min(500,rows.length-i);
  }
  closeModal(); _nlImport=null; await nlLoad(); if(done)toast(done+' iscritti importati','ok');
}
function nlExportCsv(){
  const cell=v=>{const s=String(v??'');return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=nlActive();
  const text=['email,fonte,iscritto_il,consenso_il',...rows.map(s=>[s.email,s.source,s.created_at,s.consent_at].map(cell).join(','))].join('\r\n');
  const url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:'newsletter-iscritti-'+isoD(today())+'.csv'});
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ---- importa ed esporta ---- */
function rqPickCsv(){document.getElementById('rqFile').click()}
let _rqImport=null;
function rqHandleCsv(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const text=String(rd.result||'').replace(/^﻿/,'');
    const recs=rqParseCsv(text);
    if(!recs.length){toast('Il file è vuoto','warn');return}
    const head=recs[0].map(h=>h.trim().toLowerCase());
    const col=(...names)=>{for(const n of names){const i=head.indexOf(n);if(i>=0)return i}return head.findIndex(h=>names.some(n=>h.includes(n)))};
    const C={nome:col('nome_cognome','nome','name'),email:col('email','e-mail'),az:col('nome_azienda','azienda','company'),tel:col('telefono','phone','tel'),
      desc:col('descrizione_progetto','descrizione','messaggio','message'),fonte:col('come_hai_sentito','fonte'),ruolo:col('ruolo_azienda','ruolo'),
      serv:col('servizio_interessato','servizio'),dt:col('created_at','data','date')};
    if(C.email<0){toast('Nel CSV manca la colonna email','err');return}
    const have=new Set(rq.rows.map(r=>r.email.toLowerCase()+'|'+String(r.created_at).slice(0,16)));
    const ok=[]; let bad=0,dup=0;
    recs.slice(1).forEach(c=>{
      const g=i=>i>=0?String(c[i]??'').trim():'';
      const email=g(C.email).toLowerCase();
      if(!NL.emailRe.test(email)){bad++;return}
      const dt=g(C.dt)&&!isNaN(Date.parse(g(C.dt)))?new Date(g(C.dt)).toISOString():new Date().toISOString();
      if(have.has(email+'|'+dt.slice(0,16))){dup++;return}
      have.add(email+'|'+dt.slice(0,16));
      const opt=v=>rqEmpty(v)?null:v;
      ok.push({created_at:dt,nome_cognome:g(C.nome)||email,email,nome_azienda:opt(g(C.az)),telefono:opt(g(C.tel)),descrizione_progetto:opt(g(C.desc)),
        come_hai_sentito:opt(g(C.fonte)),ruolo_azienda:opt(g(C.ruolo)),servizio_interessato:opt(g(C.serv)),stato:'contattata',origine:'journal'});
    });
    _rqImport=ok;
    modal(`<div class="modal" onclick="event.stopPropagation()">
      <div class="modal-h"><h3>Importa richieste</h3><div class="x" role="button" tabindex="0" aria-label="Chiudi" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
      <div class="modal-b">
        <table class="spend-table">
          <tr><td>Richieste da importare</td><td>${ok.length}</td></tr>
          <tr><td>Già presenti (saltate)</td><td>${dup}</td></tr>
          <tr><td>Senza email valida (saltate)</td><td>${bad}</td></tr>
        </table>
        <div class="form-row"><label for="rq-imp-st">Stato da dare alle richieste importate</label>
          <select id="rq-imp-st">${RQ_STATI.map(s=>`<option value="${s.id}" ${s.id==='contattata'?'selected':''}>${s.label}</option>`).join('')}</select>
          <span class="hint">Le richieste vecchie di solito le avete già gestite: per questo la proposta è "Contattata". Poi le cambi una per una.</span></div>
        <div class="helptip">Pensato per il CSV della tabella <code>consultations</code> esportato dal progetto Supabase FLOWLINE JOURNAL (Table Editor → Export → CSV). La data di arrivo resta quella originale.</div>
      </div>
      <div class="modal-f"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" ${ok.length?'':'disabled'} onclick="rqImportGo()">Importa ${ok.length}</button></div>
    </div>`);
  };
  rd.readAsText(file);
}
// CSV con campi tra virgolette che possono contenere a capo (le descrizioni)
function rqParseCsv(text){
  const first=text.split(/\r?\n/,1)[0]||'';
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
  const out=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'&&text[i+1]==='"'){cur+='"';i++} else if(ch==='"')q=false; else cur+=ch; continue; }
    if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur=''; if(row.some(x=>x.trim()))out.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.some(x=>x.trim()))out.push(row);
  return out;
}
async function rqImportGo(){
  const st=document.getElementById('rq-imp-st')?.value||'contattata';
  const rows=(_rqImport||[]).map(r=>({...r,stato:st})); let done=0;
  for(let i=0;i<rows.length;i+=500){
    const {error}=await nlSupa.from('richieste_sito').insert(rows.slice(i,i+500));
    if(error){toast('Importazione: '+error.message,'err');break}
    done+=Math.min(500,rows.length-i);
  }
  closeModal(); _rqImport=null; await rqLoad(); if(done)toast(done+(done===1?' richiesta importata':' richieste importate'),'ok');
}
function rqExportCsv(){
  const cell=v=>{const s=String(v??'');return /[",;\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const rows=rqShown();
  const head=['arrivata_il','nome_cognome','email','telefono','azienda','richiesta','come_ci_ha_conosciuto','stato','note'];
  const text=[head.join(','),...rows.map(r=>[r.created_at,r.nome_cognome,r.email,rqVal(r.telefono),rqVal(r.nome_azienda),rqVal(r.descrizione_progetto),rqVal(r.come_hai_sentito),rqStato(r.stato).label,r.note||''].map(cell).join(','))].join('\r\n');
  const url=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:'richieste-sito-'+isoD(today())+'.csv'});
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function ctFdate(d){if(!d)return '—';const [y,m,g]=String(d).split('-');return g+' '+CT_MS[+m-1]+' '+y.slice(2)}
function ctShiftM(k,d){const [y,m]=k.split('-').map(Number);const x=new Date(y,m-1+d,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}

function ctBalance(id){
  const c=ct.conti.find(x=>x.id===id); let s=c?+c.apertura||0:0;
  for(const m of ct.mov){ if(!ctCounts(m))continue; if(m.a_conto===id)s+=+m.importo; if(m.da_conto===id)s-=+m.importo }
  return Math.round(s*100)/100;
}
function ctDaVerificare(id){if(state.config.ctInclude)return 0;let s=0;for(const m of ct.mov){if(m.stato!=='da_verificare')continue;if(m.a_conto===id)s+=+m.importo;if(m.da_conto===id)s-=+m.importo}return Math.round(s*100)/100}
function ctOpenAmt(id){let s=0;for(const m of ct.mov){if(ctCounts(m))continue;if(m.a_conto===id)s+=+m.importo;if(m.da_conto===id)s-=+m.importo}return Math.round(s*100)/100}
/* Le quote ai soci (soldi che dal conto aziendale vanno sul conto personale di un socio) sono una ripartizione, non un costo:
   restano fuori da entrate e uscite e hanno una voce a parte. Nel database sono un trasferimento (tipo 'move') dal conto aziendale a un socio;
   le vecchie righe 'uscita' con categoria Stipendio/Quota verso un socio vengono lette come quote. */
const CT_QUOTA_RX=/^(stipendio|quota)/i;
function ctKind(m){
  if(m.tipo==='in')return 'in';
  const da=ct.conti.find(c=>c.id===m.da_conto), a=ct.conti.find(c=>c.id===m.a_conto);
  if(da&&a&&ctIsMain(da)&&!ctIsMain(a)&&(m.tipo==='move'||CT_QUOTA_RX.test(m.categoria||'')))return 'quota';
  return m.tipo;
}
function ctSums(list){let i=0,o=0,q=0;for(const m of list){if(!ctCounts(m))continue;const k=ctKind(m);if(k==='in')i+=+m.importo;else if(k==='out')o+=+m.importo;else if(k==='quota')q+=+m.importo}return{i,o,q}}
// effetto di un movimento sul conto aziendale (per l'anteprima dei movimenti da completare)
function ctEffMain(m){const mc=ctMain();if(!mc)return 0;return (m.a_conto===mc.id?+m.importo:0)-(m.da_conto===mc.id?+m.importo:0)}
const ctByMonth=k=>ct.mov.filter(m=>ctYM(m.data)===k);
const ctSorted=l=>[...l].sort((a,b)=>String(b.data||'0000').localeCompare(String(a.data||'0000'))||b.id-a.id);
const ctPending=()=>ct.mov.filter(m=>m.stato!=='completato');
function ctChip(list,id){const s=list.find(x=>x.id===id)||list[0];return `<span class="chip ${s.chip}"><span class="d"></span>${s.label}</span>`}

async function ctLoad(opts={}){
  if(!nlSupa||!nl.editor)return;
  ctInit(); ct.loading=true; if(state.view==='contabilita'&&!opts.silent) render();
  try{
    const {data:conti,error:e1}=await nlSupa.from('conti').select('id,nome,tipo,apertura,ordine').order('ordine').order('id');
    if(e1)throw e1;
    const mov=[]; let from=0;
    for(;;){
      const {data,error}=await nlSupa.from('movimenti').select(CT_COLS).order('id').range(from,from+999);
      if(error)throw error; mov.push(...data); if(data.length<1000)break; from+=1000;
    }
    ct.conti=conti.map(c=>({...c,apertura:+c.apertura})); ct.mov=mov.map(m=>({...m,importo:+m.importo})); ct.loaded=true; ct.missing=false;
  }catch(e){
    if(e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''))){ct.missing=true;ct.loaded=true}
    else toast('Contabilità: '+(e.message||e),'err');
  }
  ct.loading=false;
  if(state.view==='contabilita') render(); else renderNav();
}

  const b=document.getElementById('btnRefresh'); if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> Aggiorno…';}

}

function ctVal(id){const e=document.getElementById(id);return e?e.value:''}
async function ctSaveMov(ev,id){
  ev&&ev.preventDefault();
  const kind=ct.mtipo, tipo=kind==='quota'?'move':kind, importo=Math.round(parseFloat(ctVal('ct-f-imp'))*100)/100;
  if(!(importo>0)){toast('Inserisci un importo valido','warn');return}
  const rec={data:ctVal('ct-f-data')||null,descrizione:ctVal('ct-f-desc').trim(),importo,tipo,
    da_conto:tipo==='in'?null:(+ctVal('ct-f-da')||null),a_conto:+ctVal('ct-f-a')||null,
    categoria:ctVal('ct-f-cat').trim()||null,stato:ctVal('ct-f-stato'),riferimento:ctVal('ct-f-rif').trim()||null,note:ctVal('ct-f-note').trim()||null};
  if(kind==='quota'&&!rec.categoria)rec.categoria='Quota soci';
  if(!rec.descrizione){toast('Scrivi una descrizione','warn');return}
  if(kind==='quota'){const da=ct.conti.find(c=>c.id===rec.da_conto),a=ct.conti.find(c=>c.id===rec.a_conto);if(!da||!ctIsMain(da)){toast('Una quota parte dal conto aziendale','warn');return}if(!a||ctIsMain(a)){toast('Scegli il socio che riceve la quota','warn');return}}
  if(tipo==='in'&&!rec.a_conto){toast('Scegli il conto su cui arrivano i soldi','warn');return}
  if(tipo==='out'&&!rec.da_conto){toast('Scegli da quale conto esce il pagamento','warn');return}
  if(tipo==='move'&&(!rec.da_conto||!rec.a_conto||rec.da_conto===rec.a_conto)){toast('Un trasferimento richiede due conti diversi','warn');return}
  const btn=document.getElementById('ct-save');if(btn){btn.disabled=true}
  const q=id?nlSupa.from('movimenti').update(rec).eq('id',id):nlSupa.from('movimenti').insert(rec);
  const {data,error}=await q.select(CT_COLS).single();
  if(error){toast(error.message,'err');if(btn)btn.disabled=false;return}
  const i=ct.mov.findIndex(x=>x.id===data.id); const row={...data,importo:+data.importo};
  if(i>=0)ct.mov[i]=row; else ct.mov.push(row);
  closeModal(); render(); toast(id?'Movimento aggiornato':'Movimento aggiunto','ok');
}
async function ctDeleteMov(id){
  const m=ct.mov.find(x=>x.id===id); if(!m)return;

  ct.mov=ct.mov.filter(x=>x.id!==id); closeModal(); render(); toast('Movimento eliminato','ok');
}

        <div class="form-row"><label for="ct-f-stato">Stato</label><select id="ct-f-stato">${CT_STATI.map(s=>`<option value="${s.id}" ${s.id===t.stato?'selected':''}>${s.label}</option>`).join('')}</select>

      <div>${m?`<button type="button" class="btn sm ghost danger" onclick="ctDeleteMov(${m.id})">Elimina</button>`:''}</div>
      <div style="display:flex;gap:9px"><button type="button" class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" id="ct-save" type="submit">Salva</button></div>
